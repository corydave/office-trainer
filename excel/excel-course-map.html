<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excel Course Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Five-week Microsoft Excel course map for FLCC with MOS MO-210 crosswalk, outcome evidence and standards alignment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Comfortaa:wght@500;700&display=swap">
<style>
/* =====================================================================
   DESIGN TOKENS
   Layout concept: a Word-style ruler across the top doubles as the week
   navigator; below it, tabbed panels (overview, map, matrix, crosswalk,
   evidence, standards, sources). Every color lives here as a token so
   light and dark themes both work. Small text meets 7:1 contrast (AAA).
   ===================================================================== */
:root {
  --bg: #f5f7fb;          /* page background - a cool, blue-leaning neutral */
  --surface: #ffffff;     /* cards and tables */
  --surface-2: #eef2f9;   /* table headers, quiet fills */
  --ink: #111a2e;         /* main text */
  --muted: #424a57;       /* secondary text (7:1 on every surface) */
  --line: #d3dae8;        /* borders and rules */
  --blue: #0046ad;        /* FLCC / FLX primary - links, active states */
  --blue-soft: #e3ecfa;
  --green: #305305;       /* "assessed" and "covered" */
  --green-soft: #e8f0df;
  --orange: #8a2905;      /* flags (darkened brand orange so small text clears 7:1) */
  --orange-fill: #a23108; /* brand orange for borders and marks */
  --orange-soft: #f8e6df;
  --ruler: #fbfcfe;
  --tick: #8d99b0;
  --focus: #0046ad;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Comfortaa", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  --step--1: 0.875rem; --step-0: 1rem; --step-1: 1.2rem; --step-2: 1.5rem; --step-3: 2.1rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1220; --surface: #131b2c; --surface-2: #1a2438; --ink: #e9eef8; --muted: #b4bfd3;
    --line: #2b3852; --blue: #9cbcff; --blue-soft: #1b2c4f; --green: #a6d585; --green-soft: #1d2e1a;
    --orange: #ffab8a; --orange-fill: #ff8f63; --orange-soft: #3a2018; --ruler: #151e31; --tick: #5d6b86;
    --focus: #9cbcff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1220; --surface: #131b2c; --surface-2: #1a2438; --ink: #e9eef8; --muted: #b4bfd3;
  --line: #2b3852; --blue: #9cbcff; --blue-soft: #1b2c4f; --green: #a6d585; --green-soft: #1d2e1a;
  --orange: #ffab8a; --orange-fill: #ff8f63; --orange-soft: #3a2018; --ruler: #151e31; --tick: #5d6b86;
  --focus: #9cbcff; color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.55;
}
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-3); font-weight: 700; }
h2 { font-size: var(--step-2); font-weight: 700; }
h3 { font-size: var(--step-1); font-weight: 700; }
p { margin: 0; max-width: 70ch; }
a { color: var(--blue); }
code, .code { font-family: var(--font-mono); font-size: 0.9em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: -9999px; top: 0; }
.skip:focus { left: 16px; top: 8px; z-index: 50; background: var(--surface); padding: 8px 12px; }
.muted { color: var(--muted); }
.eyebrow { font-size: var(--step--1); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- masthead ---------- */
.masthead { padding-block: 28px 18px; }
.masthead .wrap { display: flex; flex-direction: column; gap: 14px; }
.masthead-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start; }
.lede { font-size: var(--step-1); color: var(--muted); max-width: 62ch; }
.theme-btn {
  font: inherit; font-size: var(--step--1); padding: 6px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-display); font-size: var(--step-2); font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--step--1); color: var(--muted); }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- ruler (week navigator) ---------- */
.ruler-band { padding-block: 6px 0; }
.ruler {
  position: relative; border: 1px solid var(--line); border-radius: 6px; background-color: var(--ruler);
  /* inch ticks: tall every 20%, small every 2.5% - like Word's horizontal ruler */
  background-image:
    repeating-linear-gradient(to right, var(--tick) 0 1px, transparent 1px 20%),
    repeating-linear-gradient(to right, var(--tick) 0 1px, transparent 1px 2.5%);
  background-size: 100% 12px, 100% 6px; background-repeat: no-repeat; background-position: 0 0, 0 0;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
}
.ruler button {
  font: inherit; text-align: left; background: transparent; border: 0; color: var(--ink); cursor: pointer;
  padding: 18px 10px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.ruler button .n { font-family: var(--font-mono); font-size: var(--step--1); color: var(--muted); }
.ruler button .t { font-weight: 700; font-size: var(--step--1); overflow-wrap: anywhere; }
.ruler button[aria-current="true"] { background: var(--blue-soft); }
.ruler button[aria-current="true"] .n { color: var(--blue); font-weight: 700; }
/* the little tab-stop marker under the active week */
.ruler button[aria-current="true"]::after {
  content: ""; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent;
  border-bottom: 8px solid var(--blue); margin-top: 4px;
}
@media (max-width: 560px) { .ruler button .t { display: none; } .ruler button { padding-inline: 6px; } }

/* ---------- tabs ---------- */
.tabs-band { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tablist { display: flex; gap: 4px; overflow-x: auto; padding-block: 10px 0; scrollbar-width: thin; }
.tab {
  font: inherit; font-weight: 700; font-size: var(--step--1); white-space: nowrap; cursor: pointer;
  padding: 9px 14px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0;
  background: transparent; color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--blue); border-color: var(--line); margin-bottom: -1px; }
main { padding-block: 24px 56px; }
[role="tabpanel"] { outline: none; }

/* ---------- generic pieces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.grid-weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.week-card { display: flex; flex-direction: column; gap: 10px; }
.week-card .num { font-family: var(--font-mono); color: var(--muted); font-size: var(--step--1); }
.week-card .proj { font-size: var(--step--1); }
.btn {
  font: inherit; font-size: var(--step--1); font-weight: 700; cursor: pointer; align-self: flex-start;
  padding: 7px 12px; border-radius: 8px; border: 1px solid var(--blue); background: transparent; color: var(--blue);
}
.btn:hover { background: var(--blue-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: var(--step--1); line-height: 1.3;
  padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
}
button.chip { font: inherit; font-size: var(--step--1); cursor: pointer; }
button.chip:hover { border-color: var(--blue); color: var(--blue); }
/* Standards chips that link out to the official framework pages */
a.chip { text-decoration: none; color: var(--blue); }
a.chip:hover { border-color: var(--blue); text-decoration: underline; }
a.chip .ext { font-size: 0.85em; }
.chip.code { font-family: var(--font-mono); }
.pill { display: inline-block; font-size: var(--step--1); font-weight: 700; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.pill.web { background: var(--blue-soft); color: var(--blue); }
.pill.desktop { background: var(--orange-soft); color: var(--orange); }
.pill.both { background: var(--surface-2); color: var(--muted); }
.pill.full { background: var(--green-soft); color: var(--green); }
.pill.partial { background: var(--blue-soft); color: var(--blue); }
.pill.none { background: var(--surface-2); color: var(--muted); }
.pill.flag { background: var(--orange-soft); color: var(--orange); }
.pill.info { background: var(--blue-soft); color: var(--blue); }

/* I / R / A marks: shape AND letter carry meaning, not color alone */
.mark {
  display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%;
  font-weight: 700; font-size: 0.8rem; border: 2px solid var(--blue); color: var(--blue); background: var(--surface);
}
.mark.R { background: linear-gradient(90deg, var(--blue-soft) 50%, var(--surface) 50%); }
.mark.A { background: var(--green); border-color: var(--green); color: var(--surface); }
.marks { display: inline-flex; gap: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: var(--step--1); color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- tables ---------- */
/* position: relative keeps hidden screen-reader labels inside the scroll box (no page-wide overflow) */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
thead th { background: var(--surface-2); font-weight: 700; position: sticky; top: 0; }
tbody tr:last-child > * { border-bottom: 0; }
td.center, th.center { text-align: center; }
td.num { font-family: var(--font-mono); white-space: nowrap; }
tr.group td { background: var(--surface-2); font-weight: 700; }
.matrix td.center { min-width: 64px; }
.matrix th[scope="row"] { font-weight: 400; min-width: 240px; }

/* ---------- week detail ---------- */
.week-select { display: flex; flex-wrap: wrap; gap: 8px; }
.week-select button {
  font: inherit; font-weight: 700; font-size: var(--step--1); cursor: pointer; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.week-select button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--surface); }
.week-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 20px; align-items: start; }
@media (max-width: 900px) { .week-layout { grid-template-columns: minmax(0, 1fr); } }
.objectives { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.objectives li { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 8px; }
.objectives .oid { font-family: var(--font-mono); font-weight: 700; color: var(--blue); }
.aside-block { display: flex; flex-direction: column; gap: 6px; }
.aside-block + .aside-block { border-top: 1px solid var(--line); padding-top: 12px; }
dl.why { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; }
dl.why dt { font-weight: 700; }
dl.why dd { margin: 0; }
/* Callout box: the accent is a thin, fully rounded "pill" bar drawn with ::before,
   instead of a square left border. It is the same 4px width as the old border. */
.callout { position: relative; background: var(--blue-soft); padding: 10px 14px 10px 24px; border-radius: 8px; }
.callout::before {
  content: ""; position: absolute; left: 9px; top: 10px; bottom: 10px;
  width: 4px; border-radius: 999px;   /* 999px = ends fully rounded at any height */
  background: var(--blue);
}
.callout.warn { background: var(--orange-soft); }
.callout.warn::before { background: var(--orange-fill); }

/* ---------- coverage bars (MOS domains) ---------- */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr) 6.5em; gap: 12px; align-items: center; font-size: var(--step--1); }
.bar { height: 14px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; display: flex; }
.bar .checked { background: var(--green); }
.bar .drilled { background: repeating-linear-gradient(45deg, var(--blue) 0 3px, var(--blue-soft) 3px 6px); }
.bar-row .val { font-variant-numeric: tabular-nums; text-align: right; }
@media (max-width: 640px) { .bar-row { grid-template-columns: minmax(0, 1fr) 5.5em; } .bar-row .bar { grid-column: 1 / -1; } }
.swatch { display: inline-block; width: 14px; height: 10px; border-radius: 3px; border: 1px solid var(--line); }
.swatch.checked { background: var(--green); }
.swatch.drilled { background: repeating-linear-gradient(45deg, var(--blue) 0 3px, var(--blue-soft) 3px 6px); }

/* grading bar */
.grade-bar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.grade-bar div { display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; color: var(--surface); min-width: 0; }
.g0 { background: var(--muted); } .g1 { background: var(--blue); } .g2 { background: var(--green); } .g3 { background: var(--orange-fill); } .g4 { background: var(--ink); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: var(--step--1); font-weight: 700; }
.filters input, .filters select {
  font: inherit; font-weight: 400; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); min-width: 0;
}
.filters input { width: min(280px, 100%); }
.filters select { max-width: 100%; }
/* on phones, wide tables keep readable columns and scroll sideways inside their box */
@media (max-width: 640px) { .table-wrap table { min-width: 600px; } }
.result-count { font-size: var(--step--1); color: var(--muted); }

/* evidence cards */
.evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
@media (max-width: 400px) { .evidence-grid { grid-template-columns: minmax(0, 1fr); } }
dl.ev { margin: 0; display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 6px 10px; font-size: var(--step--1); }
dl.ev dt { font-weight: 700; color: var(--muted); }
dl.ev dd { margin: 0; }
.subnav { display: flex; flex-wrap: wrap; gap: 8px; }
.subnav a { font-size: var(--step--1); font-weight: 700; }

footer { border-top: 1px solid var(--line); padding-block: 18px 32px; font-size: var(--step--1); color: var(--muted); }

@media (prefers-reduced-motion: no-preference) { .tab, .btn, .chip { transition: background-color .15s, color .15s; } }
/* Printing the local file (Ctrl/Cmd+P) shows every panel */
@media print {
  .tabs-band, .ruler-band, .theme-btn, .filters, .week-select { display: none !important; }
  [role="tabpanel"][hidden] { display: block !important; }
  .card, .table-wrap { break-inside: avoid; }
}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="wrap">
    <div class="masthead-top">
      <div class="stack">
        <span class="eyebrow" id="meta-line"></span>
        <h1 id="page-title"></h1>
        <p class="lede" id="lede"></p>
      </div>
      <!-- Theme toggle: cycles system -> light -> dark. Remembered per browser when storage is allowed. -->
      <button type="button" class="theme-btn" id="theme-btn" aria-live="polite">Theme: system</button>
    </div>
    <div class="stats" id="stats" aria-label="Coverage summary"></div>
  </div>
</header>

<nav class="ruler-band" aria-label="Weeks">
  <div class="wrap"><div class="ruler" id="ruler"></div></div>
</nav>

<div class="tabs-band">
  <div class="wrap">
    <div class="tablist" role="tablist" aria-label="Course map views" id="tablist"></div>
  </div>
</div>

<main id="main" tabindex="-1">
  <div class="wrap" id="panels"></div>
</main>

<footer>
  <div class="wrap" id="footer"></div>
</footer>

llege": "Lab data, club budgets and group schedules start as a spreadsheet someone else has to read.", "work": "Nearly every job posting that lists software lists Excel; clean, printable sheets are the baseline.", "life": "A monthly budget, a move checklist or a fantasy league is easier to keep up when it's organized."}, "objectives": [["W1.1", "Identify the parts of the Excel window (Ribbon, formula bar, Name Box, active cell, sheet tabs, status bar, Quick Access Toolbar) and switch among Normal, Page Layout and Page Break Preview views.", ["CLO2", "CLO6"]], ["W1.2", "Create, name and save workbooks, and add, rename, color, move and delete worksheets.", ["CLO1"]], ["W1.3", "Enter and edit data with Auto Fill, insert and delete rows, columns and cells, use Paste Special, and search with Find and Replace.", ["CLO1", "CLO2"]], ["W1.4", "Format cells: number formats, alignment, orientation, indent, wrap, merge, borders and fill, cell styles, Format Painter and Clear Formats, including several sheets at once.", ["CLO1", "CLO2"]], ["W1.5", "Freeze panes, adjust rows and columns, set up the page (orientation, scaling, margins, print area, headers and footers), set properties and print or export a PDF.", ["CLO1"]]], "drills": [["D1.01", "Open the starter workbook and save it to your course folder as Lastname_E1_Rentals.xlsx.", [], ["N1", "N2"], "web"], ["D1.02", "Rename Sheet1 to June, add a sheet named July, give June a tab color and move July after June.", [], ["N11"], "web"], ["D1.03", "Add Save As and Print Preview to the Quick Access Toolbar, then name four parts of the window in the drill quiz.", ["1.4.1"], ["N3"], "desktop"], ["D1.04", "Freeze the top row and first column, switch to Page Layout view, then open a second window of the workbook and arrange them side by side.", ["1.4.2", "1.4.3", "1.4.4"], ["N8"], "desktop"], ["D1.05", "Use Find to count every single-kayak rental, then replace every Kayak (single) with Solo kayak.", ["1.2.1"], ["N4"], "web"], ["D1.06", -ready page with a footer. Submit .xlsx and .pdf.", "criteria": [["P1-a", "The budget is organized: clear sections, labeled rows and columns, sensible sheet name, no blank spacer rows inside the data.", ["CLO1"], 25], ["P1-b", "Formatting uses Excel tools on purpose: number formats, cell styles, alignment, column widths (no spaces or merged cells as workarounds).", ["CLO1", "CLO2"], 25], ["P1-c", "Navigation and views help the reader: frozen headings and a second sheet for notes or a second month.", ["CLO2"], 20], ["P1-d", "Print-ready: page setup, print area, footer and properties are set; the PDF matches the workbook.", ["CLO1"], 30]]}, "ai": "Optional: ask an AI tool to suggest budget categories for your situation, then decide which ones fit. Never paste real account numbers or balances into an AI tool.", "privacy": "Budgets are personal. Made-up or rounded numbers are always fine, and nothing in the course asks for real account details.", "platform": "Most of this week works in Excel for the web. The Quick Access Toolbar, Page Layout view, side-by-side windows, grouping sheets and full page setup are easier or only available in desktop Excel.", "nace": ["Professionalism", "Technology", "Communication"], "digcomp": ["Content creation", "Information search, evaluation and management"], "wcag": ["1.3.1", "2.4.2"], "life": "A budget and a clean, printable spreadsheet you can reuse every month.", "hours": "About 9 hours: 2 h lessons and videos, 3 h drills, 1 h skill check, 3 h project"}, {"id": "W2", "n": 2, "title": "Formulas That Work", "tagline": "Let Excel do the math: formulas, references, everyday functions and names.", "clos": {"CLO2": "RA", "CLO1": "R"}, "topics": ["T4"], "why": {"college": "Grade calculators, lab averages and statistics homework are formulas you can check.", "work": "Invoices, timesheets and price lists depend on formulas that stay right when the numbers change.", "life": "Splitting bills, comparing phone plans and tracking savings goals take a few good formulas."}, "objectives": [["W2.1", "Write formulas with operators and parentheses, and use relative, absolute and mixed references so formulas fill correctly.", ["CLO2"]], ["W2.2", "Summarize data with SUM(), AVERAGE(), MIN(), MAX(), COUNT(), COUNTA() and COUNTBLANK(), and make decisions with IF().", ["CLO2"]], ["W2.3", "Define and use named ranges, navigate with the Name Box, and insert and remove hyperlinks.", ["CLO2"]], ["W2.4", "Clean and combine text with LEFT(), RIGHT(), MID(), UPPER(), LOWER(), LEN(), CONCAT() and TEXTJOIN(), and generate data with SEQUENCE() and RANDBETWEEN().", ["CLO2"]], ["W2.5", "Display formulas and use error checking to find and fix formula mistakes.", ["CLO1", "CLO2"]]], "drills": [["D2.01", "Write line-total and subtotal formulas with +, -, * and /, using parentheses where the order matters.", [], ["N12"], "web"], ["D2.02", "Calculate sales tax from one tax-rate cell with an absolute reference, and fill it down.", ["4.1.1"], [], "web"], ["D2.03", "Build a price-by-quantity grid with mixed references in one formula filled across and down.", ["4.1.1"], [], "web"], ["D2.04", "Display formulas to find the hard-typed total, then fix the #DIV/0! error the error checker flags.", ["1.4.6"], ["E3.5"], "web"], ["D2.05", "Total, average and find the highest and lowest weekly rentals with AutoSum and the functions.", ["4.2.1"], ["N14"], "web"], ["D2.06", "Count the numeric entries, the filled cells and the blank cells in the sign-up list.", ["4.2.2"], [], "web"], ["D2.07", "Use IF() to label each rental Late or On time.", ["4.2.3"], [], "web"], ["D2.08", "Name the tax-rate cell TaxRate, use the name in a formula, and jump to a named range with the Name Box.", ["2.3.1", "2.3.2", "1.2.2"], [], "web"], ["D2.09", "Link the summary to the Details sheet and to the company website; remove the broken link.", ["1.2.3"], [], "web"], ["D2.10", "Pull the first initial and last four digits out of member codes, and fix name capitalization and lengths.", ["4.3.1", "4.3.2"], ["E2.1"], "web"], ["D2.11", "Build full names and an email list with CONCAT() and TEXTJOIN().", ["4.3.3"], [], "web"], ["D2.12", "Number the invoice lines with SEQUENCE() and make practice data with RANDBETWEEN().", ["2.1.5"], ["E3.3"], "web"]], "skillcheck": {"id": "SC2", "covers": ["1.2.2", "1.2.3", "1.4.6", "2.1.5", "2.3.1", "2.3.2", "4.1.1", "4.2.1", "4.2.2", "4.2.3", "4.3.1", "4.3.2", "4.3.3"], "desc": "Timed, MOS-style: 13 tasks on an order-tracking workbook, auto-checked, 2 attempts."}, "project": {"id": "P2", "title": "Invoice and Grade Calculator", "desc": "Two sheets: a reusable invoice (line totals, subtotal, tax from a named rate, total, invoice numbers built with text functions) and a course grade calculator with weighted categories and an IF() status. Use made-up names and scores.", "criteria": [["P2-a", "Every calculated cell is a formula; nothing is typed that Excel should calculate.", ["CLO2"], 25], ["P2-b", "References are right: absolute or named for fixed values, relative for filled formulas; the sheets still work when inputs change.", ["CLO2"], 25], ["P2-c", "Functions fit the job: SUM, AVERAGE, COUNT family, IF and text functions used correctly.", ["CLO2"], 25], ["P2-d", "The workbook is readable and printable: labels, number formats, a named input area and page setup.", ["CLO1"], 25]]}, "ai": "Optional: ask an AI tool to explain a formula you don't understand, then test its explanation by changing an input. AI tools often get cell references subtly wrong, so check every formula they suggest.", "privacy": "The grade calculator uses made-up students. Never put real classmates' names or grades into a practice file or an AI tool.", "platform": "Everything this week works in Excel for the web and desktop Excel.", "nace": ["Critical Thinking", "Technology", "Professionalism"], "digcomp": ["Content creation", "Problem identification and solving"], "wcag": ["2.4.4"], "life": "An invoice and a grade calculator you'll actually use, and formulas you can trust.", "hours": "About 9 hours: 2 h lessons, 3.5 h drills, 1 h skill check, 2.5 h project"}, {"id": "W3", "n": 3, "title": "Tables and Data", "tagline": "Bring data in, organize it as a table, and make the pattern visible.", "clos": {"CLO2": "R", "CLO1": "R"}, "topics": ["T3", "T4", "T5"], "why": {"college": "Research, lab and survey data arrive as files you have to clean, sort and summarize.", "work": "Exports from other systems (sales, inventory, attendance) land in Excel every day.", "life": "Comparing apartments, tracking workouts or a club roster is easier as a sortable table."}, "objectives": [["W3.1", "Import data from text (.csv and .txt) files and online sources, and remove duplicate records.", ["CLO2"]], ["W3.2", "Create, name and style Excel tables; add and remove rows and columns; set style options and a total row; convert a table back to a range.", ["CLO1", "CLO2"]], ["W3.3", "Use structured references, and sort and filter data, including with the SORT() and UNIQUE() functions.", ["CLO2"]], ["W3.4", "Summarize data visually with built-in conditional formatting and sparklines, and remove formatting rules.", ["CLO1", "CLO2"]]], "drills": [["D3.01", "Import the rentals .csv file into a new sheet, then remove the duplicate rows.", ["1.1.1"], ["E2.2"], "desktop"], ["D3.02", "Import a table of lake data from a web page with Get Data From Web.", ["1.1.2"], [], "desktop"], ["D3.03", "Turn the rental list into a table named Rentals with a medium table style.", ["3.1.1", "3.1.2"], [], "web"], ["D3.04", "Turn on banded columns and a total row (sum and average), add a Deposit column and delete the empty row.", ["3.2.1", "3.2.2", "3.2.3"], [], "web"], ["D3.05", "Calculate each rental's cost with a structured reference such as [@Hours]*[@Rate].", ["4.1.2"], [], "web"], ["D3.06", "Convert the old price table back to a normal range.", ["3.1.3"], [], "web"], ["D3.07", "Sort by Boat then by Date (newest first), and filter to show only the w les and data labels, and move the legend to the bottom.", ["5.2.3"], [], "web"], ["D4.05", "Apply a quick layout and a chart style, then add alternative text that states the chart's point.", ["5.3.1", "5.3.2", "5.3.3"], [], "desktop"], ["D4.06", "Insert the logo picture, a callout shape with text, an icon and a SmartArt process; give each alt text or mark it decorative.", [], [], "desktop"], ["D4.07", "Apply a theme, create a cell style named Entry, and save the workbook as a template.", ["2.2.7"], [], "desktop"], ["D4.08", "Use PMT() for a boat loan, then Goal Seek the price that keeps the payment at $250.", [], ["E3.4"], "desktop"], ["D4.09", "Create Low, Expected and High season scenarios and a scenario summary report.", [], ["E3.4"], "desktop"], ["D4.10", "Build a one-variable data table that shows the payment at five interest rates.", [], [], "desktop"]], "skillcheck": {"id": "SC4", "covers": ["5.1.1", "5.1.2", "5.2.1", "5.2.2", "5.2.3", "5.3.1", "5.3.2", "5.3.3", "2.2.7"], "desc": "Timed, MOS-style: 11 tasks on a season sales workbook (a chart sheet, series, elements, layout, style and alt text, a cell style, Goal Seek and two scenarios), auto-checked, 2 attempts."}, "project": {"id": "P4", "title": "Business Plan Workbook", "desc": "A plan for a small business or club idea of your own (a food truck, tutoring, a fundraiser): an Inputs sheet formatted with your own cell style, a Plan sheet with formulas and a PMT() loan payment, Goal Seek for a break-even or target price, at least three scenarios with a summary report, a one-variable data table, a chart that makes the plan's point, and a graphic, all in a theme other than Office.", "criteria": [["P4-a", "Goal Seek, the scenarios with a summary, and the data table are set up correctly and answer real questions about the plan.", ["CLO3"], 25], ["P4-b", "The chart fits the data, shows the main point, and has a title, useful elements and alt text that states the point.", ["CLO5"], 25], ["P4-c", "The graphic is placed and sized well and has alt text or is marked decorative.", ["CLO4"], 15], ["P4-d", "The formulas, including PMT(), are correct and use cell references, so the what-if tools work.", ["CLO3"], 20], ["P4-e", "The workbook uses a theme and a custom cell style, has real sheet names and a Title, and the written findings are accurate.", ["CLO1", "CLO2"], 15]]}, "ai": "Optional: ask an AI tool what assumptions a loan or price model should include, and add the ones that fit. Treat any interest rate it gives you as an example, not a quote.", "privacy": "Use made-up or rounded figures for anything personal, like income or debt.", "platform": "Charts, chart elements, styles, alt text and pictures work in Excel for the web. Chart sheets, quick layouts, SmartArt, Scenario Manager, data tables and templates need desktop Excel; Goal Seek is in newer Excel for the web but not every version.", "nace": ["Critical Thinking", "Communication", "Technology"], "digcomp": ["Content creation", "Problem identification and solving"], "wcag": ["1.1.1", "1.4.1", "1.4.3"], "life": "A planner for your next big decision, and charts that make a point.", "hours": "About 9 hours: 2.5 h lessons, 3 h drills, 1 h skill check, 2.5 h project"}, {"id": "W5", "n": 5, "title": "Share, Publish and Work Together", "tagline": "Review with others, combine their work, then share and publish safely. Capstone and certification practice.", "clos": {"CLO7": "IA", "CLO6": "A", "CLO1": "RA", "CLO2": "RA", "CLO3": "A", "CLO4": "A", "CLO5": "A"}, "topics": ["T5", "T7"], "why": {"college": "Group budgets, shared data and instructor feedback arrive as comments in a shared workbook.", "work": "Several people edit the same budget or schedule; someone has to combine their versions and protect the formulas.", "life": "Sharing a family or club spreadsheet safely - without hidden data or broken formulas - saves arguments."}, "objectives": [["W5.1", "Add, reply to, resolve and delete comments, and add, edit and delete notes.", ["CLO7"]], ["W5.2", "Co-author a shared workbook, review version history and Show Changes, and combine reviewers' workbooks with external references and Consolidate (the modern way to compare and combine).", ["CLO7"]], ["W5.3", "Inspect a workbook and fix accessibility and compatibility issues, and protect worksheets and workbook structure.", ["CLO1", "CLO7"]], ["W5.4", "Save and export workbooks as a web page, PDF and CSV, and preview the web page in a browser.", ["CLO6"]], ["W5.5", "Show exam readiness on a timed MO-210 style practice test and assemble a course portfolio.", ["CLO1", "CLO2", "CLO3", "CLO4", "CLO5", "CLO7"]]], "drills": [["D5.01", "Add a note and a comment, reply to and resolve one comment, and delete an old note.", ["1.5.5"], [], "web"], ["D5.02", "Co-edit a shared copy with a partner, open Show Changes, and restore an earlier version from version history.", [], ["E1.1"], "both-check"], ["D5.03", "Combine three reviewers' budget workbooks: link a total to another workbook, then Consolidate the three sheets into one.", [], ["E1.1", "E3.4"], "desktop"], ["D5.04", "Run Inspect Document to remove comments, hidden sheets and personal information, then run Check Compatibility.", ["1.5.4"], [], "desktop"], ["D5.05", "Run Check Accessibility and fix every error: alt text, default sheet names, a table with a real name.", ["1.5.4"], [], "web"], ["D5.06", "Unlock the input cells, protect the sheet, add data validation to the sign-up column, and protect the workbook structure.", [], ["E1.2", "E2.2"], "desktop"], ["D5.07", "Save the schedule as a web page, open it in a browser, and export a CSV copy of the data.", ["1.5.2"], [], "both-check"]], "skillcheck": {"id": "SC5", "covers": ["1.4.5", "1.5.4", "1.5.5", "5.3.3"], "desc": "Timed, MOS-style: 14 tasks on a volunteer roster (comments, notes, accessibility, inspection, data validation, sheet and structure protection), auto-checked, 2 attempts."}, "project": {"id": "P5", "title": "Team Event Workbook", "desc": "With one or two classmates, plan a small event in one co-authored OneDrive workbook: comment threads with replies and @mentions, edits from each teammate in Show Changes, and Version History. Then make a clean final copy with a Combined sheet (external references or Consolidate), a protected sign-up sheet with data validation, structure protection, no comments, hidden sheets or personal information, and no accessibility errors, and save a web page and a PDF of the main sheet.", "criteria": [["P5-a", "The shared workbook shows real co-authoring: edits from each teammate in Show Changes, comment threads with replies and @mentions, resolved where settled.", ["CLO7"], 25], ["P5-b", "The Combined sheet correctly links to or consolidates each teammate's work, and the totals are right.", ["CLO7"], 20], ["P5-c", "The sign-up sheet works for others: entry cells unlocked, useful data validation, sheet and structure protected.", ["CLO1", "CLO7"], 20], ["P5-d", "The final copy is inspected and accessible: no comments, hidden sheets or personal information, and no accessibility errors.", ["CLO1"], 20], ["P5-e", "The web page and PDF look right in a browser and a PDF reader, with a sensible title.", ["CLO6"], 15]]}, "capstone": {"id": "CAP", "title": "Capstone: Practice Exam and Portfolio", "desc": "A timed, 50-minute MO-210 style practice exam covering all five domains (Certiport practice tests if FLCC has access; otherwise the Office Trainer capstone set), plus a portfolio of the five projects with a short reflection on which skills you will use next and where.", "clos": ["CLO1", "CLO2", "CLO3", "CLO4", "CLO5", "CLO6", "CLO7"]}, "ai": "Optional: Copilot in Excel can summarize a sheet or suggest a formula. Treat its suggestions like a reviewer's comment: check them, then decide.", "privacy": "Shared workbooks carry hidden data: names in comments, hidden sheets, file properties. Inspect before you share, and share view-only unless people need to edit.", "platform": "Comments, notes, co-authoring, version history, Show Changes and the accessibility checker work in Excel for the web. Consolidate, Inspect Document, Check Compatibility, protecting workbook structure and Save as Web Page need desktop Excel.", "nace": ["Teamwork", "Communication", "Professionalism", "Technology"], "digcomp": ["Communication and collaboration", "Safety, wellbeing and responsible use"], "wcag": ["1.1.1", "1.3.1", "2.4.2", "2.4.6"], "life": "Safe sharing habits for any shared spreadsheet - plus a certification attempt if wanted.", "hours": "About 9 hours: 1.5 h lessons, 2 h drills, 1 h skill check, 2.5 h project, 2 h capstone"}], "grading": [["Practice drills (completion, unlimited tries)", 15], ["Weekly skill checks SC1-SC5 (4% each)", 20], ["Projects P1-P4 (10% each)", 40], ["Project P5 Team Budget Review", 10], ["Capstone practice exam and portfolio", 15]], "northstar": [["N1", "Open and close a workbook.", "W1", "D1.01"], ["N2", "Save a workbook, being intentional about name and location.", "W1", "D1.01"], ["N3", "Identify parts of Excel Screen: ribbon, formula bar, active cell, name box, column letter, row number, Quick Access Toolbar.", "W1", "D1.03"], ["N4", "Locate a specific cell.", "W1", "D1.05"], ["N5", "Enter data in a cell.", "W1", "D1.06"], ["N6", "Copy and move cell entries.", "W1", "D1.07"], ["N7", "Format cells and text: bold, underline, size, merge and center, wrap text, number (currency, time, percentages, etc.)", "W1", "D1.08, D1.09"], ["N8", "Create headings and freeze them.", "W1", "D1.04"], ["N9", "Insert and delete rows and columns.", "W1", "D1.06"], ["N10", "Adjust row and column size.", "W1", "D1.11"], ["N11", "Identify worksheet tabs, create a new tab, rename tabs, and rearrange tabs.", "W1", "D1.02"], ["N12", "Write a formula in the formula bar (-, +, *, /).", "W2", "D2.01"], ["N13", "Select a range.", "W1", "D1.13"], ["N14", "Use Auto Fill and AutoSum (Sum, Average, etc.) and understand the differences between them.", "W1", "D1.06, D2.0 rts, chart sheets, SmartArt, Scenario Manager, data tables, Consolidate, Inspect Document, Save as Web Page). Chromebook users will need campus labs or a virtual desktop for those tasks. Each drill is tagged web or desktop."], ["PivotTables are not included", "info", "PivotTables and lookups (XLOOKUP) are MO-211 skills and are taught in CSC 212. They are the most-requested Excel skills at work, so consider them as optional enrichment if time allows."], ["Accessibility is built in, not bolted on", "info", "Alt text on charts, real table headers, named sheets and tables, and no merged cells inside data are taught as normal practice, and the accessibility checker is part of the clean-and-ship checklist (ADA Title II, WCAG 2.1 AA)."], ["Privacy by design", "info", "Budgets, loans and grades use made-up numbers; no real account details, classmates or grades in practice files or AI prompts; Inspect Document before sharing."], ["Northstar as a diagnostic", "info", "All 17 Northstar Excel standards are covered, 14 of them in Week 1. If FLCC has a Northstar site license, use it as a Day 1 pre-assessment and a Week 1 post-check."]], "sources": [["CSC 135 Core Excel - course description (FLCC)", "https://www.flcc.edu/courses/csc-135/"], ["CSC 135 Core Excel - course outline with outcomes (FLCC)", "https://cyber.flcc.edu/pdf/syllabi/CSC135.pdf"], ["MOS Excel Associate (Microsoft 365 Apps), exam MO-210 - Microsoft Learn", "https://learn.microsoft.com/en-us/credentials/certifications/mos-excel-associate-m365-apps/"], ["Excel (Microsoft 365 Apps) Exam MO-210 objective domains (Appalachian State copy)", "https://business.appstate.edu/sites/default/files/mos_365_excel_od_2022.pdf"], ["MO-211 Excel Expert (Microsoft 365 Apps) skills outline - Microsoft", "https://query.prod.cms.rt.microsoft.com/cms/api/am/binary/RW10j3G"], ["Northstar Digital Literacy standards - Microsoft Excel", "https://www.digitalliteracyassessment.org/features"], ["NACE Career Readiness: Competencies Defined - N <script>
/* =========================================================================
   Excel Course Map - interactive view
   How this script works, in plain terms:
   1. Read the course data (JSON) that sits in the <script> tag above.
   2. Build each tab's content with small helper functions.
   3. Wire up keyboard-friendly tabs, the week ruler and the filters.
   Security note: every piece of text goes in with textContent (never
   innerHTML), so nothing in the data can inject code into the page.
   ========================================================================= */
(function () {
  "use strict";

  // ---- 1. Load the data ---------------------------------------------------
  const DATA = JSON.parse(document.getElementById("course-data").textContent);
  const WEEKS = DATA.weeks;

  // ---- 2. Tiny helpers -----------------------------------------------------

  /**
   * el("p", {class: "muted"}, "Hello") makes <p class="muted">Hello</p>.
   * attrs: plain attributes; "on" + event name (onclick) adds a listener.
   * children: strings (added as safe text) or elements, or arrays of those.
   */
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key.startsWith("on") && typeof value === "function") {
        node.addEventListener(key.slice(2), value);
      } else if (value === true) {
        node.setAttribute(key, "");
      } else {
        node.setAttribute(key, String(value));
      }
    }
    appendAll(node, children);
    return node;
  }
  function appendAll(node, children) {

          (!wk || s.weeks.includes(wk)) &&

      });
    });
    if (!shown) rows.push(row(["", "No skills match these filters. Clear the filters to see all " + S.sub + ".", "", "", ""]));
    mosBody.replaceChildren(...rows);
    mosCount.textContent = `Showing ${shown} of ${S.sub} sub-skills`;
  }
  function setMosFilter(code) {
    mosSearch.value = code; mosDomain.value = ""; mosWeek.value = "";
    renderMosRows();
    mosSearch.focus();
  }

  function buildEvidence() {
    const cards = DATA.evidence.map(e => el("article", { class: "card stack" },
      el("span", { class: "eyebrow" }, e.id + " · Bloom: " + e.bloom),
      el("h3", {}, e.text),
      el("dl", { class: "ev" },
        el("dt", {}, "Introduced"), el("dd", {}, e.I.map(weekLabel).join(", ") || "-"),
        el("dt", {}, "Reinforced"), el("dd", {}, e.R.map(weekLabel).join(", ") || "-"),
        el("dt", {}, "Assessed"), el("dd", {}, e.A.map(weekLabel).join(", ")),
        el("dt", {}, "Objectives"), el("dd", {}, e.objectives.join(", ")),
        el("dt", {}, "Rubric criteria"), el("dd", {}, e.criteria.join(", ")),
        el("dt", {}, "Checks"), el("dd", {}, e.checks.join(", ")),
        el("dt", {}, "Evidence"), el("dd", {}, e.artifact))));
    const topicRows = DATA.topics.map(t => row([el("span", {}, el("b", {}, t.id + " "), t.text),
      t.weeks.map(weekLabel).join(", "), DATA.topicHow[t.id]], { rowHeader: true }));
    return el("div", { class: "stack-lg" },
      section("Evidence for each course learning outcome",
        el("p", { class: "muted" }, "Where each official outcome is taught, practiced and measured, and which learner artifact proves it."),
        el("div", { class: "evidence-grid" }, cards)),
      section("Topic outline evidence",
        table(["Topic (verbatim)", "Weeks", "How it is met"], topicRows, { label: "Topic evidence" })));
  }

  function buildStandards() {
    const nav = el("nav", { class: "subnav", "aria-label": "Standards on this tab" },
      [["std-northstar", "Northstar"], ["std-nace", "NACE"], ["std-digcomp", "DigComp 3.0"], ["std-wcag", "WCAG / ADA"], ["std-platform", "Web vs desktop"], ["std-conv", "Conventions and assumptions"]]
        .map(([id, label]) => el("a", { href: "#" + id, onclick: (e) => { e.preventDefault(); document.getElementById(id).scrollIntoView({ block: "start" }); document.getElementById(id).focus(); } }, label)));
    const sec = (id, title, intro, tbl) => el("section", { class: "stack", id, tabindex: "-1" }, el("h2", {}, title), intro ? el("p", { class: "muted" }, intro) : null, tbl);
    const wl = arr => arr.map(x => x === "All" ? "All" : weekLabel(x)).join(", ");
    return el("div", { class: "stack-lg" }, nav,
      sec("std-northstar", "Northstar Digital Literacy: Microsoft Excel",
        "A free, widely used baseline. All 17 standards are covered, 14 of them in Week 1, so Northstar works as a Day 1 diagnostic.",
        table(["Code", "Standard (verbatim)", "Week", "Drill"], DATA.northstar.map(n => row([n[0], n[1], weekLabel(n[2]), n[3]], { numCols: [0] })), { label: "Northstar" })),
      sec("std-nace", "NACE Career Readiness Competencies",
        "Employer-validated competencies from the National Association of Colleges and Employers.",
        table(["Competency", "Weeks", "Where it shows up"], DATA.nace.map(n => row([n[0], wl(n[1]), n[2]])), { label: "NACE" })),
      sec("std-digcomp", "DigComp 3.0 (European Digital Competence Framework)",
        "Released December 2025. Mapped at the level of its five competence areas.",
        table(["Competence area", "Weeks", "Where it shows up"], DATA.digcomp.map(n => row([n[0], wl(n[1]), n[2]])), { label: "DigComp" })),
      sec("std-wcag", "Accessibility: WCAG 2.1 AA (ADA Title II)",
        "Success criteria learners practice in Excel. The DOJ moved Title II compliance to April 26, 2027 (entities of 50,000+) and April 26, 2028 (smaller); documents are covered.",
        table(["Criterion", "Name", "Level", "What learners do in Excel", "Weeks"], DATA.wcag.map(n => row([n[0], n[1], n[2], n[3], wl(n[4])], { numCols: [0] })), { label: "WCAG" })),
      sec("std-platform", "Excel for the web vs desktop Excel",
        `From Microsoft's feature comparison table, which changes often. Drill split: ${S.webDrills} web, ${S.deskDrills} desktop only, ${S.bothDrills} self-check.`,
        table(["Feature", "Excel for the web", "Desktop Excel", "Used in"], DATA.platform.map(p => row([p[0],
          el("span", { class: "pill " + (p[1] === "Yes" ? "web" : "desktop") }, p[1]), p[2], p[3]])), { label: "Platform comparison" })),
      sec("std-conv", "Conventions and assumptions",
        "Labeled honestly: published guides, industry conventions and planning assumptions are not the same thing.",
        table(["Item", "Type", "Note", "Weeks"], DATA.conventions.map(c => row([c[0], el("span", { class: "pill " + (c[1] === "Assumption" ? "flag" : "info") }, c[1]), c[2], wl(c[3])])), { label: "Conventions" }))
    );
  }

  function buildSources() {
    return el("div", { class: "stack-lg" },
      section("Sources",
        el("ul", { class: "stack", style: "padding-left:1.1em;margin:0" }, DATA.sources.map(([t, u]) =>
          el("li", {}, el("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, t))))),
      section("About this page",
        el("p", {}, "This page and the Markdown course map (the master copy) are generated from the same data file, so they always agree. After changing the map, regenerate both together."),
        el("p", { class: "muted" }, "Built as a single file with plain JavaScript. No data leaves the page; the only thing stored is your last tab and theme choice, in this browser.")));
  }

  // ---- 6. Footer -----------------------------------------------------------
  appendAll(document.getElementById("footer"),
    [el("p", {}, `${DATA.course.title} · ${DATA.course.version} · ${DATA.course.author}`)]);

  // ---- 7. Theme toggle (system -> light -> dark) ---------------------------
  const themeBtn = document.getElementById("theme-btn");
  const THEMES = ["system", "light", "dark"];
  function applyTheme(t) {
    if (t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = "Theme: " + t;
    safeSet("wcm-theme", t);
  }
  themeBtn.addEventListener("click", () => {
    const now = document.documentElement.getAttribute("data-theme") || "system";
    applyTheme(THEMES[(THEMES.indexOf(now) + 1) % THEMES.length]);
  });

  // ---- 8. Storage and links (wrapped so they never break the page) ---------
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked - fine */ } }
  function setHash(h) { try { history.replaceState(null, "", "#" + h); } catch (e) { /* sandboxed - fine */ } }

  // ---- 9. Start-up: restore theme, then open the right tab/week -------------
  const savedTheme = safeGet("wcm-theme");
  if (savedTheme && THEMES.includes(savedTheme)) applyTheme(savedTheme);
  const hash = (location.hash || "").slice(1);   // read the link's #token before anything changes it
  selectWeek("W1");
  const weekMatch = /^week-([1-5])$/.exec(hash);
  if (weekMatch) { selectWeek("W" + weekMatch[1]); showTab("map"); }
  else if (TABS.some(t => t.id === hash)) showTab(hash);
  else showTab(TABS.some(t => t.id === safeGet("wcm-tab")) ? safeGet("wcm-tab") : "overview");
})();
</script>

</body>
</html>

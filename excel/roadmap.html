  /**
   * The course map: weeks, and the stations (lessons, skill checks, projects)
   * on each, worked out from content/outline.md and the lesson files.
   * The roadmap, the certificate page and the add-in all use this, so they
   * always agree about what's in the course and which badges each stop awards.
   *   outline  parse(content/outline.md)
   *   config   parse(course.config.md).meta
   *   docs     { "content/week-01/01-meet-word.md": parse(that file), ... }
   *            (files not written yet are simply missing)
   */
  function courseMap(outline, config, docs) {
    const cfg = config || {};
    const outcomes = (outline.blocks.find((b) => b.name === "outcomes") || {}).items || [];
    const mosList = (outline.blocks.find((b) => b.name === "certification") || {}).items || [];
    const slug = (x) => x.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);

    const weeks = outline.blocks.filter((b) => b.name === "week").map((w) => {
      const n = Number(w.arg.slice(1));
      const stations = w.steps.map((it) => {
        const e = it.extra;
        const st = {
          sid: `w${n}-${slug(it.text)}`, title: it.text, kind: e.kind, minutes: Number(e.minutes) || null,
          goals: e.goals || "", file: e.file || null, status: "planned", activities: [], clos: [], mos: [],
          plannedDrills: e.drills ? e.drills.split(",").map((x) => x.trim()).filter(Boolean) : [],
          certificate: e.kind === "lesson" && cfg.certificateEach === "lesson",
        };
        const doc = st.file && docs ? docs[st.file] : null;
        if (doc) {
          st.plannedDrills = []; // written: its real drills are in st.activities now
          st.status = doc.meta.status === "ready" ? "ready" : "draft";
          st.docId = doc.meta.id;
          st.clos = Array.isArray(doc.meta.clos) ? doc.meta.clos : [];
          const mos = new Set();
          for (const b of doc.blocks) {
            // practice items (quizzes, preflights) are counted, not badged
            if (!["drill", "skillcheck", "rubric"].includes(b.name)) continue;
            splitList(b.header.mos).forEach((c) => mos.add(c));
            const badge = b.name === "rubric"
              ? { id: b.arg, name: String(doc.meta.rubricBadge || String(doc.meta.title || b.arg).replace(/^Project \d+:\s*/, "")), week: n, kind: "project" }
              : badgeFor(b, doc.meta);
            st.activities.push({
              id: b.arg, kind: b.name === "rubric" ? "project" : b.name,
              title: b.name === "rubric" ? doc.meta.title : (b.header.title || b.arg),
              assess: activityKinds(b), platform: b.header.platform || "web",
              minutes: Number(b.header.minutes || b.header.timeLimit) || null, badge,
              steps: b.steps.length, screenshots: b.steps.filter((x) => x.extra.screenshot !== undefined).length,
            });
          }
          st.mos = [...mos].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
          st.quizzes = doc.blocks.filter((b) => b.name === "quiz").length;
        }
        return st;
      });
      return { id: w.arg, n, title: w.header.title, tagline: w.header.tagline || "", color: w.header.color || WEEK_COLORS[n], stations };
    });

    // The end of the line: the course certificate
    if (cfg.courseCertificate === true || cfg.courseCertificate === "true") {
      const last = weeks[weeks.length - 1];
      if (last) last.stations.push({ sid: "course-complete", title: "Course Complete", kind: "course", minutes: null,
        goals: "Earn the course certificate, with every badge and outcome from all five weeks on the back.",
        file: null, status: "ready", activities: [], clos: outcomes.map((o) => o.id), mos: mosList.map((m) => m.id),
        plannedDrills: [], certificate: true });
    }
    return { weeks, outcomes, mosNames: Object.fromEntries(mosList.map((i) => [i.id, i.text])) };
  }

<script>
/* =========================================================================
   Roadmap logic, in plain terms:
   1. Read the course data the build step put in the page.
   2. Draw the map (SVG) and the route list (HTML) from it.
   3. Show one stop's details in the panel; keep map, list and panel in sync.
   Text always goes in with textContent. The only HTML inserted as markup is
   badge artwork made by TrainerMD.badgeSVG, which escapes everything it uses.
   ========================================================================= */
(function () {
  "use strict";
  const TM = window.TrainerMD;
  const DATA = JSON.parse(document.getElementById("roadmap-data").textContent);
  const $ = (id) => document.getElementById(id);
  const SVG = "http://www.w3.org/2000/svg";

  // ---------- small helpers ----------
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : String(v));
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return n;
  }
  function svg(tag, attrs, ...kids) {
    const n = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) n.setAttribute(k, String(v));
    for (const kid of kids.flat()) if (kid) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return n;
  }
  const store = {
    get(k) { try { return localStorage.getItem("roadmap-" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("roadmap-" + k, v); } catch (e) { /* storage blocked: fine */ } },
  };
  const KIND_WORD = { start: "Start here", lesson: "Lesson", skillcheck: "Skill check", project: "Project", capstone: "Capstone", course: "Finish line" };
  const minutesText = (m) => !m ? "" : m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? " " + (m % 60) + " min" : ""}` : `${m} min`;

  /** Break a title into lines of about `max` characters, at most 4 lines. */
  function wrap(text, max) {
    const words = text.split(" "), lines = [];
    let cur = "";
    for (const w of words) {
      if ((cur + " " + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + " " + w).trim();
    }
    if (cur) lines.push(cur);
    return lines.length > 4 ? lines.slice(0, 3).concat([lines.slice(3).join(" ")]) : lines;
  }

  // ---------- the stops, in riding order ----------
  const stops = [];
  DATA.weeks.forEach((w) => w.stations.forEach((s) => stops.push(Object.assign(s, { week: w }))));
  const byId = Object.fromEntries(stops.map((s) => [s.sid, s]));
  let current = stops[0].sid;
  let mode = store.get("mode") || DATA.course.mode || "practice";

  // ---------- header ----------
  $("college").textContent = DATA.course.college;
  $("title").textContent = DATA.app.fullName + ": Course Roadmap";
  const badgesSoFar = stops.reduce((n, s) => n + s.activities.length, 0);
  const plannedDrills = stops.reduce((n, s) => n + s.plannedDrills.length, 0);
  const stat = (b, t) => el("span", {}, el("b", {}, b), t);
  $("stats").append(
    stat(DATA.weeks.length, "weeks"),
    stat(stops.length, "stops"),
    stat(stops.filter((s) => s.certificate).length, "certificates"),
    stat(badgesSoFar + plannedDrills + stops.filter((s) => s.status === "planned" && (s.kind === "skillcheck" || s.kind === "project")).length, "badges to earn"),
  );
  const anyPlanned = stops.some((s) => s.status === "planned" && s.kind !== "course");
  $("footer").textContent = `Built from ${DATA.builtFrom}.${anyPlanned ? ' Stops marked "coming soon" are planned and being written.' : ""} Content license: ${DATA.course.license}.`;

  // =====================================================================
  // THE MAP: one horizontal line per week, snaking down the page.
  // Even weeks run left to right, odd weeks right to left, joined by a
  // dotted transfer, the way a folded transit map reads.
  // =====================================================================
  // Geometry, in SVG units: the map is 820 wide and scales to fit its column.
  // Labels alternate below and above the line, so each gets twice the room.
  const W = 820, LEFT = 92, RIGHT = 728, ROW = 236, TOP = 150;
  function drawMap() {
    const height = TOP + (DATA.weeks.length - 1) * ROW + 110;
    const root = svg("svg", { viewBox: `0 0 ${W} ${height}`, role: "presentation" });
    const lines = svg("g"), transfers = svg("g"), stationsLayer = svg("g"), labels = svg("g");
    const pos = {}; // stop id -> {x, y}

    DATA.weeks.forEach((w, i) => {
      const y = TOP + i * ROW;
      const n = w.stations.length;
      const ltr = i % 2 === 0;
      const xs = w.stations.map((_, k) => n === 1 ? (LEFT + RIGHT) / 2 : LEFT + (RIGHT - LEFT) * k / (n - 1));
      if (!ltr) xs.reverse();
      w.stations.forEach((s, k) => { pos[s.sid] = { x: xs[k], y, above: k % 2 === 1 }; });

      // week name with its line "bullet", above the start of the line
      const startX = xs[0];
      const anchor = ltr ? "start" : "end";
      const bx = ltr ? startX - 6 : startX + 6;
      labels.append(svg("g", {},
        svg("circle", { cx: ltr ? bx + 15 : bx - 15, cy: y - 122, r: 16, class: "f" + w.n }),
        svg("text", { x: ltr ? bx + 15 : bx - 15, y: y - 116, "text-anchor": "middle", class: "wk-num" }, String(w.n)),
        svg("text", { x: ltr ? bx + 40 : bx - 40, y: y - 124, "text-anchor": anchor, class: "wk-title" }, `Week ${w.n}: ${w.title}`),
        svg("text", { x: ltr ? bx + 40 : bx - 40, y: y - 104, "text-anchor": anchor, class: "wk-tag" }, w.tagline),
      ));
      // the colored line itself
      lines.append(svg("path", { d: `M${Math.min(...xs)} ${y}H${Math.max(...xs)}`, class: "route l" + w.n }));
      // dotted transfer down to the next week's line
      if (i < DATA.weeks.length - 1) {
        const endX = xs[xs.length - 1], y2 = y + ROW, bulge = ltr ? 64 : -64;
        transfers.append(svg("path", { d: `M${endX} ${y}C${endX + bulge} ${y} ${endX + bulge} ${y2} ${endX} ${y2}`, class: "transfer" }));
      }
    });

    // stops: one focusable group each, in riding order
    stops.forEach((s, idx) => {
      const { x, y, above } = pos[s.sid];
      const n = s.week.n;
      const g = svg("g", { class: "station" + (s.status === "planned" ? " planned" : ""), tabindex: "0", role: "button",
        "data-sid": s.sid, "aria-current": "false",
        "aria-label": `Week ${n}, ${KIND_WORD[s.kind]}: ${s.title}${s.minutes ? ", about " + minutesText(s.minutes) : ""}${s.status === "planned" ? ", coming soon" : ""}` });
      g.append(svg("circle", { class: "halo", cx: x, cy: y, r: 23 }));
      g.append(marker(s.kind, x, y, n));
      // Labels at either end of a line hug the inside, so the transfer curves never cross them
      const lines = wrap(s.title, 20);
      const anchor = x >= RIGHT - 1 ? "end" : x <= LEFT + 1 ? "start" : "middle";
      const tx = anchor === "end" ? x + 14 : anchor === "start" ? x - 14 : x;
      // An invisible hit area covering the marker and its label: one big, easy target
      const top = above ? y - 44 - lines.length * 18 : y - 18;
      const bottom = above ? y + 18 : y + 26 + lines.length * 18;
      const hx = anchor === "end" ? tx - 170 : anchor === "start" ? tx - 20 : x - 80;
      g.insertBefore(svg("rect", { x: hx, y: top, width: anchor === "middle" ? 160 : 190, height: bottom - top, fill: "transparent" }), g.firstChild);
      lines.forEach((t, k) => {
        const ty = above ? y - 30 - (lines.length - 1 - k) * 18 : y + 36 + k * 18;
        g.append(svg("text", { x: tx, y: ty, "text-anchor": anchor, class: "st-label" }, t));
      });
      g.addEventListener("click", () => select(s.sid, true));
      g.addEventListener("keydown", (e) => stationKeys(e, idx));
      stationsLayer.append(g);
    });

    root.append(transfers, lines, labels, stationsLayer);
    $("map").replaceChildren(root);
  }

  /** The symbol for each kind of stop (also used in the key). */
  function marker(kind, x, y, n) {
    const m = svg("g", { class: "marker-group" });
    if (kind === "project") m.append(svg("rect", { class: "marker stop-ink", x: x - 17, y: y - 11, width: 34, height: 22, rx: 11, "stroke-width": 4 }));
    else if (kind === "skillcheck") m.append(svg("circle", { class: "marker stop-fill l" + n, cx: x, cy: y, r: 13, "stroke-width": 5 }), svg("circle", { class: "f" + n, cx: x, cy: y, r: 4.5 }));
    else if (kind === "start") m.append(svg("rect", { class: "marker f" + n, x: x - 7, y: y - 16, width: 14, height: 32, rx: 4 }));
    else if (kind === "capstone" || kind === "course") {
      m.append(svg("circle", { class: "marker " + (kind === "course" ? "stop-ink" : "stop-fill l" + n), cx: x, cy: y, r: 16, "stroke-width": 5 }));
      m.append(svg("path", { d: star(x, y, 8.5), class: kind === "course" ? "" : "f" + n, style: kind === "course" ? "fill: var(--ink)" : null }));
    } else m.append(svg("circle", { class: "marker stop-fill l" + n, cx: x, cy: y, r: 10, "stroke-width": 5 }));
    return m;
  }
  function star(cx, cy, r) {
    let d = "";
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      d += (i ? "L" : "M") + (cx + rr * Math.cos(a)).toFixed(1) + " " + (cy + rr * Math.sin(a)).toFixed(1);
    }
    return d + "z";
  }

  /** Arrow keys ride the line; Enter or Space opens a stop. */
  function stationKeys(e, idx) {
    let next = null;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") next = Math.min(idx + 1, stops.length - 1);
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = Math.max(idx - 1, 0);
    if (e.key === "Home") next = 0;
    if (e.key === "End") next = stops.length - 1;
    if (next !== null) { e.preventDefault(); focusStation(stops[next].sid); select(stops[next].sid, false); }
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(stops[idx].sid, true); }
  }
  function focusStation(sid) { const g = document.querySelector(`#map [data-sid="${sid}"]`); if (g) g.focus(); }

  function drawLegend() {
    const item = (kind, words) => {
      const s = svg("svg", { viewBox: "0 0 44 44", width: 30, height: 30, "aria-hidden": "true" });
      s.append(svg("path", { d: "M2 22H42", class: "route l1", style: "stroke-width:8" }));
      s.append(marker(kind, 22, 22, 1));
      return el("span", {}, s, words);
    };
    const soon = svg("svg", { viewBox: "0 0 44 44", width: 30, height: 30, "aria-hidden": "true" });
    soon.append(svg("circle", { cx: 22, cy: 22, r: 10, class: "stop-fill l5", "stroke-width": 5, "stroke-dasharray": "4 3" }));
    const items = [item("start", "Start here"), item("lesson", "Lesson (certificate)"), item("skillcheck", "Skill check"),
      item("project", "Project"), item("capstone", "Capstone")];
    if (anyPlanned) items.push(el("span", {}, soon, "Coming soon")); // only while lessons are still being written
    $("legend").replaceChildren(...items);
  }

  // =====================================================================
  // THE ROUTE LIST: the same stops as an ordinary list (phones, screen
  // readers, and anyone who prefers it).
  // =====================================================================
  function drawList() {
    const box = $("list-view");
    box.replaceChildren(...DATA.weeks.map((w) => el("section", { class: "card", style: `--rail: var(--w${w.n})`, "aria-labelledby": "lw" + w.n },
      el("h2", { id: "lw" + w.n }, el("span", { class: "bullet b" + w.n, "aria-hidden": "true" }, String(w.n)), `Week ${w.n}: ${w.title}`),
      el("p", { class: "muted" }, w.tagline),
      el("ol", {}, w.stations.map((s) => el("li", { class: `k-${s.kind}${s.status === "planned" ? " planned" : ""}` },
        el("button", { type: "button", "data-sid": s.sid, "aria-current": "false", onclick: () => select(s.sid, true) },
          el("span", { class: "t" }, s.title),
          el("span", { class: "m" }, [KIND_WORD[s.kind], minutesText(s.minutes), s.status === "planned" ? "coming soon" : ""].filter(Boolean).join(" · ")))))))));
  }

  // =====================================================================
  // THE PANEL: everything about one stop.
  // =====================================================================
  function labelsFor(kinds) {
    return el("span", { class: "chips" }, kinds.map((k) => el("span", { class: "chip " + k }, DATA.labels[k][mode])));
  }
  function badgeArt(o) {
    // Trusted markup: TrainerMD.badgeSVG escapes every value it draws.
    const holder = el("span", { class: "art" });
    holder.innerHTML = TM.badgeSVG(o);
    return holder;
  }

  function renderPanel() {
    const s = byId[current];
    const idx = stops.indexOf(s);
    const p = $("panel");
    const parts = [];
    parts.push(el("span", { class: "eyebrow" }, `Week ${s.week.n} · ${KIND_WORD[s.kind]}`));
    parts.push(el("h2", {}, s.title));
    const facts = el("div", { class: "chips" });
    if (s.minutes) facts.append(el("span", { class: "chip" }, "About " + minutesText(s.minutes)));
    if (s.status === "planned") facts.append(el("span", { class: "chip soon" }, "Coming soon"));
    if (s.activities.some((a) => a.platform === "desktop")) facts.append(el("span", { class: "chip desktop" }, "Some drills need desktop " + DATA.app.name));
    if (facts.childNodes.length) parts.push(facts);
    if (s.goals) parts.push(el("p", {}, el("b", {}, "You'll be able to: "), s.goals.replace(/^./, (c) => c.toLowerCase())));

    if (s.certificate) {
      const isCourse = s.kind === "course";
      parts.push(el("div", { class: "cert-note" }, badgeArt({ week: isCourse ? null : s.week.n, kind: isCourse ? "course" : "lesson", label: "Certificate", size: 44 }),
        el("span", {}, isCourse
          ? "Finish all five weeks for the course certificate. The back lists every badge and outcome."
          : `Finish this lesson to earn a certificate. The back lists its badges and the outcomes they cover${mode === "practice" ? ", marked as your practice record" : ""}.`)));
    }

    if (s.activities.length) {
      parts.push(el("h3", {}, "Badges to earn here"));
      parts.push(el("ul", { class: "acts" }, s.activities.map((a) => el("li", {},
        badgeArt({ week: a.badge.week, kind: a.badge.kind, code: a.id, label: a.badge.name + " badge", size: 52 }),
        el("div", {}, el("span", { class: "name" }, a.badge.name), " ", el("span", { class: "sub" }, `${a.id} · ${a.title}`),
          el("div", { style: "margin-top:4px" }, labelsFor(a.assess),
            a.platform === "desktop" ? el("span", { class: "chip desktop", style: "margin-left:6px" }, "Desktop " + DATA.app.name) : null))))));
      if (s.quizzes) parts.push(el("p", { class: "muted" }, `Plus ${s.quizzes} quick check${s.quizzes === 1 ? "" : "s"} along the way (practice only, no badge).`));
    } else if (s.plannedDrills.length) {
      parts.push(el("h3", {}, "Planned practice drills"));
      parts.push(el("p", {}, `${s.plannedDrills.join(", ")}. Each one will earn a badge. This lesson is being written.`));
    } else if (s.status === "planned" && (s.kind === "skillcheck" || s.kind === "project")) {
      parts.push(el("p", { class: "muted" }, `Earns a badge when finished. ${s.kind === "skillcheck" ? "Auto-checked, timed." : DATA.labels.instructor[mode] + "."} Being written.`));
    }

    if (s.clos.length) {
      const map = Object.fromEntries(DATA.outcomes.map((o) => [o.id, o.text]));
      parts.push(el("details", {}, el("summary", {}, `Course outcomes (${s.clos.length})`), el("ul", {}, s.clos.map((c) => el("li", {}, `${c}: ${map[c] || ""}`)))));
    }
    if (s.mos.length) {
      parts.push(el("details", {}, el("summary", {}, `${DATA.app.exam || "MOS"} exam skills practiced (${s.mos.length})`),
        el("ul", {}, s.mos.slice(0, 80).map((c) => el("li", {}, `${c} ${DATA.mosNames[c] || ""}`)))));
    }

    parts.push(el("div", { class: "nav" },
      el("button", { type: "button", class: "btn", disabled: idx === 0 ? true : null, onclick: () => step(-1) }, "‹ Previous stop"),
      el("button", { type: "button", class: "btn", disabled: idx === stops.length - 1 ? true : null, onclick: () => step(1) }, "Next stop ›")));
    p.replaceChildren(...parts);
  }
  function step(d) { const i = stops.findIndex((s) => s.sid === current); const n = stops[i + d]; if (n) { select(n.sid, false); focusStation(n.sid); } }

  /** Make one stop current everywhere. `reveal` scrolls the panel into view on small screens. */
  function select(sid, reveal) {
    if (!byId[sid]) return;
    current = sid;
    document.querySelectorAll("[data-sid]").forEach((n) => n.setAttribute("aria-current", n.dataset.sid === sid ? "true" : "false"));
    renderPanel();
    try { history.replaceState(null, "", "#" + sid); } catch (e) { /* sandboxed: fine */ }
    if (reveal && window.matchMedia("(max-width: 1080px)").matches) {
      const smooth = window.matchMedia("(prefers-reduced-motion: no-preference)").matches;
      $("panel").scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
    }
  }

  // ---------- view, mode and theme switches ----------
  function setView(v) {
    $("map-view").hidden = v !== "map";
    $("list-view").hidden = v !== "list";
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
    store.set("view", v);
  }
  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
  function setMode(m) {
    mode = m;
    document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
    store.set("mode", m);
    renderPanel();
  }
  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
  const THEMES = ["system", "light", "dark"];
  function applyTheme(t) {
    if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
    $("theme").textContent = "Theme: " + t; store.set("theme", t);
  }
  $("theme").addEventListener("click", () => applyTheme(THEMES[(THEMES.indexOf(store.get("theme") || "system") + 1) % 3]));

  // ---------- start-up ----------
  if (store.get("theme")) applyTheme(store.get("theme"));
  drawMap(); drawLegend(); drawList();
  const wanted = (location.hash || "").slice(1);
  // Phones start on the list; a remembered choice wins.
  setView(store.get("view") || (window.matchMedia("(max-width: 700px)").matches ? "list" : "map"));
  setMode(mode === "section" ? "section" : "practice");
  select(byId[wanted] ? wanted : stops[0].sid, false);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    OFFICE TRAINER - the add-in (the sidebar learners see inside Word, Excel and PowerPoint)
    =====================================================================
    DON'T EDIT taskpane.html DIRECTLY. It is built from this file by
    word/tools/build-taskpane.py, which copies in the shared libraries:
      - word/tools/trainer-md.js       reads and draws the lesson files
      - word/tools/word-checker.js     checks a Word document
      - excel/tools/excel-checker.js   checks an Excel workbook
      - powerpoint/tools/ppt-checker.js checks a PowerPoint presentation
    Edit this file (or those), then run:  python3 word/tools/build-taskpane.py

    WHERE THE LESSONS COME FROM
    The add-in reads the course at startup from word/, excel/ or powerpoint/
    next to this page (whichever app opened it): course.config.md, content/outline.md and
    every lesson file the outline names. Change a lesson's Markdown and
    upload it; no rebuild needed.

    SECURITY: Content Security Policy (CSP)
    Scripts may only come from this site, Microsoft (office.js) and cdnjs
    (JSZip, pinned with an integrity hash). 'unsafe-inline' is needed because
    the app keeps its code inside this one file; 'unsafe-eval' because some
    versions of office.js need it. frame-src lets videos play only from the
    approved video sites (add a site here AND in each course's videoHosts to
    approve it). object-src, base-uri and form-action shut off
    old tricks this page never uses.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https://appsforoffice.microsoft.com https://cdnjs.cloudflare.com; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Office Trainer</title>

  <!-- office.js: Microsoft's library for talking to Word, Excel and PowerPoint. It must come from Microsoft and load first.
       In a normal browser tab it reports "no Office here" and the trainer switches to upload mode. -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <!-- JSZip opens .docx, .xlsx and .pptx files (each is a zip folder of XML files). The integrity value is a
       fingerprint of the exact file: if the CDN ever served something else, the browser would refuse it. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
          integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    /* ============================================================
       FONTS
       Comfortaa (headings) and Atkinson Hyperlegible (text) are hosted
       next to this page in assets/fonts, so nothing about the learner is
       sent to a font service. Both use the SIL Open Font License.
       ============================================================ */
    @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-style: normal; font-display: swap; src: url("assets/fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-style: normal; font-display: swap; src: url("assets/fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); }
    @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-style: italic; font-display: swap; src: url("assets/fonts/atkinson-hyperlegible-latin-400-italic.woff2") format("woff2"); }
    @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-style: italic; font-display: swap; src: url("assets/fonts/atkinson-hyperlegible-latin-700-italic.woff2") format("woff2"); }
    @font-face { font-family: "Comfortaa"; font-weight: 500 600; font-style: normal; font-display: swap; src: url("assets/fonts/comfortaa-latin-500-normal.woff2") format("woff2"); }
    @font-face { font-family: "Comfortaa"; font-weight: 700; font-style: normal; font-display: swap; src: url("assets/fonts/comfortaa-latin-700-normal.woff2") format("woff2"); }

    /* ============================================================
       COLORS ("tokens")
       Every color lives here so it's easy to change. Text colors clear
       7:1 contrast (WCAG AAA) on their backgrounds. Status is never shown
       by color alone: there is always a word and a symbol too.
       ============================================================ */
    :root {
      --bg: #ffffff; --surface: #f4f6f9; --surface-2: #e9edf3; --card: #ffffff;
      --ink: #1a1a1a; --muted: #4b5563; --line: #c9ced6;
      --blue: #0046ad; --blue-soft: #e3ecfa; --on-blue: #ffffff;
      --green: #305305; --green-soft: #e8f0df;
      --orange: #8a2905; --orange-fill: #a23108; --orange-soft: #f8e6df;
      --code-bg: #f2f4f8; --focus: #0046ad;
      --week: #0046ad;                      /* changed per week, below */
      --ui-font: "Atkinson Hyperlegible", Arial, Arimo, sans-serif;
      --tm-heading: "Comfortaa", "Atkinson Hyperlegible", Arial, sans-serif;  /* learner can change in Settings */
      --tm-body: "Atkinson Hyperlegible", Arial, Arimo, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --text-size: 15px;
      --radius: 10px;
      color-scheme: light;
    }
    /* Dark mode: follows the computer unless Settings picks Light or Dark. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12161d; --surface: #1a2029; --surface-2: #232b37; --card: #161b23;
        --ink: #eef1f5; --muted: #c3c8d0; --line: #3a4352;
        --blue: #a9c4ff; --blue-soft: #1b2c4f; --on-blue: #0b1630;
        --green: #b5e48c; --green-soft: #1d2e1a;
        --orange: #ffb38f; --orange-fill: #ff8f63; --orange-soft: #3a2018;
        --code-bg: #0f1520; --focus: #a9c4ff; color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #12161d; --surface: #1a2029; --surface-2: #232b37; --card: #161b23;
      --ink: #eef1f5; --muted: #c3c8d0; --line: #3a4352;
      --blue: #a9c4ff; --blue-soft: #1b2c4f; --on-blue: #0b1630;
      --green: #b5e48c; --green-soft: #1d2e1a;
      --orange: #ffb38f; --orange-fill: #ff8f63; --orange-soft: #3a2018;
      --code-bg: #0f1520; --focus: #a9c4ff; color-scheme: dark;
    }
    /* One color per week (the same colors as the roadmap); lighter versions for dark mode. */
    [data-week="1"] { --week: #0046ad; } [data-week="2"] { --week: #305305; } [data-week="3"] { --week: #a23108; }
    [data-week="4"] { --week: #6b21a8; } [data-week="5"] { --week: #374151; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) [data-week="1"] { --week: #7aa7ff; } :root:not([data-theme="light"]) [data-week="2"] { --week: #8cc56a; }
      :root:not([data-theme="light"]) [data-week="3"] { --week: #ff9a6b; } :root:not([data-theme="light"]) [data-week="4"] { --week: #c79bf2; }
      :root:not([data-theme="light"]) [data-week="5"] { --week: #b8c0cc; }
    }
    :root[data-theme="dark"] [data-week="1"] { --week: #7aa7ff; } :root[data-theme="dark"] [data-week="2"] { --week: #8cc56a; }
    :root[data-theme="dark"] [data-week="3"] { --week: #ff9a6b; } :root[data-theme="dark"] [data-week="4"] { --week: #c79bf2; }
    :root[data-theme="dark"] [data-week="5"] { --week: #b8c0cc; }

    /* ============================================================
       BASICS
       ============================================================ */
    * { box-sizing: border-box; }
    html { font-size: var(--text-size); }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui-font); font-size: 1rem; line-height: 1.5; }
    main { max-width: 640px; margin: 0 auto; padding: 12px 14px 24px; }
    h1, h2, h3 { line-height: 1.25; text-wrap: balance; }
    p { margin: 0 0 10px; }
    a { color: var(--blue); }
    button, select, input, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    /* Headings get focus when a screen opens (so screen readers start there); they don't need a ring. */
    h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus, main:focus { outline: none; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .muted { color: var(--muted); }
    .small { font-size: .875rem; }
    .mono { font-family: var(--mono); font-size: .85em; overflow-wrap: anywhere; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

    /* Skip link: the first thing a keyboard user reaches. */
    .skip { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--blue); color: var(--on-blue); padding: 8px 12px; border-radius: 8px; }
    .skip:focus { top: 8px; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 40px; padding: 7px 14px; border-radius: 8px; cursor: pointer;
      border: 2px solid var(--blue); background: var(--card); color: var(--blue);
      font-weight: 700; text-decoration: none; line-height: 1.2; text-align: center;
    }
    .btn:hover { background: var(--blue-soft); }
    .btn.primary { background: var(--blue); color: var(--on-blue); }
    .btn.primary:hover { filter: brightness(1.1); }
    .btn.quiet { border-color: var(--line); color: var(--ink); }
    .btn.quiet:hover { border-color: var(--blue); color: var(--blue); background: var(--card); }
    .btn.danger { border-color: var(--orange-fill); color: var(--orange); }
    .btn.slim { min-height: 34px; padding: 4px 10px; font-size: .875rem; }
    .btn.wide { width: 100%; }
    .btn[disabled], .btn[aria-disabled="true"] { opacity: .6; cursor: not-allowed; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .linkish { background: none; border: 0; padding: 0; color: var(--blue); text-decoration: underline; cursor: pointer; font-weight: 700; }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 6px;
      padding: 6px 10px; background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; flex-direction: column; align-items: flex-start; margin-right: auto; border: 0; background: none; padding: 2px 4px; cursor: pointer; text-align: left; border-radius: 6px; }
    .brand b { font-family: "Comfortaa", var(--ui-font); font-size: .95rem; color: var(--blue); }
    .brand span { font-size: .75rem; color: var(--muted); }
    .navbtn { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; min-width: 52px; min-height: 44px; padding: 3px 6px; border: 0; border-radius: 8px; background: none; cursor: pointer; color: var(--ink); font-size: .72rem; font-weight: 700; }
    .navbtn svg { width: 20px; height: 20px; }
    .navbtn:hover { background: var(--surface-2); }
    .navbtn[aria-current="page"] { color: var(--blue); background: var(--blue-soft); }
    .count-pill { display: inline-block; min-width: 1.5em; padding: 0 5px; border-radius: 999px; background: var(--green); color: var(--bg); font-size: .7rem; line-height: 1.5; text-align: center; }

    /* ---------- Cards ---------- */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin: 0 0 12px; }
    .card h2 { font-size: 1.05rem; margin: 0 0 6px; font-family: var(--tm-heading); }
    .eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--muted); margin: 0 0 2px; }
    .notice { border-radius: var(--radius); padding: 10px 12px; margin: 0 0 12px; background: var(--surface); border: 1px solid var(--line); }
    .notice.warn { background: var(--orange-soft); border-color: var(--orange-fill); }
    .notice.good { background: var(--green-soft); border-color: var(--green); }
    .notice p:last-child { margin-bottom: 0; }
    .error-text { color: var(--orange); font-weight: 700; }
    progress { width: 100%; height: 10px; accent-color: var(--green); }
    .meter { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 0; }

    /* ---------- Home: the course "line" (a small subway map) ---------- */
    .home-head h1 { font-family: var(--tm-heading); font-size: 1.45rem; margin: 0 0 4px; }
    .mode-chip { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
    .continue { border-left: 6px solid var(--week); }
    .week { margin: 0 0 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: hidden; }
    .week-toggle { display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px 12px; border: 0; background: none; cursor: pointer; text-align: left; }
    .week-toggle:hover { background: var(--surface); }
    .week-swatch { flex: none; width: 10px; align-self: stretch; border-radius: 999px; background: var(--week); }
    .week-name { flex: 1; }
    .week-name b { display: block; font-family: var(--tm-heading); }
    .week-name span { font-size: .8rem; color: var(--muted); }
    .chev { flex: none; transition: transform .15s; }
    .week-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
    ol.line { list-style: none; margin: 0; padding: 4px 12px 12px; position: relative; }
    ol.line::before { content: ""; position: absolute; left: 25px; top: 12px; bottom: 24px; width: 6px; border-radius: 999px; background: var(--week); }
    .station { position: relative; padding-left: 34px; margin: 0 0 6px; }
    .station:last-child { margin-bottom: 0; }
    .stop { position: absolute; left: 3px; top: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--card); border: 5px solid var(--week); display: grid; place-items: center; }
    .stop svg { width: 14px; height: 14px; }
    .station[data-state="done"] .stop { background: var(--week); }
    .station[data-state="done"] .stop svg { color: var(--card); }
    .station[data-state="planned"] .stop { border-style: dotted; border-width: 4px; }
    .station-btn { display: block; width: 100%; text-align: left; border: 1px solid transparent; border-radius: 8px; background: none; padding: 8px; cursor: pointer; }
    .station-btn:hover { border-color: var(--line); background: var(--surface); }
    .station-title { display: block; font-weight: 700; color: var(--ink); }
    .station-meta { display: block; font-size: .8rem; color: var(--muted); }
    .station-status { display: inline-block; margin-top: 2px; font-size: .78rem; font-weight: 700; }
    .station-status[data-state="done"] { color: var(--green); }
    .station-status[data-state="partial"] { color: var(--orange); }
    .station-status[data-state="todo"], .station-status[data-state="planned"], .station-status[data-state="skipped"] { color: var(--muted); }
    /* A stop the learner's section leaves out: a dashed ring, and the words "Not in your section" */
    .station[data-state="skipped"] .stop { border-style: dashed; }
    .station[data-state="skipped"] .station-title { font-weight: 400; }
    .section-line { margin: 6px 0 0; }
    .home-head .linkish, .section-line .linkish { min-height: 24px; display: inline-flex; align-items: center; } /* big enough to tap (WCAG 2.5.8) */
    #section-input { flex: 1 1 12em; min-width: 0; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
    .station-planned { padding: 8px; color: var(--muted); }
    .station-planned .station-title { color: var(--muted); }

    /* ---------- Lesson screen ---------- */
    .crumbs { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; flex-wrap: wrap; }
    .crumbs .where { font-size: .8rem; color: var(--muted); font-weight: 700; }
    .lesson-bar { height: 6px; border-radius: 999px; background: var(--week); margin: 0 0 12px; }
    .activity-strip, .lesson .activity-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; }
    .chip { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: .8rem; font-weight: 700; color: var(--ink); }
    .chip[data-done="true"] { border-color: var(--green); color: var(--green); background: var(--green-soft); }
    .chip:hover { border-color: var(--blue); }
    .end-card { border: 2px solid var(--week); }
    .end-card .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .station-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }

    /* ---------- Lesson content (drawn by TrainerMD; same look as the editor's preview) ---------- */
    .lesson { font-family: var(--tm-body); line-height: 1.55; overflow-wrap: break-word; } /* long web addresses wrap instead of widening the panel */
    .lesson h1, .lesson h2, .lesson h3 { font-family: var(--tm-heading); }
    .lesson h1 { font-size: 1.45rem; margin: 2px 0 12px; }
    .lesson h2 { font-size: 1.15rem; margin: 22px 0 8px; }
    .lesson h3 { font-size: 1rem; margin: 18px 0 6px; }
    .lesson ul, .lesson ol { padding-left: 1.3em; margin: 0 0 10px; }
    .lesson code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
    .lesson img { max-width: 100%; border-radius: 8px; }
    .tm-eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 !important; font-weight: 700; }
    .tm-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .tm-table { overflow-x: auto; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 8px; }
    .tm-table table { border-collapse: collapse; width: 100%; font-size: .87rem; }
    .tm-table th, .tm-table td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    .tm-table th { background: var(--surface-2); }
    .tm-table caption { text-align: left; font-weight: 700; padding: 6px 8px; }
    .tm-keys { white-space: nowrap; }
    .tm-keyos { font-size: .65rem; font-weight: 700; color: var(--muted); margin-right: 3px; text-transform: uppercase; }
    kbd { font-family: var(--mono); font-size: .82em; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface-2); }
    .tm-path { display: inline; font-weight: 700; }
    .tm-sep { color: var(--muted); margin: 0 4px; font-weight: 400; }
    .tm-callout, .tm-platform { position: relative; background: var(--blue-soft); border-radius: var(--radius); padding: 10px 12px 10px 24px; margin: 0 0 14px; }
    /* the thin rounded bar on the left of callouts */
    .tm-callout::before, .tm-platform::before { content: ""; position: absolute; left: 9px; top: 10px; bottom: 10px; width: 4px; border-radius: 999px; background: var(--blue); }
    .tm-callout p:last-child, .tm-platform p:last-child { margin-bottom: 0; }
    .tm-warning, .tm-privacy { background: var(--orange-soft); }
    .tm-warning::before, .tm-privacy::before { background: var(--orange-fill); }
    .tm-why::before, .tm-tip::before { background: var(--green); }
    .tm-why, .tm-tip { background: var(--green-soft); }
    .tm-platform { background: var(--surface-2); }
    .tm-platform::before { background: var(--muted); }
    .tm-callout-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--muted); margin: 0 0 4px !important; }
    .tm-video { margin: 0 0 14px; }
    .tm-video-box { position: relative; aspect-ratio: 16 / 9; border-radius: 15px; overflow: hidden; background: #111; display: grid; place-items: center; }
    .tm-video-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .tm-video-empty .tm-video-box { background: repeating-linear-gradient(135deg, var(--surface-2) 0 10px, var(--surface) 10px 20px); border: 1px dashed var(--line); }
    .tm-video-empty span { font-weight: 700; color: var(--muted); }
    .tm-video figcaption { font-size: .8rem; color: var(--muted); margin-top: 6px; }
    .play-btn { position: absolute; inset: 0; display: grid; place-items: center; gap: 6px; align-content: center; border: 0; background: #111; color: #fff; cursor: pointer; font-weight: 700; }
    .play-btn svg { width: 52px; height: 52px; }
    .play-btn small { font-weight: 400; opacity: .85; }
    .tm-quiz { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin: 0 0 14px; background: var(--card); }
    .tm-quiz fieldset { border: 0; padding: 0; margin: 0 0 8px; min-width: 0; } /* fieldsets otherwise refuse to shrink below their longest word */
    .tm-opt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; cursor: pointer; overflow-wrap: anywhere; }
    .tm-opt input { margin-top: 4px; width: 18px; height: 18px; flex: none; }
    .tm-q { font-weight: 700; }
    .tm-feedback { font-weight: 700; margin: 8px 0 0 !important; }
    .tm-feedback.right { color: var(--green); } .tm-feedback.wrong { color: var(--orange); }
    .tm-explain { font-size: .93rem; margin-top: 6px !important; }
    .tm-btn { border: 2px solid var(--blue); color: var(--blue); background: var(--card); min-height: 38px; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; }
    .tm-btn.tm-primary { background: var(--blue); color: var(--on-blue); }
    .tm-answer { display: flex; flex-direction: column; gap: 4px; font-size: .87rem; font-weight: 700; margin: 6px 0; }
    .tm-answer input { width: 8em; min-height: 36px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
    .tm-drill { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 16px; background: var(--card); scroll-margin-top: 64px; }
    .tm-drill.is-earned { border-color: var(--green); border-width: 2px; }
    .tm-skillcheck { border-color: var(--week); border-width: 2px; }
    .tm-drill-head h2 { margin-top: 0 !important; }
    .tm-facts { font-size: .8rem; color: var(--muted); }
    .tm-pill { display: inline-block; font-size: .7rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
    .tm-pill.tm-web { background: var(--blue-soft); color: var(--blue); }

    .tm-step { counter-increment: step; position: relative; padding: 10px 0 10px 34px; border-top: 1px solid var(--line); }
    .tm-step::before { content: counter(step); position: absolute; left: 0; top: 10px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; font-weight: 700; border: 2px solid var(--line); background: var(--card); }

    .tm-step[data-result="pass"]::before { content: "✓"; background: var(--green); border-color: var(--green); color: var(--card); }

    .tm-step-status { font-size: .78rem; color: var(--muted); margin: 6px 0 0 !important; }
    .tm-status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
    .tm-variant { font-size: .87rem; margin: 4px 0 0 !important; }
    .tm-hint summary { cursor: pointer; font-size: .87rem; color: var(--blue); font-weight: 700; margin-top: 4px; min-height: 28px; display: flex; align-items: center; }
    .tm-hint p { font-size: .87rem; margin: 4px 0 0 !important; }
    .tm-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .tm-labels { display: inline-flex; flex-wrap: wrap; gap: 4px; }
    .tm-pill.tm-assess { border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .tm-pill.tm-assess-auto { border-color: var(--blue); color: var(--blue); }
    .tm-pill.tm-assess-screenshot { border-color: var(--orange-fill); color: var(--orange); }
    .tm-pill.tm-assess-instructor { border-color: var(--green); color: var(--green); }
    .tm-award { display: flex; align-items: center; gap: 8px; font-size: .85rem; margin: 6px 0 0 !important; color: var(--muted); }
    .tm-badge-art { flex: none; }
    .tm-screenshot { border: 1px dashed var(--orange-fill); border-radius: 8px; padding: 8px 10px; margin: 6px 0; background: var(--orange-soft); }

    .tm-example summary { cursor: pointer; font-size: .87rem; color: var(--blue); font-weight: 700; }
    .tm-from { font-size: .87rem; margin: 0 0 6px !important; }
    .tm-pill.tm-instructor-pill { background: var(--green-soft); color: var(--green); }

    .starter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; margin: 10px 0; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: .87rem; }
    .starter-bar .file { flex: 1 1 140px; min-width: 0; }
    .starter-bar .file b { display: block; }
    .confirm { padding: 8px 10px; border-radius: 8px; border: 2px solid var(--orange-fill); background: var(--orange-soft); margin: 6px 0; flex-basis: 100%; }
    .confirm p { margin: 0 0 6px; font-weight: 700; }
    .result { margin: 6px 0 0; padding: 6px 8px; border-radius: 6px; font-size: .87rem; border-left: 4px solid var(--muted); background: var(--surface); }
    .result[data-state="pass"] { border-left-color: var(--green); }
    .result[data-state="fail"] { border-left-color: var(--orange-fill); }
    .result b { display: block; }
    .result[data-state="pass"] b { color: var(--green); }
    .result[data-state="fail"] b { color: var(--orange); }

    .tick input { width: 20px; height: 20px; margin-top: 1px; flex: none; accent-color: var(--green); }
    .drill-summary { font-weight: 700; margin: 0; }
    .award-banner { display: flex; gap: 12px; align-items: center; padding: 10px 12px; margin-top: 12px; border-radius: var(--radius); background: var(--green-soft); border: 2px solid var(--green); }

    }

    /* ---------- Skill check ---------- */
    .sc-start fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
    .sc-start legend { font-weight: 700; padding: 0 4px; }
    .sc-start label { display: flex; gap: 8px; align-items: center; min-height: 32px; cursor: pointer; }
    .timer { position: sticky; top: 56px; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin: 0 0 12px; border-radius: var(--radius); background: var(--surface); border: 2px solid var(--week); box-shadow: 0 4px 12px rgb(0 0 0 / .08); }

    .timer .label { flex: 1; font-size: .8rem; color: var(--muted); }

    .timer[data-low="true"] .time { color: var(--orange); }
    .score { font-size: 2rem; font-weight: 700; font-family: var(--tm-heading); margin: 0; }

    /* ---------- Badges and record screen ---------- */
    .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; margin: 0 0 12px; padding: 0; list-style: none; }
    .badge-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 10px 6px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); font-size: .8rem; }
    .badge-card b { font-size: .87rem; }

    .cert-list { list-style: none; padding: 0; margin: 0 0 12px; }

    .cert-list li > div { flex: 1 1 160px; }

    .field { display: flex; flex-direction: column; gap: 4px; margin: 0 0 14px; font-weight: 700; }
    .field small { font-weight: 400; color: var(--muted); }
    .field select, .field input[type="text"] { min-height: 40px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-weight: 400; }
    .sample { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin: 0 0 14px; }
    .sample h3 { margin: 0 0 4px; font-family: var(--tm-heading); }
    .sample p { margin: 0; font-family: var(--tm-body); }

    footer.app-foot { max-width: 640px; margin: 0 auto; padding: 0 14px 18px; font-size: .78rem; color: var(--muted); }
    .loading { padding: 30px 0; text-align: center; color: var(--muted); }
  </style>
</head>

    "anim.count":     { params: { title: PS, says: PS, kind: PPT_KINDS, name: PS, class: "enum:entrance|emphasis|exit|path", min: "int", max: "int" }, selector: true, needsOneOf: ["min", "max"] },
    "link.present":   { params: { title: PS, url: PS, toSlide: PS, says: PS, button: "bool" }, selector: true },
    "zoom.is":        { params: { title: PS, kind: "enum:summary|section|slide", returnToZoom: "bool" }, selector: true },
    "show.is":        { params: { loop: "bool", kiosk: "bool", narration: "bool", useTimings: "bool", customShow: PS, slides: "int", includes: PS, excludes: PS, timings: "bool" } },
    "comment.is":     { params: { title: PS, says: PS, author: PS, state: "enum:present|absent|replied|resolved" }, selector: true },
    "comment.count":  { params: { title: PS, says: PS, author: PS, min: "int", max: "int" }, selector: true, needsOneOf: ["min", "max"] },
    "doc.is":         { params: { personalInfo: "enum:removed", fontsEmbedded: "bool", final: "bool", modifyPassword: "bool", notes: "enum:none", offSlide: "enum:none" },
                        needsOneOf: ["personalInfo", "fontsEmbedded", "final", "modifyPassword", "notes", "offSlide"] },
    "access.is":      { params: { rules: PS } },
  };

  // Which catalog a course uses. course.config.md says "app: excel"; Word is the default.
  const CHECK_SETS = {
    word: { checks: CHECKS, selectors: SELECTORS, starter: /^starters\/[\w\-./]+\.(docx|dotx)$/i, starterExample: "starters/week-01/W1-L2-letter.docx", appName: "Word" },
    excel: { checks: EXCEL_CHECKS, selectors: EXCEL_SELECTORS, starter: /^starters\/[\w\-./]+\.(xlsx|xltx|xlsm|csv|txt)$/i, starterExample: "starters/week-01/E1-L1-rentals.xlsx", appName: "Excel" },
    powerpoint: { checks: POWERPOINT_CHECKS, selectors: PPT_SELECTORS, starter: /^starters\/[\w\-./]+\.(pptx|potx)$/i, starterExample: "starters/week-01/P1-L1-welcome.pptx", appName: "PowerPoint" },
  };
  /** The catalog for an app name ("excel"), falling back to Word. */
  function checkSet(app) { return CHECK_SETS[String(app || "word").toLowerCase()] || CHECK_SETS.word; }

  const DIRECTIVES = ["video", "callout", "platform", "quiz", "drill", "skillcheck", "preflight", "rubric",
    // used only in content/outline.md:
    "week", "outcomes", "certification",
    // used only in section files (sections/<CODE>.md):
    "replace-video", "add-video"];
  const CALLOUT_KINDS = ["tip", "note", "warning", "why", "ai", "privacy"];
  const PLATFORMS = ["web", "desktop", "windows", "mac"];
  const FILE_TYPES = ["lesson", "skillcheck", "project", "capstone", "config", "info", "outline", "section"];

  // Video ids are permanent names for a video slot, such as "w1-l2-show-hide".
  // Section files point at them, so never rename one once a section uses it.
  const VIDEO_ID = /^[a-z0-9][a-z0-9-]{2,48}$/;
  // Section codes, such as "WRD-7K3Q". The section file is sections/<CODE>.md
  const SECTION_CODE = /^[A-Z0-9]{2,6}-[A-Z0-9]{3,8}$/;

  // How an activity is assessed. Shown to learners BEFORE they start it.
  //   auto       - the trainer checks the document
  //   screenshot - the learner shows their screen; an instructor marks it (or, in
  //                practice mode, the learner compares it with an example)
  //   instructor - an instructor grades it with a rubric (self-check in practice mode)
  //   practice   - never graded, in any mode
  const ASSESS_KINDS = ["auto", "screenshot", "instructor", "practice"];
  const ASSESS_LABELS = {
    auto: { section: "Auto-checked", practice: "Auto-checked" },
    screenshot: { section: "Screenshot for your instructor", practice: "Screenshot: compare with the example" },
    instructor: { section: "Graded by your instructor", practice: "Self-check with the rubric" },
    practice: { section: "Practice only", practice: "Practice only" },
  };
  const COURSE_MODES = ["practice", "section"];

  // Step keys allowed inside drills, skill checks and preflights, and inside outline weeks.
  const STEP_KEYS = ["check", "hint", "web", "desktop", "video", "points", "answer", "platform", "screenshot", "example", "describe"];
  const ITEM_KEYS = ["file", "kind", "minutes", "goals", "drills"];
  const ITEM_KINDS = ["start", "lesson", "skillcheck", "project", "capstone"];

  // One color per week, used by the roadmap lines and the badges.
  // Each clears 4.5:1 against white for the white text drawn on it.
  const WEEK_COLORS = { 1: "#0046ad", 2: "#305305", 3: "#a23108", 4: "#6b21a8", 5: "#374151" };

  // -------------------------------------------------------------------------
  // Small helpers
  // -------------------------------------------------------------------------

  /** Make text safe to put inside HTML (the most important function here). */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /** Convert "1in", "36pt", "2.54cm" to points. Returns null if it isn't a length. */
  function toPoints(v) {
    const m = /^(\d+(?:\.\d+)?)(in|pt|cm|mm)$/.exec(String(v).trim());
    if (!m) return null;
    const n = parseFloat(m[1]);
    return { in: n * 72, pt: n, cm: n * 72 / 2.54, mm: n * 72 / 25.4 }[m[2]];
  }

  /** "[a, b, c]" -> ["a","b","c"]; "a, b" -> ["a","b"]; anything else -> the string. */
  function parseValue(raw) {
    const v = raw.trim();
    if (/^\[.*\]$/.test(v)) return v.slice(1, -1).split(",").map(x => unquote(x.trim())).filter(Boolean);
    if (v === "true") return true;
    if (v === "false") return false;
    return unquote(v);
  }
  function unquote(v) { return /^".*"$/.test(v) ? v.slice(1, -1) : v; }
  function splitList(v) { return Array.isArray(v) ? v : String(v || "").split(",").map(x => x.trim()).filter(Boolean); }

  // -------------------------------------------------------------------------
  // 1. PARSE
  // -------------------------------------------------------------------------

  /**
   * Parse a whole Trainer Markdown file.
   * Returns { meta, blocks, issues } where issues are problems found while
   * reading (validate() adds more).
   */
  function parse(text) {
    const lines = String(text).replace(/\r\n?/g, "\n").split("\n");
    const issues = [];
    const meta = {};
    let i = 0;

    // --- front matter: between the first two "---" lines ---
    if (lines[0] && lines[0].trim() === "---") {
      i = 1;
      while (i < lines.length && lines[i].trim() !== "---") {
        const line = lines[i];
        if (line.trim()) {
          const m = /^([A-Za-z][\w-]*)\s*:\s*(.*)$/.exec(line);
          if (m) meta[m[1]] = parseValue(m[2]);
          else issues.push(issue("error", i + 1, `Front matter line is not "key: value": ${line.trim()}`));
        }
        i++;
      }
      if (i >= lines.length) issues.push(issue("error", 1, "Front matter is not closed with a --- line."));
      i++; // skip closing ---
    } else {
      issues.push(issue("error", 1, "The file must start with front matter between two --- lines."));
    }

    // --- body: Markdown chunks and ::: directives ---
    const blocks = [];
    let mdBuffer = [];
    let mdStart = i + 1;
    const flushMd = () => {
      if (mdBuffer.length) blocks.push({ kind: "md", lines: mdBuffer, line: mdStart });
      mdBuffer = [];
    };

    while (i < lines.length) {
      const line = lines[i];
      const open = /^:::\s*([a-z][a-z-]*)\s*(.*)$/.exec(line.trim());
      if (open && line.trim() !== ":::") {
        flushMd();
        const start = i + 1;
        const inner = [];
        i++;
        while (i < lines.length && lines[i].trim() !== ":::") { inner.push(lines[i]); i++; }
        if (i >= lines.length) issues.push(issue("error", start, `The ::: ${open[1]} block that starts here is never closed with :::`));
        blocks.push(parseDirective(open[1], open[2].trim(), inner, start, issues));
        i++;
        mdStart = i + 1;
        continue;
      }
      if (!mdBuffer.length) mdStart = i + 1;
      mdBuffer.push(line);
      i++;
    }
    flushMd();
    return { meta, blocks, issues };
  }

  function issue(level, line, message) { return { level, line, message }; }

  /** Parse what is inside a ::: block. `start` is the line number of the ::: line. */
  function parseDirective(name, arg, inner, start, issues) {
    const block = { kind: "directive", name, arg, line: start, header: {}, headerLines: {}, intro: [], steps: [], body: inner, items: [] };
    if (!DIRECTIVES.includes(name)) {
      issues.push(issue("error", start, `Unknown directive "::: ${name}". Use one of: ${DIRECTIVES.join(", ")}.`));
      return block;
    }

    // Free-text directives: their inside is Markdown.
    if (name === "callout" || name === "platform") { block.md = inner; return block; }

    // Outcomes and certification lists (outline file only): "- id | text"
    if (name === "outcomes" || name === "certification") {
      inner.forEach((l, k) => {
        if (!l.trim()) return;
        const m = /^-\s*([^|]+)\|\s*(.+)$/.exec(l.trim());
        if (!m) { issues.push(issue("error", start + k + 1, 'List lines look like "- CLO1 | Create, save, format and print documents".')); return; }
        block.items.push({ id: m[1].trim(), text: m[2].trim(), line: start + k + 1 });
      });
      return block;
    }

    // Rubric: "- id | points | CLOs | description"
    if (name === "rubric") {
      inner.forEach((l, k) => {
        if (!l.trim()) return;
        const m = /^-\s*(.+)$/.exec(l.trim());
        const parts = m ? m[1].split("|").map(s => s.trim()) : [];
        if (parts.length !== 4) { issues.push(issue("error", start + k + 1, 'Rubric lines look like "- P1-a | 25 | CLO1 | Description".')); return; }
        block.items.push({ id: parts[0], points: Number(parts[1]), clos: splitList(parts[2]), text: parts[3], line: start + k + 1 });
      });
      return block;
    }

    // Everything else: header keys, then (for drills) intro Markdown and steps.
    let k = 0;
    // header: contiguous "key: value" lines at the top
    while (k < inner.length) {
      const l = inner[k];
      if (!l.trim()) { k++; if (Object.keys(block.header).length) break; continue; }
      const m = /^([A-Za-z][\w-]*)\s*:\s*(.*)$/.exec(l);
      if (!m || /^-\s/.test(l)) break;
      block.header[m[1]] = m[2].trim();
      block.headerLines[m[1]] = start + k + 1;
      k++;
    }

    if (name === "quiz") {
      for (; k < inner.length; k++) {
        const l = inner[k].trim();
        const lineNo = start + k + 1;
        if (!l) continue;
        const opt = /^-\s*\[( |x|X)\]\s*(.+)$/.exec(l);
        const kv = /^([A-Za-z]+)\s*:\s*(.*)$/.exec(l);
        if (opt) block.items.push({ correct: opt[1].toLowerCase() === "x", text: opt[2], line: lineNo });
        else if (kv) { block.header[kv[1]] = kv[2].trim(); block.headerLines[kv[1]] = lineNo; }
        else issues.push(issue("error", lineNo, 'Quiz lines are "key: value" or options like "- [x] Right answer".'));
      }
      return block;
    }

    if (name === "video" || name === "replace-video" || name === "add-video") return block;

    // drill / skillcheck / preflight: intro Markdown, then "- step:" or "- task:" items
    // week (outline only): "- item:" entries, one per station on the roadmap
    const stepWord = name === "skillcheck" ? "task" : name === "week" ? "item" : "step";
    const allowedKeys = name === "week" ? ITEM_KEYS : STEP_KEYS;
    let current = null;
    for (; k < inner.length; k++) {
      const raw = inner[k];
      const lineNo = start + k + 1;
      const stepStart = new RegExp("^-\\s*(step|task|item)\\s*:\\s*(.*)$").exec(raw.trim());
      if (stepStart && !/^\s/.test(raw)) {
        if (stepStart[1] !== stepWord) issues.push(issue("error", lineNo, `Use "- ${stepWord}:" inside a ${name} block.`));
        current = { text: stepStart[2], checks: [], hints: [], line: lineNo, extra: {} };
        block.steps.push(current);
        continue;
      }
      if (current && /^\s+\S/.test(raw)) {
        const m = /^\s+([A-Za-z]+)\s*:\s*(.*)$/.exec(raw);
        if (!m) { issues.push(issue("error", lineNo, 'Step details are indented "key: value" lines, such as "  check: text.absent value=\\"Acme\\"".')); continue; }
        const key = m[1], val = m[2].trim();
        if (key === "check" && name !== "week") current.checks.push(Object.assign(parseCheck(val, lineNo, issues), { line: lineNo }));
        else if (key === "hint" && name !== "week") current.hints.push(val);
        else if (allowedKeys.includes(key) && key !== "check" && key !== "hint") current.extra[key] = val;
        else issues.push(issue("error", lineNo, `Unknown key "${key}" here. Use ${allowedKeys.join(", ")}.`));
        continue;
      }
      if (current && raw.trim()) {
        issues.push(issue("error", lineNo, "Text after a step must be indented under it, or start a new \"- " + stepWord + ":\"."));
        continue;
      }
      if (!current) block.intro.push(raw);
    }
    return block;
  }

  /**
   * Parse the part after "check:".
   * Example: text.present value="Lakeshore Paddle Company" min=4 in=body
   */
  function parseCheck(src, lineNo, issues) {
    const out = { name: "", params: {}, raw: src };
    const nameMatch = /^([a-z]+\.[A-Za-z]+)(.*)$/.exec(src);
    if (!nameMatch) { issues.push(issue("error", lineNo, `"${src}" is not a check. It should start with a name like text.absent.`)); return out; }
    out.name = nameMatch[1];
    let rest = nameMatch[2];
    // Tokens: key=value or key="value with spaces" (\" for a quote inside)
    const re = /\s*([A-Za-z][A-Za-z0-9]*)=("((?:[^"\\]|\\.)*)"|[^\s"]+)/y;
    let pos = 0;
    while (pos < rest.length) {
      if (!rest.slice(pos).trim()) break;
      re.lastIndex = pos;
      const m = re.exec(rest);
      if (!m) { issues.push(issue("error", lineNo, `Could not read "${rest.slice(pos).trim()}". Parameters look like key=value or key="two words".`)); break; }
      out.params[m[1]] = m[3] !== undefined ? m[3].replace(/\\"/g, '"') : m[2];
      pos = re.lastIndex;
    }
    return out;
  }

  // -------------------------------------------------------------------------
  // 2. VALIDATE
  // -------------------------------------------------------------------------

  /**
   * Validate a parsed document.
   * ctx (all optional):
   *   videoHosts: approved host list
   *   starterExists(path) -> true | false | null (null = can't tell)
   */
  function validate(doc, ctx) {
    ctx = ctx || {};
    const set = checkSet(ctx.app);   // which checks this course's lessons may use
    const issues = doc.issues.slice();
    const add = (level, line, message) => issues.push(issue(level, line, message));
    const meta = doc.meta;
    const hosts = ctx.videoHosts || DEFAULT_VIDEO_HOSTS;
    const ready = meta.status === "ready";

    // --- front matter ---
    const type = meta.type;
    if (!FILE_TYPES.includes(type)) add("error", 1, `type must be one of ${FILE_TYPES.join(", ")}.`);
    const isActivityFile = ["lesson", "skillcheck", "project", "capstone"].includes(type);
    if (type === "section") {
      if (!SECTION_CODE.test(String(meta.id || ""))) add("error", 1, 'A section id is its code, such as "WRD-7K3Q" (capitals, numbers, one hyphen).');
      ["title", "instructor"].forEach(k => { if (!meta[k]) add("error", 1, `Front matter is missing "${k}".`); });
      if (ctx.fileName && meta.id && ctx.fileName.replace(/\.md$/, "") !== meta.id) add("error", 1, `Name this file ${meta.id}.md so the trainer can find it by its code.`);
      // skip: [PP1-L3, PP2-SC2] leaves those stops out of the section
      splitList(meta.skip).forEach((id) => {
        if (!STOP_ID.test(id)) add("error", 1, `skip: "${id}" isn't a lesson id (such as PP1-L3).`);
        else if (ctx.stopIds && !ctx.stopIds.has(id)) add("error", 1, `skip: there's no stop "${id}" in this course.`);
      });
    }
    if (type === "info" || type === "outline") {
      ["id", "title"].forEach(k => { if (!meta[k]) add("error", 1, `Front matter is missing "${k}".`); });
    }
    if (type === "config") {
      if (meta.mode && !COURSE_MODES.includes(meta.mode)) add("error", 1, `mode is "practice" or "section".`);
      if (meta.certificateEach && !["lesson", "week", "course", "none"].includes(meta.certificateEach)) add("error", 1, 'certificateEach is "lesson", "week", "course" or "none".');
    }
    if (isActivityFile) {
      ["id", "week", "order", "title", "objectives"].forEach(k => { if (meta[k] === undefined || meta[k] === "") add("error", 1, `Front matter is missing "${k}".`); });
      splitList(meta.objectives).forEach(o => { if (!/^W[1-5]\.[1-9]$/.test(o)) add("warning", 1, `Objective "${o}" is not in the course map (expected W1.1 to W5.6).`); });
      splitList(meta.clos).forEach(c => { if (!/^CLO[1-8]$/.test(c)) add("warning", 1, `"${c}" is not a course learning outcome (CLO1 to CLO8).`); });
      if (meta.status && !["draft", "ready"].includes(meta.status)) add("error", 1, 'status is "draft" or "ready".');
    }

    const ids = new Set();
    let drillCount = 0;
    for (const b of doc.blocks) {
      if (b.kind === "md") { validateMarkdown(b, add); continue; }
      if (!DIRECTIVES.includes(b.name)) continue;
      const h = b.header;
      const need = (key, why) => { if (!h[key]) add("error", b.line, `::: ${b.name} needs "${key}:"${why ? " (" + why + ")" : ""}.`); };

      // Outline-only blocks
      if (["week", "outcomes", "certification"].includes(b.name) && type !== "outline") {
        add("error", b.line, `::: ${b.name} belongs in content/outline.md only.`); continue;
      }
      if (["quiz", "drill", "skillcheck", "preflight", "rubric", "week"].includes(b.name)) {
        if (!b.arg) add("error", b.line, `::: ${b.name} needs an id, for example "::: ${b.name} ${b.name === "quiz" ? "Q1.1" : "D1.01"}".`);
        else if (ids.has(b.arg)) add("error", b.line, `The id "${b.arg}" is used twice in this file.`);
        else ids.add(b.arg);
      }

      switch (b.name) {
        case "video": {
          videoChecks(b, need, add, hosts, ready);
          if (!h.id) add("error", b.line, 'Give this video a permanent id, such as "id: w1-l2-show-hide". Section files use it to swap in an instructor\'s video.');
          else if (!VIDEO_ID.test(h.id)) add("error", b.headerLines.id, "A video id uses lowercase letters, numbers and hyphens (3 to 49 characters).");
          else if (ids.has("video:" + h.id)) add("error", b.headerLines.id, `The video id "${h.id}" is used twice in this file.`);
          else ids.add("video:" + h.id);
          break;
        }
        case "replace-video": case "add-video": {
          if (type !== "section") { add("error", b.line, `::: ${b.name} belongs in a section file (sections/<CODE>.md).`); break; }
          videoChecks(b, need, add, hosts, ready);
          if (!b.arg) add("error", b.line, b.name === "replace-video" ? "Name the video to replace: ::: replace-video w1-l2-show-hide" : "Name where the video goes: ::: add-video after D1.03 (a video id or an activity id).");
          const target = b.name === "add-video" ? b.arg.replace(/^after\s+/, "") : b.arg;
          if (b.name === "replace-video") {
            if (ctx.videoIds && target && !ctx.videoIds.has(target)) add("error", b.line, `There's no course video with the id "${target}".`);
            if (ids.has("replace:" + target)) add("error", b.line, `"${target}" is replaced twice in this file.`);
            ids.add("replace:" + target);
          } else if (ctx.anchorIds && target && !ctx.anchorIds.has(target)) add("error", b.line, `There's no course video or activity with the id "${target}" to place this after.`);
          if (h.note && h.note.length > 280) add("warning", b.headerLines.note, "Keep the note under 280 characters; it sits above the video.");
          break;
        }
        case "callout":
          if (!CALLOUT_KINDS.includes(b.arg)) add("error", b.line, `Callout kind must be one of: ${CALLOUT_KINDS.join(", ")}.`);
          validateMarkdown({ lines: b.md, line: b.line + 1 }, add);
          break;
        case "platform":
          if (!PLATFORMS.includes(b.arg)) add("error", b.line, `Platform must be one of: ${PLATFORMS.join(", ")}.`);
          validateMarkdown({ lines: b.md, line: b.line + 1 }, add);
          break;
        case "quiz": {
          need("question");
          const qtype = h.type || "single";
          if (!["single", "multi", "number"].includes(qtype)) add("error", b.headerLines.type, 'Quiz type is "single", "multi" or "number".');
          if (qtype === "number") {
            if (h.answer === undefined || isNaN(Number(h.answer))) add("error", b.line, 'A number quiz needs "answer:" with a number.');
          } else {
            const right = b.items.filter(o => o.correct).length;
            if (b.items.length < 2) add("error", b.line, "A quiz needs at least two options.");
            if (qtype === "single" && right !== 1) add("error", b.line, "A single-answer quiz needs exactly one [x] option.");
            if (qtype === "multi" && right < 1) add("error", b.line, "A multi-answer quiz needs at least one [x] option.");
          }
          if (!h.explain) add("warning", b.line, 'Add "explain:" so learners learn from a wrong answer.');
          break;
        }
        case "drill": case "skillcheck": case "preflight": {
          if (b.name === "drill") drillCount++;
          need("title");
          if (b.name !== "preflight") need("starter", "checks are written against it");
          need("platform");
          if (h.platform && !["web", "desktop"].includes(h.platform)) add("error", b.headerLines.platform, 'platform is "web" (works in both) or "desktop" (needs desktop ' + set.appName + ').');
          if (h.starter && h.starter !== "none") {
            if (!set.starter.test(h.starter) || h.starter.includes("..")) add("error", b.headerLines.starter, 'starter should be a path like "' + set.starterExample + '".');
            else if (ctx.starterExists) {
              const found = ctx.starterExists(h.starter);
              if (found === false) add(ready ? "error" : "warning", b.headerLines.starter, `Starter file not found: ${h.starter}`);
            }
          }
          // files: other downloads a drill needs (a photo to insert, a recipient list, a second version to compare)
          splitList(h.files).forEach((f) => {
            if (!/^starters\/[\w\-./]+\.(docx|dotx|xlsx|xltx|pptx|potx|csv|txt|png|jpg|jpeg|svg|glb|mp4|m4a|mp3|wav)$/i.test(f) || f.includes("..")) add("error", b.headerLines.files, `files: "${f}" should be a path like "starters/week-03/kayak.jpg".`);
            else if (ctx.starterExists && ctx.starterExists(f) === false) add(ready ? "error" : "warning", b.headerLines.files, `File not found: ${f}`);
          });
          if (b.name === "skillcheck") {
            ["timeLimit", "attempts", "passing"].forEach(key => { if (h[key] && isNaN(Number(h[key]))) add("error", b.headerLines[key], `${key} must be a number.`); });
            need("timeLimit");
          }
          if (h.assess) splitList(h.assess).forEach(a => { if (!ASSESS_KINDS.includes(a)) add("error", b.headerLines.assess, `assess is one or more of ${ASSESS_KINDS.join(", ")}.`); });
          if (h.badge !== undefined && !h.badge.trim()) add("error", b.headerLines.badge, "badge needs a short name, or leave the line out to use the drill title.");
          if (h.badge && h.badge.length > 40) add("warning", b.headerLines.badge, "Badge names longer than 40 characters get cut off on the certificate.");
          if (!b.steps.length) add("error", b.line, `::: ${b.name} ${b.arg} has no steps.`);
          let checked = 0, shots = 0;
          b.steps.forEach(s => {
            if (!s.text) add("error", s.line, "This step has no text.");
            if (s.checks.length || s.extra.answer !== undefined) checked++;
            if (b.name === "skillcheck") {
              if (s.hints.length) add("error", s.line, "Skill check tasks can't have hints.");
              if (!s.checks.length && s.extra.answer === undefined) add("error", s.line, "Every skill check task needs a check or an answer.");
            }
            if (s.extra.platform && !["web", "desktop"].includes(s.extra.platform)) add("error", s.line, 'A step platform is "web" or "desktop".');
            if (s.extra.points && isNaN(Number(s.extra.points))) add("error", s.line, "points must be a number.");
            if (s.extra.screenshot !== undefined) {
              shots++;
              if (b.name === "skillcheck") add("error", s.line, "Skill checks are auto-checked only; move screenshot steps to a drill.");
              if (!s.extra.screenshot.trim()) add("error", s.line, "screenshot: says what the screenshot must show.");
              if (s.checks.length) add("warning", s.line, "This step has both a check and a screenshot; the check alone is usually enough.");
              const ex = s.extra.example;
              if (!ex) add("warning", s.line, "Add example: with an image of a correct screenshot, so practice-mode learners can compare.");
              else if (ex === "TODO") add(ready ? "error" : "warning", s.line, "The example screenshot hasn't been captured yet.");
              else if (!/^images\/[\w\-./]+\.(png|jpg|jpeg|webp)$/i.test(ex) || ex.includes("..")) add("error", s.line, 'example should be a path like "images/week-01/qat.png".');
            } else if (s.extra.example || s.extra.describe) add("error", s.line, "example: and describe: go with a screenshot: step.");
            if (s.extra.video) checkUrl(s.extra.video, s.line, add, hosts, true);
            s.checks.forEach(c => validateCheck(c, b.name, add, set));
            [s.text].concat(s.hints, s.extra.web || [], s.extra.desktop || []).forEach(t => checkInline(t, s.line, add));
          });
          if (b.name === "drill" && !checked && !shots && !splitList(h.assess).includes("practice")) add("warning", b.line, `Drill ${b.arg} has no checked or screenshot steps. Add "assess: practice" if that's on purpose.`);
          validateMarkdown({ lines: b.intro, line: b.line + 1 }, add);
          break;
        }
        case "week": {
          if (!/^W[1-9]$/.test(b.arg || "")) add("error", b.line, 'A week id looks like "::: week W1".');
          need("title");
          if (h.color && !/^#[0-9A-Fa-f]{6}$/.test(h.color)) add("error", b.headerLines.color, "color is a hex value like #0046ad.");
          b.steps.forEach(it => {
            const e = it.extra;
            if (!it.text) add("error", it.line, "Each item needs a title.");
            if (!e.kind || !ITEM_KINDS.includes(e.kind)) add("error", it.line, `kind is one of ${ITEM_KINDS.join(", ")}.`);
            if (e.minutes && isNaN(Number(e.minutes))) add("error", it.line, "minutes must be a number.");
            if (e.file) {
              if (!/^content\/[\w\-./]+\.md$/.test(e.file) || e.file.includes("..")) add("error", it.line, 'file is a path like "content/week-01/01-meet-word.md".');
              else if (ctx.fileExists && ctx.fileExists(e.file) === false) add("error", it.line, `File not found: ${e.file}`);
            }
            if (!e.goals) add("warning", it.line, 'Add "goals:" - one sentence on what learners will be able to do.');
          });
          break;
        }
        case "outcomes": case "certification":
          if (!b.items.length) add("error", b.line, `::: ${b.name} is empty.`);
          break;
        case "rubric": {
          const total = b.items.reduce((sum, it) => sum + (isNaN(it.points) ? 0 : it.points), 0);
          b.items.forEach(it => { if (isNaN(it.points)) add("error", it.line, "Rubric points must be a number."); });
          if (total !== 100) add("error", b.line, `Rubric points total ${total}; they must total 100.`);
          break;
        }
      }
    }
    if (type === "lesson" && !drillCount) add("warning", 1, "This lesson has no drills.");
    if (type === "outline" && !doc.blocks.some(b => b.name === "week")) add("error", 1, "The outline needs at least one ::: week block.");
    return issues.sort((a, b) => a.line - b.line);
  }

  /** Checks every kind of video block shares: url, approved host, title, captions. */
  function videoChecks(b, need, add, hosts, ready) {
    const h = b.header;
    need("url"); need("title", "it names the player for screen readers"); need("captions");
    const url = h.url || "";
    if (url === "TODO") add(ready ? "error" : "warning", b.headerLines.url || b.line, `Video "${h.title || ""}" has no URL yet.`);
    else if (url) {
      const host = hostOf(url);
      if (!host) add("error", b.headerLines.url, "Video url must be a full https:// address.");
      else if (!hosts.includes(host) && !(host === "youtu.be" && hosts.includes("www.youtube.com"))) add("error", b.headerLines.url, `Video host "${host}" is not on the approved list (${hosts.join(", ")}).`);
    }
    if (h.captions && !["verified", "auto", "none"].includes(h.captions)) add("error", b.headerLines.captions, 'captions is "verified", "auto" or "none".');
    if (h.captions && h.captions !== "verified") add(ready ? "error" : "warning", b.headerLines.captions || b.line, `Video "${h.title || ""}" needs human-verified captions before this file is ready (ADA Title II, WCAG 1.2.2).`);
  }

  /**
   * Course index for section files: every video id and every activity id
   * (drills, quizzes, skill checks), and every stop's id (lessons, skill checks,
   * projects, the capstone: what a section can skip), from a list of parsed lesson files.
   */
  function courseIndex(docs) {
    const videos = [], videoIds = new Set(), anchorIds = new Set(), stopIds = new Set();
    for (const d of docs) if (["lesson", "skillcheck", "project", "capstone"].includes(d.meta.type) && d.meta.id) stopIds.add(String(d.meta.id));
    for (const d of docs) for (const b of d.blocks) {
      if (b.name === "video" && b.header.id) {
        videoIds.add(b.header.id); anchorIds.add(b.header.id);
        videos.push({ id: b.header.id, title: b.header.title || "", lesson: d.meta.title || "", lessonId: d.meta.id || "", url: b.header.url || "" });
      }
      if (["drill", "quiz", "skillcheck", "preflight", "rubric"].includes(b.name) && b.arg) anchorIds.add(b.arg);
    }
    return { videos, videoIds, anchorIds, stopIds };
  }

  /**
   * Apply one section file to one lesson: swap replaced videos and insert
   * added ones. Returns a NEW document; the lesson itself is never changed.
   * Each instructor video remembers the stock one (stockUrl) so learners can
   * still choose the standard video.
   */
  function applyOverrides(doc, section) {
    if (!section) return doc;
    const replace = Object.create(null), after = Object.create(null); // no inherited names such as "constructor"
    for (const b of section.blocks) {
      if (b.name === "replace-video" && b.arg) replace[b.arg] = b;
      if (b.name === "add-video" && b.arg) (after[b.arg.replace(/^after\s+/, "")] = after[b.arg.replace(/^after\s+/, "")] || []).push(b);
    }
    const who = section.meta.instructor || "your instructor";
    const asVideo = (o, stock) => ({ kind: "directive", name: "video", arg: "", line: o.line, header: Object.assign({}, o.header, { id: stock ? stock.header.id : "" }),
      headerLines: {}, intro: [], steps: [], body: [], items: [],
      source: "instructor", instructor: who, stockUrl: stock ? stock.header.url : null, stockTitle: stock ? stock.header.title : null });
    const blocks = [];
    for (const b of doc.blocks) {
      const vid = b.name === "video" ? b.header.id : null;
      blocks.push(vid && replace[vid] ? asVideo(replace[vid], b) : b);
      const anchor = vid || (b.kind === "directive" ? b.arg : null);
      if (anchor && after[anchor]) after[anchor].forEach(o => blocks.push(asVideo(o, null)));
    }
    return Object.assign({}, doc, { blocks });
  }

  // -------------------------------------------------------------------------
  // SECTIONS: section keys and section files, in one shape
  // -------------------------------------------------------------------------
  // An instructor can set up a section two ways:
  //   1. A SECTION KEY: the whole section packed into one line of text, made
  //      on instructor/sections.html. Students paste it into the panel. It
  //      needs no server and no upload: the settings live inside the key.
  //   2. A SECTION FILE: sections/<CODE>.md in the course folder (5.13 in
  //      trainer-markdown.md). Students type the short code. Someone with
  //      access to the website has to add the file.
  // Both turn into the same plain object (a "section"):
  //   { app, title, instructor, term,
  //     skip:   ["PP1-L3", ...]   lesson ids the section leaves out,
  //     videos: [{ replace: "w1-l2-show-hide" } or { after: "D1.05" },
  //              plus url, title, captions, note, duration] }
  // A key is NOT secret and NOT trusted: anyone can make one. So everything
  // in it is checked here, the same way for keys and files, before the panel
  // uses it: lengths are capped, ids must look like ids, and videos must come
  // from the course's approved hosts. A key can't add a host or run code.
  // -------------------------------------------------------------------------
  const SECTION_KEY_PREFIX = "OTK1.";           // "Office Trainer key, version 1"
  const SECTION_KEY_MAX = 20000;                 // characters; a key with 60 videos is about 15,000
  const STOP_ID = /^[A-Za-z0-9][A-Za-z0-9-]{1,31}$/;          // lesson ids such as PP1-L3, W2-SC2
  const ANCHOR_ID = /^[A-Za-z0-9][A-Za-z0-9.-]{1,48}$/;        // video ids (w1-l2-show-hide) or activity ids (D1.05)
  const SECTION_APPS = ["word", "excel", "powerpoint"];
  const CAPTION_CHOICES = ["verified", "auto", "none"];

  /** Plain one-line text: no control, invisible or text-direction characters (which can disguise a name), trimmed, at most max characters. */
  function cleanText(value, max) {
    return String(value === undefined || value === null ? "" : value)
      .replace(/[\u0000-\u001f\u007f-\u009f\u061c\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g, " ")
      .replace(/\s+/g, " ").trim().slice(0, max);
  }

  /**
   * Will this link play in a lesson? It must be https, and after embedUrl
   * turns it into a player link (YouTube watch links become privacy-enhanced
   * youtube-nocookie links, Vimeo pages become player links), its host must
   * be on the approved list. This is the same test videoFigure uses, so a
   * video that passes here is a video learners can play.
   */
  function videoUrlAllowed(url, hosts) {
    if (typeof url !== "string" || url.length > 500 || !/^https:\/\//i.test(url)) return false;
    const player = embedUrl(url);
    const host = hostOf(player);
    const list = (hosts || DEFAULT_VIDEO_HOSTS).concat(["www.youtube-nocookie.com"]);
    if (!host || !list.includes(host)) return false;
    // YouTube and Vimeo links must point at one video (not a channel, a search or the home page).
    if (/(^|\.)youtube(-nocookie)?\.com$/.test(host)) return /^https:\/\/www\.youtube-nocookie\.com\/embed\/[\w-]{6,}([?#]|$)/.test(player);
    if (/(^|\.)vimeo\.com$/.test(host)) return /^https:\/\/player\.vimeo\.com\/video\/\d+([?#/]|$)/.test(player);
    return true;
  }

  /**
   * Check a section (from a key, a file or the builder) and return a clean copy.
   *   ctx = { app, videoHosts, stopIds, videoIds, anchorIds }  (the id sets are optional)
   * Returns { section, problems }. Bad parts are dropped and described in
   * problems (plain sentences), so one typo never breaks the whole section.
   * Returns section: null when the key can't be used at all.
   */
  function cleanSection(raw, ctx) {
    const c = ctx || {};
    const problems = [];
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return { section: null, problems: ["That isn't a section."] };
    const app = cleanText(raw.app, 12).toLowerCase();
    if (!SECTION_APPS.includes(app)) return { section: null, problems: ["The section doesn't say which course it's for."] };
    if (c.app && app !== c.app) {
      const names = { word: "Word", excel: "Excel", powerpoint: "PowerPoint" };
      return { section: null, problems: [`This section is for the ${names[app]} course. Open Office Trainer in ${names[app]} to join it.`] };
    }
    const section = {
      app,
      title: cleanText(raw.title, 80),
      instructor: cleanText(raw.instructor, 60),
      term: cleanText(raw.term, 40),
      skip: [],
      videos: [],
    };
    if (!section.title) return { section: null, problems: ["The section has no name."] };
    if (!section.instructor) section.instructor = "your instructor";

    // Lessons left out. Unknown ids are dropped (a lesson may have been renamed).
    const skips = Array.isArray(raw.skip) ? raw.skip.slice(0, 200) : [];
    for (const s of skips) {
      const id = cleanText(s, 32);
      if (!STOP_ID.test(id)) { problems.push(`"${id}" isn't a lesson id, so it was ignored.`); continue; }
      if (c.stopIds && !c.stopIds.has(id)) { problems.push(`There's no stop "${id}" in this course any more, so it was ignored.`); continue; }
      if (!section.skip.includes(id)) section.skip.push(id);
    }

    // Videos: each replaces a course video or goes after a video or activity.
    const vids = Array.isArray(raw.videos) ? raw.videos.slice(0, 80) : [];
    const replaced = new Set();
    vids.forEach((v, i) => {
      if (!v || typeof v !== "object") return;
      const n = `Video ${i + 1}`;
      const replace = v.replace !== undefined ? cleanText(v.replace, 49) : "";
      const after = v.after !== undefined ? cleanText(v.after, 49) : "";
      const url = cleanText(v.url, 500);
      const video = {
        url, title: cleanText(v.title, 100) || "Video from " + section.instructor,
        captions: CAPTION_CHOICES.includes(v.captions) ? v.captions : "none",
        note: cleanText(v.note, 240), duration: cleanText(v.duration, 10),
      };
      if (replace) {
        if (!VIDEO_ID.test(replace)) { problems.push(`${n}: "${replace}" isn't a video id, so it was ignored.`); return; }
        if (c.videoIds && !c.videoIds.has(replace)) { problems.push(`${n}: the course has no video "${replace}" any more, so it was ignored.`); return; }
        if (replaced.has(replace)) { problems.push(`${n}: "${replace}" is replaced twice; the first one is used.`); return; }
        replaced.add(replace);
        video.replace = replace;
      } else if (after) {
        if (!ANCHOR_ID.test(after)) { problems.push(`${n}: "${after}" isn't a video or activity id, so it was ignored.`); return; }
        if (c.anchorIds && !c.anchorIds.has(after)) { problems.push(`${n}: the course has no video or activity "${after}" any more, so it was ignored.`); return; }
        video.after = after;
      } else { problems.push(`${n} doesn't say where it goes, so it was ignored.`); return; }
      if (!videoUrlAllowed(url, c.videoHosts)) { problems.push(`${n} ("${video.title}") isn't an https link on an approved video site, so it was left out.`); return; }
      video.url = embedUrl(url); // store the player link (YouTube watch links become privacy-enhanced youtube-nocookie links)
      section.videos.push(video);
    });
    return { section, problems };
  }

  /** UTF-8 text to base64url (the letters, digits, - and _ that survive copy and paste). */
  function toBase64Url(text) {
    const bytes = new TextEncoder().encode(text);
    let binary = "";
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  /** base64url back to UTF-8 text. Throws on anything that isn't base64url. */
  function fromBase64Url(b64) {
    if (!/^[A-Za-z0-9_-]*$/.test(b64)) throw new Error("not base64url");
    const binary = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b64.length + 3) % 4));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  }

  /** Pack a (clean) section into a key: "OTK1." + base64url of its JSON. Empty parts are left out to keep it short. */
  function encodeSectionKey(section) {
    const s = { app: section.app, title: section.title, instructor: section.instructor };
    if (section.term) s.term = section.term;
    if (section.skip && section.skip.length) s.skip = section.skip;
    if (section.videos && section.videos.length) s.videos = section.videos.map((v) => {
      const o = v.replace ? { replace: v.replace } : { after: v.after };
      o.url = v.url; o.title = v.title; o.captions = v.captions;
      if (v.note) o.note = v.note;
      if (v.duration) o.duration = v.duration;
      return o;
    });
    return SECTION_KEY_PREFIX + toBase64Url(JSON.stringify(s));
  }

  /** Does this text look like a section key (as opposed to a short section code)? */
  function isSectionKey(text) { return String(text || "").replace(/\s+/g, "").startsWith(SECTION_KEY_PREFIX); }

  /**
   * Unpack a key that someone pasted. Spaces and line breaks (from email or
   * chat wrapping) are ignored. Returns cleanSection's { section, problems }.
   */
  function decodeSectionKey(text, ctx) {
    const key = String(text || "").replace(/\s+/g, "");
    if (!key.startsWith(SECTION_KEY_PREFIX)) return { section: null, problems: ["A section key starts with OTK1."] };
    if (key.length > SECTION_KEY_MAX) return { section: null, problems: ["That key is too long to be a section key."] };
    let raw;
    try { raw = JSON.parse(fromBase64Url(key.slice(SECTION_KEY_PREFIX.length))); }
    catch (e) { return { section: null, problems: ["That key is damaged or incomplete. Copy the whole key again (it's one long line)."] }; }
    return cleanSection(raw, ctx);
  }

  /** A parsed section file (sections/<CODE>.md) as a section. Its front matter may list skip: [lesson ids]. */
  function sectionFromFile(doc, ctx) {
    if (!doc || !doc.meta || doc.meta.type !== "section") return { section: null, problems: ["That isn't a section file."] };
    const raw = {
      app: (ctx && ctx.app) || doc.meta.app || "word", title: doc.meta.title, instructor: doc.meta.instructor, term: doc.meta.term,
      skip: splitList(doc.meta.skip), videos: [],
    };
    for (const b of doc.blocks) {
      if (b.name !== "replace-video" && b.name !== "add-video") continue;
      const v = Object.assign({}, b.header);
      if (b.name === "replace-video") v.replace = b.arg; else v.after = String(b.arg || "").replace(/^after\s+/, "");
      raw.videos.push(v);
    }
    return cleanSection(raw, ctx);
  }

  /** A section as a document applyOverrides understands (made of replace-video and add-video blocks). */
  function sectionDoc(section) {
    if (!section) return null;
    const blocks = section.videos.map((v, i) => ({
      kind: "directive", name: v.replace ? "replace-video" : "add-video", arg: v.replace ? v.replace : "after " + v.after,
      line: i + 1, header: { url: v.url, title: v.title, captions: v.captions, note: v.note, duration: v.duration },
      headerLines: {}, intro: [], steps: [], body: [], items: [],
    }));
    return { meta: { type: "section", title: section.title, instructor: section.instructor, term: section.term }, blocks };
  }

  /** A section written out as a section file (sections/<CODE>.md), for the website's sections folder. */
  function sectionToFile(section, code) {
    const one = (s) => cleanText(s, 500); // one line, no control characters
    const lines = ["---", "type: section", `id: ${one(code)}`, `title: ${one(section.title)}`, `instructor: ${one(section.instructor)}`];
    if (section.term) lines.push(`term: ${one(section.term)}`);
    if (section.skip.length) lines.push(`skip: [${section.skip.join(", ")}]`);
    lines.push("status: draft", "---", "", `Made with the section builder for the ${({ word: "Word", excel: "Excel", powerpoint: "PowerPoint" })[section.app]} course.`, "");
    for (const v of section.videos) {
      lines.push(v.replace ? `::: replace-video ${v.replace}` : `::: add-video after ${v.after}`,
        `url: ${one(v.url)}`, `title: ${one(v.title)}`, `captions: ${v.captions}`);
      if (v.duration) lines.push(`duration: ${one(v.duration)}`);
      if (v.note) lines.push(`note: ${one(v.note)}`);
      lines.push(":::", "");
    }
    return lines.join("\n");
  }

  /**
   * Inline Markdown as plain text, for places that can't show formatting
   * (the grader's feedback files and spreadsheets): **bold** and `code`
   * lose their marks, [[path: Home > Font]] and [[key: Ctrl+B]] keep their
   * words, and links keep their text.
   */
  function plainText(md) {
    return String(md || "")
      .replace(/\[\[(?:path|key):\s*([^\]]+)\]\]/g, "$1")
      .replace(/\[([^\]]+)\]\((?:[^)]+)\)/g, "$1")
      .replace(/\*\*([^*]+)\*\*/g, "$1").replace(/\*([^*]+)\*/g, "$1")
      .replace(/`([^`]+)`/g, "$1")
      .replace(/\s+/g, " ").trim();
  }

  /** Check one parsed "check:" against the catalog. */
  function validateCheck(c, where, add, set) {
    set = set || checkSet("word");
    const CATALOG = set.checks, SEL = set.selectors;
    const def = CATALOG[c.name];
    if (!c.name) return;
    if (!def) { add("error", c.line, `Unknown check "${c.name}". Known checks: ${Object.keys(CATALOG).join(", ")}.`); return; }
    if (def.notInSkillCheck && where === "skillcheck") add("error", c.line, `${c.name} can't be used in a skill check.`);
    const used = Object.keys(c.params);
    const sel = used.filter(k => SEL.includes(k));
    if (sel.length && !def.selector) add("error", c.line, `${c.name} doesn't take a selector (${sel.join(", ")}).`);
    if (sel.length > 1) add("error", c.line, `Use only one selector; found ${sel.join(" and ")}.`);
    if (def.needsSelector && !sel.length) add("error", c.line, `${c.name} needs ${SEL.join("= or ")}= to say which cells to check.`);
    if (SEL.includes("in") && c.params.in && !["body", "header", "footer", "document"].includes(c.params.in)) add("error", c.line, 'in= is body, header, footer or document.');
    for (const [key, type] of Object.entries(def.params)) {
      if (type.endsWith("!") && c.params[key] === undefined) add("error", c.line, `${c.name} needs ${key}=...`);
    }
    if (def.needsOneOf && !def.needsOneOf.some(k => c.params[k] !== undefined)) add("error", c.line, `${c.name} needs at least one of: ${def.needsOneOf.join(", ")}.`);
    for (const key of used) {
      if (SEL.includes(key)) continue;
      const type = def.params[key];
      if (!type) { add("error", c.line, `${c.name} has no parameter "${key}". It takes: ${Object.keys(def.params).concat(def.selector ? SEL : []).join(", ") || "no parameters"}.`); continue; }
      const v = c.params[key];
      const base = type.replace("!", "");
      const bad = (msg) => add("error", c.line, `${c.name} ${key}=${v}: ${msg}`);
      if (base === "int" && !/^\d+$/.test(v)) bad("expected a whole number.");
      if (base === "number" && isNaN(Number(v))) bad("expected a number.");
      if (base === "bool" && !["true", "false"].includes(v)) bad("expected true or false.");
      if (base === "length" && toPoints(v) === null) bad("expected a length with units, like 1in, 36pt or 2.54cm.");
      if (base === "color" && !/^#[0-9A-Fa-f]{6}$/.test(v)) bad("expected a color like #0046AD.");
      if (base === "lang" && !/^[a-z]{2}-[A-Z]{2}$/.test(v)) bad("expected a language tag like en-US.");
      if (base === "lineSpacing" && !(["single", "1.15", "1.5", "double"].includes(v) || toPoints(v) !== null)) bad("expected single, 1.15, 1.5, double or an exact value like 14pt.");
      if (base.startsWith("enum:") && !base.slice(5).split("|").includes(v)) bad(`expected one of ${base.slice(5).split("|").join(", ")}.`);
    }
  }

  /** Markdown-level checks: H1, raw HTML, images, links, inline syntax. */
  function validateMarkdown(b, add) {
    let inCode = false;
    (b.lines || []).forEach((l, k) => {
      const lineNo = b.line + k;
      if (/^```/.test(l.trim())) { inCode = !inCode; return; }
      if (inCode) return;
      if (/^#\s/.test(l)) add("error", lineNo, "Don't use a # heading; the title is the page's only H1. Start at ##.");
      if (/^#{4,}\s/.test(l)) add("warning", lineNo, "Headings deeper than ### are hard to scan in the narrow add-in panel.");
      checkInline(l, lineNo, add);
    });
  }

  function checkInline(text, lineNo, add) {
    const t = String(text || "");
    const noCode = t.replace(/`[^`]*`/g, "");
    if (/<\/?[A-Za-z][^>]*>/.test(noCode)) add("error", lineNo, "Raw HTML isn't allowed. It will be shown as text.");
    let m;
    const img = /!\[([^\]]*)\]\(([^)\s]+)\)(\{decorative\})?/g;
    while ((m = img.exec(t))) {
      if (!m[1].trim() && !m[3]) add("error", lineNo, "This image needs alt text, or {decorative} if it carries no information.");
      if (/^https?:/i.test(m[2])) add("warning", lineNo, "External images load from another site; prefer a file in images/.");
      else if (m[2].includes("..") || /^[a-z]+:/i.test(m[2])) add("error", lineNo, "Image paths must be relative, like images/indent.png.");
    }
    const link = /(?<!!)\[([^\]]+)\]\(([^)\s]+)\)/g;
    while ((m = link.exec(t))) {
      const href = m[2];
      if (!/^https:\/\//i.test(href) && !/^[\w\-./]+\.md(#[\w-]+)?$/.test(href)) add("error", lineNo, `Link "${href}" must start with https:// or point to a lesson .md file.`);
    }
    const ext = /\[\[([a-z]+)\s*:([^\]]*)\]\]/g;
    while ((m = ext.exec(t))) {
      if (!["key", "path"].includes(m[1])) add("error", lineNo, `Unknown inline tag [[${m[1]}: ...]]. Use [[key: ...]] or [[path: ...]].`);
    }
  }

  /**
   * The host of an https link, or null. The host must be followed by "/", "?", "#" or the end,
   * so a link with a user name or a port (https://www.youtube.com:x@evil.example/) is refused
   * instead of being mistaken for YouTube.
   */
  function hostOf(url) { const m = /^https:\/\/([a-z0-9.-]+)(?=[/?#]|$)/i.exec(String(url || "")); return m ? m[1].toLowerCase() : null; }
  function checkUrl(url, lineNo, add, hosts) {
    const host = hostOf(url.split("#")[0]);
    if (!host) add("error", lineNo, "Video links must be full https:// addresses.");
    else if (!hosts.includes(host) && host !== "youtu.be") add("error", lineNo, `Video host "${host}" is not approved.`);
  }

  // -------------------------------------------------------------------------
  // 3. RENDER (safe HTML string for previews)
  // -------------------------------------------------------------------------

  /** Inline Markdown on ONE line of text. Escapes first, then adds our own tags. */
  function inline(text) {
    // Pull out code spans first so nothing inside them is formatted.
    const codes = [];
    let s = String(text).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
    s = esc(s);
    // [[key: Ctrl+S / Cmd+S]] -> <kbd> groups
    s = s.replace(/\[\[key:\s*([^\]]+?)\s*\]\]/g, (_, keys) => keys.split(" / ").map((combo, n, all) =>

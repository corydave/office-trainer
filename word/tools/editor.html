  async function refreshFolderCounts() {
    for (const f of state.files) {
      const text = await (await f.handle.getFile()).text();
      const issues = TM.validate(TM.parse(text), { videoHosts: state.config.videoHosts, starterExists: (p) => state.starters.has(p) });
      f.errors = issues.filter(i => i.level === "error").length;
      f.warnings = issues.length - f.errors;
    }
    drawFileList();
  }
  function updateFileCounts(issues) {
    const f = state.files.find(x => state.fileHandle && x.handle && x.path.endsWith("/" + state.fileName));
    if (!f) return;
    f.errors = issues.filter(i => i.level === "error").length; f.warnings = issues.length - f.errors;
    drawFileList();
  }

  function drawFileList() {
    const nav = $("files");
    nav.replaceChildren();
    const groups = {};
    state.files.forEach(f => { const g = f.path.split("/").slice(1, -1).join("/") || "content"; (groups[g] = groups[g] || []).push(f); });
    Object.entries(groups).forEach(([g, list]) => {
      const h = document.createElement("h2"); h.textContent = g; nav.append(h);
      const ul = document.createElement("ul");
      list.forEach(f => {
        const li = document.createElement("li");
        const b = document.createElement("button"); b.type = "button";
        b.dataset.path = f.path;
        const name = document.createElement("span"); name.textContent = f.path.split("/").pop();
        const count = document.createElement("span");
        count.className = "count" + (f.errors ? " err" : "");
        count.textContent = f.errors ? `${f.errors} err` : (f.warnings ? `${f.warnings} warn` : "ok");
        count.setAttribute("aria-label", `${f.errors || 0} errors, ${f.warnings || 0} warnings`);
        b.append(name, count);
        b.addEventListener("click", () => { if (state.dirty && !confirmDiscard()) return; openFromFolder(f); });
        li.append(b); ul.append(li);
      });
      nav.append(ul);
    });
    markCurrentFile();
  }
  async function openFromFolder(f) {
    const file = await f.handle.getFile();
    state.currentPath = f.path;
    loadText(await file.text(), file.name, f.handle);
  }
  function markCurrentFile() {
    document.querySelectorAll("#files button").forEach(b => b.setAttribute("aria-current", String(b.dataset.path === state.currentPath && !!state.fileHandle)));
  }

  // =====================================================================
  // Preview controls and quiz interactions
  // =====================================================================
  ["pv-platform", "pv-checks"].forEach(id => $(id).addEventListener("change", refresh));
  $("pv-width").addEventListener("change", () => {
    document.documentElement.style.setProperty("--pane-width", $("pv-width").value + "px");
    store.set("pane-width", $("pv-width").value);
  });

  // Quick checks in the preview behave the way they will in the add-in
  $("preview").addEventListener("click", (e) => {
    const btn = e.target.closest(".tm-quiz-check");
    if (!btn) return;
    const box = btn.closest(".tm-quiz");
    const fb = box.querySelector(".tm-feedback");
    let right;
    if (box.dataset.type === "number") {
      const input = box.querySelector("input");
      right = input.value.trim() !== "" && Number(input.value) === Number(input.dataset.answer);
    } else {
      const inputs = [...box.querySelectorAll("input")];
      right = inputs.length > 0 && inputs.every(i => i.checked === (i.dataset.correct === "true")) && inputs.some(i => i.checked);
    }
    fb.textContent = right ? "Correct." : "Not quite. Try again or read the explanation.";
    fb.className = "tm-feedback " + (right ? "right" : "wrong");
    const ex = box.querySelector(".tm-explain"); if (ex) ex.hidden = false;
  });

  // =====================================================================
  // Settings: fonts and video hosts
  // =====================================================================
  function fillFontSelect(sel, value) {
    sel.replaceChildren();
    Object.keys(TM.FONT_STACKS).forEach(name => {
      const o = document.createElement("option"); o.value = name; o.textContent = name;
      o.style.fontFamily = TM.FONT_STACKS[name];
      if (name === value) o.selected = true;
      sel.append(o);
    });
  }
  function applyFonts() {
    const r = document.documentElement.style;
    r.setProperty("--tm-heading", TM.fontStack(state.fonts.heading, TM.DEFAULT_FONTS.heading));
    r.setProperty("--tm-body", TM.fontStack(state.fonts.body, TM.DEFAULT_FONTS.body));
  }
  $("btn-settings").addEventListener("click", () => {
    fillFontSelect($("set-heading"), state.fonts.heading);
    fillFontSelect($("set-body"), state.fonts.body);
    $("set-hosts").value = state.config.videoHosts.join(", ");
    $("settings").showModal();
  });
  $("set-heading").addEventListener("change", e => { state.fonts.heading = e.target.value; store.set("font-heading", e.target.value); applyFonts(); });
  $("set-body").addEventListener("change", e => { state.fonts.body = e.target.value; store.set("font-body", e.target.value); applyFonts(); });
  $("set-hosts").addEventListener("change", e => {
    state.config.videoHosts = e.target.value.split(",").map(s => s.trim().toLowerCase()).filter(s => /^[a-z0-9.-]+$/.test(s));
    refresh();
  });
  $("set-reset").addEventListener("click", () => {
    state.fonts.heading = state.config.headingFont; state.fonts.body = state.config.bodyFont;
    store.set("font-heading", ""); store.set("font-body", "");
    fillFontSelect($("set-heading"), state.fonts.heading); fillFontSelect($("set-body"), state.fonts.body); applyFonts();
  });
  $("set-done").addEventListener("click", () => $("settings").close());

  // Theme: system -> light -> dark
  const THEMES = ["system", "light", "dark"];
  function applyTheme(t) {
    if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
    $("btn-theme").textContent = "Theme: " + t; store.set("theme", t);
  }
  $("btn-theme").addEventListener("click", () => applyTheme(THEMES[(THEMES.indexOf(store.get("theme") || "system") + 1) % 3]));

  // Toast messages (announced to screen readers)
  let toastEl = null;
  function toast(msg) {
    if (toastEl) toastEl.remove();
    toastEl = document.createElement("div"); toastEl.className = "toast"; toastEl.setAttribute("role", "status"); toastEl.textContent = msg;
    document.body.append(toastEl); const el = toastEl; setTimeout(() => el.remove(), 3500);
  }

  // =====================================================================
  // Start-up
  // =====================================================================
  if (!("showDirectoryPicker" in window)) $("btn-folder").title = "Opening a folder needs Chrome or Edge";
  const savedTheme = store.get("theme"); if (savedTheme) applyTheme(savedTheme);
  if (store.get("font-heading")) state.fonts.heading = store.get("font-heading");
  if (store.get("font-body")) state.fonts.body = store.get("font-body");
  applyFonts();
  const w = store.get("pane-width"); if (w) { $("pv-width").value = w; document.documentElement.style.setProperty("--pane-width", w + "px"); }
  const draft = store.get("draft");
  loadText(draft || TEMPLATES.lesson, store.get("draft-name") || "untitled.md", null);
  if (draft) setDirty(true);
})();
</script>
</body>
</html>

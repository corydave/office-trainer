<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__APP__ Course Certificate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Fonts are hosted with the course (assets/fonts, SIL Open Font License), so opening
     this page sends nothing to a font service. -->
<style>
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-style: normal; font-display: swap; src: url("../assets/fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-style: normal; font-display: swap; src: url("../assets/fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-style: italic; font-display: swap; src: url("../assets/fonts/atkinson-hyperlegible-latin-400-italic.woff2") format("woff2"); }
@font-face { font-family: "Comfortaa"; font-weight: 500 600; font-style: normal; font-display: swap; src: url("../assets/fonts/comfortaa-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Comfortaa"; font-weight: 700; font-style: normal; font-display: swap; src: url("../assets/fonts/comfortaa-latin-700-normal.woff2") format("woff2"); }
</style>
<style>
/* =====================================================================
   CERTIFICATE - front (a traditional certificate) and back (the record:
   every badge earned and the outcomes it covers). Each side is one
   landscape Letter page, so printing two-sided gives a real certificate.
   Sizes inside a sheet use cqi units, so the sheet scales on screen and
   prints at full size.
   ===================================================================== */
:root {
  --bg: #eef1f6; --surface: #ffffff; --ink: #111a2e; --muted: #424a57; --line: #d3dae8; --focus: #0046ad;
  --paper: #fffdf8; --paper-ink: #14213d; --paper-muted: #3f4757; --rule: #0046ad; --gold: #8a6a1c;
  --font-body: "Atkinson Hyperlegible", Arial, Arimo, sans-serif;
  --font-display: "Comfortaa", "Atkinson Hyperlegible", Arial, sans-serif;
  --font-serif: Georgia, Gelasio, "Times New Roman", Tinos, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0c1220; --surface: #131b2c; --ink: #e9eef8; --muted: #b4bfd3; --line: #2b3852; --focus: #9cbcff; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0c1220; --surface: #131b2c; --ink: #e9eef8; --muted: #b4bfd3; --line: #2b3852; --focus: #9cbcff; color-scheme: dark; }
/* The paper itself stays light in both themes: it is a printed object. */
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.45; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- controls (never printed) ---------- */
.controls { padding-block: 20px 12px; display: flex; flex-direction: column; gap: 12px; }
.controls h1 { font-family: var(--font-display); font-size: 1.5rem; margin: 0; }
.controls p { margin: 0; color: var(--muted); max-width: 70ch; }
.row { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 700; color: var(--muted); }
label.f input, label.f select { font: inherit; font-weight: 400; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.btn { font: inherit; font-size: 0.9rem; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--focus); }
.hint { font-size: 0.85rem; color: var(--muted); }
/* A real record (from the trainer) hides the sample controls; a sample hides the print button. */
body.real .sample-only, body:not(.real) .real-only { display: none !important; }

/* ---------- the sheets ---------- */
.sheets { display: flex; flex-direction: column; gap: 24px; padding-block: 8px 48px; }
.side-label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 6px; }
.sheet { container-type: inline-size; width: 100%; aspect-ratio: 11 / 8.5; background: var(--paper); color: var(--paper-ink); box-shadow: 0 2px 14px rgb(0 0 0 / .14); position: relative; overflow: hidden; }
.frame { position: absolute; inset: 2.6cqi; border: 0.45cqi solid var(--rule); }
.frame::after { content: ""; position: absolute; inset: 0.7cqi; border: 0.15cqi solid var(--rule); }

/* front */
.front .content { position: absolute; inset: 6cqi 8cqi; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1.2cqi; }
.front .issuer { font-family: var(--font-display); font-size: 1.9cqi; letter-spacing: .14em; text-transform: uppercase; color: var(--paper-muted); }
.front .kind { font-family: var(--font-serif); font-size: 5.4cqi; line-height: 1.1; margin-top: 1cqi; }
.front .sm { font-family: var(--font-serif); font-size: 2cqi; color: var(--paper-muted); font-style: italic; }
.front .name { font-family: var(--font-serif); font-size: 4.6cqi; border-bottom: 0.15cqi solid var(--paper-ink); padding: 0 4cqi 0.5cqi; min-width: 50%; }
.front .what { font-family: var(--font-display); font-size: 2.7cqi; font-weight: 700; max-width: 80%; }
.front .course { font-size: 1.9cqi; color: var(--paper-muted); }
.front .bottom { margin-top: auto; width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 3cqi; font-size: 1.5cqi; }
.front .sig { border-top: 0.12cqi solid var(--paper-ink); padding-top: 0.6cqi; color: var(--paper-muted); }
.front .seal svg { width: 11cqi; height: 11cqi; display: block; }
.front .stamp { position: absolute; bottom: 15cqi; right: 8cqi; transform: rotate(8deg); border: 0.3cqi solid var(--gold); color: var(--gold); font-weight: 700; font-size: 1.35cqi; padding: 0.5cqi 1.2cqi; letter-spacing: .08em; text-transform: uppercase; border-radius: 0.6cqi; }

/* back */
.back .content { position: absolute; inset: 5.2cqi 6cqi; display: flex; flex-direction: column; gap: 1.4cqi; font-size: 1.45cqi; }
.back h2 { font-family: var(--font-display); font-size: 2.5cqi; margin: 0; }
.back h3 { font-family: var(--font-display); font-size: 1.7cqi; margin: 0.6cqi 0 0; }
.back .meta { color: var(--paper-muted); }
.badges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1cqi 1.6cqi; }
.badge { display: grid; grid-template-columns: 5.4cqi minmax(0, 1fr); gap: 0.8cqi; align-items: center; }
.badge svg { width: 5.4cqi; height: 5.4cqi; display: block; }
.badge b { display: block; font-size: 1.45cqi; line-height: 1.2; }
.badge span { display: block; font-size: 1.15cqi; color: var(--paper-muted); }
.badge span.mono { font-size: 1cqi; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4cqi; min-height: 0; }
.cols ul { margin: 0.4cqi 0 0; padding-left: 1.2em; }
.cols li { margin-bottom: 0.2cqi; }
/* The course certificate packs more onto the back */
.weeklist { display: grid; gap: 0.7cqi; }
.weekline { display: grid; grid-template-columns: 3.6cqi minmax(0, 1fr); gap: 1cqi; align-items: center; }
.weekline svg { width: 3.6cqi; height: 3.6cqi; display: block; }
.weekline p { margin: 0; font-size: 1.2cqi; line-height: 1.35; }
.cols.compact { font-size: 1.2cqi; }
.cols.compact li { margin-bottom: 0; }
.skill-ids { margin: 0.4cqi 0 0; line-height: 1.4; }
.fine { margin-top: auto; font-size: 1.15cqi; color: var(--paper-muted); border-top: 0.1cqi solid var(--line); padding-top: 0.8cqi; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; }

@media (max-width: 640px) { .badges { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media print {
  @page { size: letter landscape; margin: 0; }
  body { background: #fff; }
  .controls, .side-label { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .sheets { gap: 0; padding: 0; }
  .sheet { width: 11in; height: 8.5in; aspect-ratio: auto; box-shadow: none; break-after: page; }
}
</style>
</head>
<body>
<div class="wrap">
  <section class="controls" aria-labelledby="ctl-title">
    <h1 id="ctl-title">Certificate preview</h1>
    <p id="intro">This is what a learner receives at the end of a lesson. The trainer fills in the real record; without one, this page shows a sample built from the lesson files. To keep one, print two-sided in landscape, or choose Save as PDF in your browser's print dialog.</p>
    <div class="row">
      <button class="btn real-only" type="button" id="print">Print or save as PDF</button>
      <label class="f sample-only" for="lesson">Lesson<select id="lesson"></select></label>
      <label class="f" for="learner">Name on the certificate<input id="learner" type="text" value="Jordan Rivera" autocomplete="off" maxlength="60"></label>
      <label class="f sample-only" for="mode">Taken<select id="mode"><option value="practice">On my own (practice)</option><option value="section">In a class section</option></select></label>
      <button class="btn sample-only" type="button" id="renew">New certificate number</button>
      <label class="btn" for="load">Open a record (.json)<input id="load" type="file" accept="application/json,.json" class="vh"></label>
    </div>
    <p class="hint" id="status" role="status" aria-live="polite"></p>
  </section>
  <div class="sheets">
    <div><p class="side-label">Front</p><article class="sheet front" id="front" aria-label="Certificate, front"></article></div>
    <div><p class="side-label">Back</p><article class="sheet back" id="back" aria-label="Certificate, back: record of learning"></article></div>
  </div>
</div>

<script>
/*__TRAINER_MD__*/
</script>
<script type="application/json" id="course-data">__DATA_JSON__</script>
<script>
/* =========================================================================
   Certificate logic:
   1. Build (or load) a RECORD: who, which lesson, which badges, which
      outcomes, and unique numbers for the certificate and each badge.
   2. Draw the front and back from that record.
   The record format is in spec/badges-and-certificates.md; the trainer
   will produce the same shape when a learner finishes a lesson.
   ========================================================================= */
(function () {
  "use strict";
  const TM = window.TrainerMD;
  const DATA = JSON.parse(document.getElementById("course-data").textContent);
  const $ = (id) => document.getElementById(id);
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) n.setAttribute(k, String(v));
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return n;
  }
  /** Badge art from TrainerMD (it escapes every value it draws). */
  function art(o) { const s = el("span"); s.innerHTML = TM.badgeSVG(o); return s.firstChild; }

  // Lessons that exist and award a certificate
  const lessons = [];
  DATA.weeks.forEach((w) => w.stations.forEach((s) => { if (s.certificate && (s.activities.length || s.kind === "course")) lessons.push(Object.assign({}, s, { weekN: w.n, weekTitle: w.title })); }));
  $("lesson").replaceChildren(...lessons.map((l, i) => el("option", { value: String(i) }, `Week ${l.weekN}: ${l.title}`)));
  $("lesson").value = String(Math.min(1, lessons.length - 1));
  const outcomeText = Object.fromEntries(DATA.outcomes.map((o) => [o.id, o.text]));
  // "W1-L2" becomes "W1L2" in the certificate number; the course certificate uses "WORD"
  const code = (l) => l.kind === "course" || !l.docId ? "WORD" : l.docId.replace(/[^A-Za-z0-9]/g, "");

  /** A sample record for one lesson, shaped like the ones the trainer will issue. */
  function sampleRecord(l, name, mode) {
    const now = new Date();
    // The course certificate collects every badge in the course: lessons, skill checks and projects
    const acts = l.kind === "course" ? DATA.weeks.flatMap((w) => w.stations.flatMap((x) => x.activities)) : l.activities;
    return {
      format: "office-trainer-certificate/1",
      id: TM.makeId("OT-" + code(l), now),
      issuedAt: now.toISOString().slice(0, 10),
      issuer: DATA.course.issuer,
      mode,
      learner: { name },
      section: mode === "section" ? { name: "Sample section", instructor: "Instructor name" } : null,
      achievement: { kind: l.kind === "course" ? "course" : "lesson", id: l.sid, title: l.title, week: l.kind === "course" ? null : l.weekN },
      badges: acts.map((a) => ({ id: TM.makeId("OTB-" + a.id.replace(/\W/g, ""), now), activity: a.id, name: a.badge.name, kind: a.badge.kind, week: a.badge.week, assessedBy: a.assess, earnedAt: now.toISOString().slice(0, 10) })),
      outcomes: l.clos,
      mos: l.mos,
    };
  }

  let record = null;
  function rebuild() { record = sampleRecord(lessons[Number($("lesson").value)], $("learner").value.trim() || "Learner name", $("mode").value); draw(); }

  function draw() {
    const r = record, practice = r.mode !== "section";
    const date = new Date(r.issuedAt + "T12:00:00").toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    const what = r.achievement.kind === "course" ? DATA.app.fullName + ": the complete five-week course" : `Week ${r.achievement.week} · ${r.achievement.title}`;

    // ---- front ----
    $("front").replaceChildren(
      el("div", { class: "frame", "aria-hidden": "true" }),
      practice ? el("div", { class: "stamp" }, "Practice record") : null,
      el("div", { class: "content" },
        el("div", { class: "issuer" }, r.issuer),
        el("div", { class: "kind" }, practice ? "Certificate of Practice" : "Certificate of Completion"),
        el("div", { class: "sm" }, "This certifies that"),
        el("div", { class: "name" }, r.learner.name),
        el("div", { class: "sm" }, practice ? "practiced and completed" : "has successfully completed"),
        el("div", { class: "what" }, what),
        el("div", { class: "course" }, `${DATA.app.fullName} course · ${r.badges.length} badge${r.badges.length === 1 ? "" : "s"} earned` + (DATA.app.exam ? ` · mapped to Microsoft Office Specialist ${DATA.app.exam}` : "")),
        el("div", { class: "bottom" },
          el("div", { class: "sig" }, practice ? `Issued ${date}` : `${r.section.instructor}, Instructor`),
          el("div", { class: "seal" }, art({ week: r.achievement.week, kind: r.achievement.kind === "course" ? "course" : "lesson", label: "Seal", size: 100 })),
          el("div", { class: "sig" }, el("span", {}, "Certificate no. "), el("span", { class: "mono" }, r.id)))));

    // ---- back ----
    const compact = r.badges.length > 24; // the course certificate
    $("back").replaceChildren(
      el("div", { class: "frame", "aria-hidden": "true" }),
      el("div", { class: "content" },
        el("h2", {}, "Record of learning"),
        el("div", { class: "meta" }, `${r.learner.name} · ${what} · issued ${date} · `, el("span", { class: "mono" }, r.id)),
        el("h3", {}, `Badges earned (${r.badges.length})`),
        // A lesson has a few badges: draw each one. The whole course has too
        // many for one page, so list them by week instead (all of them fit).
        compact ? compactBadges(r) : el("div", { class: "badges" }, r.badges.map((b) => el("div", { class: "badge" },
          art({ week: b.week, kind: b.kind, code: b.activity, label: b.name + " badge", size: 60 }),
          el("div", {}, el("b", {}, b.name), el("span", { class: "mono" }, b.id), el("span", {}, b.assessedBy.map((k) => DATA.labels[k][r.mode === "section" ? "section" : "practice"]).join(", ")))))),
        el("div", { class: "cols" + (compact ? " compact" : "") },
          el("div", {}, el("h3", {}, "Course outcomes"), el("ul", {}, r.outcomes.map((c) => el("li", {}, `${c}: ${outcomeText[c] || ""}`)))),
          el("div", {}, el("h3", {}, "Microsoft Office Specialist (" + (DATA.app.exam || "MOS") + ") skills"),
            compact
              ? el("p", { class: "skill-ids" }, `All ${r.mos.length} skills practiced: ${r.mos.join(", ")}.`)
              : [el("ul", {}, r.mos.slice(0, 14).map((c) => el("li", {}, `${c} ${DATA.mosNames[c] || ""}`))),
                 r.mos.length > 14 ? el("div", { class: "meta" }, `…and ${r.mos.length - 14} more skills.`) : null])),
        el("div", { class: "fine" }, practice
          ? `Practice record. This certificate was created on the learner's own device and is not recorded or verified by ${r.issuer.split(",")[0]}. Each number is unique; its last character is a check digit that catches typing mistakes.`
          : `Issued for ${r.section.name}. Numbers are unique; the last character of each is a check digit.`)));
    $("status").textContent = `Certificate ${r.id}: ${TM.idLooksValid(r.id) ? "number format checks out" : "number format looks wrong"}.`;
  }

  /**
   * The course certificate's badge list: one line per week, with the
   * week's seal and every badge name. Badge numbers stay in the .json record.
   */
  function compactBadges(r) {
    const weeks = [...new Set(r.badges.map((b) => b.week))].sort((x, y) => x - y);
    return el("div", { class: "weeklist" }, weeks.map((w) => {
      const list = r.badges.filter((b) => b.week === w);
      return el("div", { class: "weekline" },
        art({ week: w, kind: "lesson", label: "Week " + w, size: 40 }),
        el("p", {}, el("b", {}, `Week ${w} (${list.length}): `), list.map((b) => b.name).join(" · ")));
    }));
  }

  /**
   * Show a real record: one the trainer opened this page with, or one the
   * learner saved as a .json file. Only the fields we draw are kept, as plain
   * strings, so nothing unexpected reaches the page.
   */
  function useRecord(r) {
    if (r.format !== "office-trainer-certificate/1" || !r.learner || !Array.isArray(r.badges)) throw new Error("not a certificate record");
    // keep only the fields we draw, as plain strings, so nothing unexpected reaches the page
    record = { format: r.format, id: String(r.id), issuedAt: String(r.issuedAt).slice(0, 10), issuer: String(r.issuer || DATA.course.issuer), mode: r.mode === "section" ? "section" : "practice",
      learner: { name: String(r.learner.name || "").slice(0, 60) }, section: r.section ? { name: String(r.section.name || ""), instructor: String(r.section.instructor || "") } : null,
      achievement: { kind: r.achievement && r.achievement.kind === "course" ? "course" : "lesson", id: String(r.achievement && r.achievement.id || ""), title: String(r.achievement && r.achievement.title || ""), week: Number(r.achievement && r.achievement.week) || null },
      badges: r.badges.slice(0, 200).map((b) => ({ id: String(b.id), activity: String(b.activity), name: String(b.name), kind: String(b.kind), week: Number(b.week) || null, assessedBy: (Array.isArray(b.assessedBy) ? b.assessedBy : []).filter((k) => DATA.labels[k]), earnedAt: String(b.earnedAt || "") })),
      outcomes: (r.outcomes || []).map(String), mos: (r.mos || []).map(String) };
    if (record.mode === "section" && !record.section) record.section = { name: "Class section", instructor: "Instructor" };
    document.body.classList.add("real");
    $("ctl-title").textContent = "Your certificate";
    $("intro").textContent = "Print it two-sided in landscape, or choose Save as PDF in the print dialog to keep a copy. This page doesn't send your certificate anywhere.";
    $("learner").value = record.learner.name;
    draw();
  }

  // Open a record someone saved (the trainer's "Save my record")
  $("load").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { useRecord(JSON.parse(await f.text())); }
    catch (err) { $("status").textContent = "That file isn't a certificate record. Choose a .json file saved from the trainer."; }
    e.target.value = "";
  });
  $("print").addEventListener("click", () => window.print());
  ["lesson", "mode"].forEach((id) => $(id).addEventListener("change", rebuild));
  $("learner").addEventListener("input", () => { record.learner.name = $("learner").value.trim() || "Learner name"; draw(); });
  $("renew").addEventListener("click", rebuild);
  rebuild();

  // The trainer opens this page as certificate.html#record=<the record, base64url-encoded>.
  // The part after # never leaves the browser (it isn't sent to the web server).
  const m = /^#record=([A-Za-z0-9_-]+)$/.exec(location.hash);
  if (m) {
    try {
      const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
      const bytes = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
      useRecord(JSON.parse(new TextDecoder().decode(bytes)));
    } catch (err) { $("status").textContent = "This certificate link is damaged. Open the trainer and choose View certificate again."; }
    // Take the record out of the address bar, so it isn't saved in browser history.
    try { history.replaceState(null, "", location.pathname + location.search); } catch (err) { /* not important */ }
  }
})();
</script>
</body>
</html>

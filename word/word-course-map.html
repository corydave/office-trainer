<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Course Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Five-week Microsoft Word course map for FLCC with MOS MO-110 crosswalk, outcome evidence and standards alignment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Comfortaa:wght@500;700&display=swap">
<style>
/* =====================================================================
   DESIGN TOKENS
   Layout concept: a Word-style ruler across the top doubles as the week
   navigator; below it, tabbed panels (overview, map, matrix, crosswalk,
   evidence, standards, sources). Every color lives here as a token so
   light and dark themes both work. Small text meets 7:1 contrast (AAA).
   ===================================================================== */
:root {
  --bg: #f5f7fb;          /* page background - a cool, blue-leaning neutral */
  --surface: #ffffff;     /* cards and tables */
  --surface-2: #eef2f9;   /* table headers, quiet fills */
  --ink: #111a2e;         /* main text */
  --muted: #424a57;       /* secondary text (7:1 on every surface) */
  --line: #d3dae8;        /* borders and rules */
  --blue: #0046ad;        /* FLCC / FLX primary - links, active states */
  --blue-soft: #e3ecfa;
  --green: #305305;       /* "assessed" and "covered" */
  --green-soft: #e8f0df;
  --orange: #8a2905;      /* flags (darkened brand orange so small text clears 7:1) */
  --orange-fill: #a23108; /* brand orange for borders and marks */
  --orange-soft: #f8e6df;
  --ruler: #fbfcfe;
  --tick: #8d99b0;
  --focus: #0046ad;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Comfortaa", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  --step--1: 0.875rem; --step-0: 1rem; --step-1: 1.2rem; --step-2: 1.5rem; --step-3: 2.1rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1220; --surface: #131b2c; --surface-2: #1a2438; --ink: #e9eef8; --muted: #b4bfd3;
    --line: #2b3852; --blue: #9cbcff; --blue-soft: #1b2c4f; --green: #a6d585; --green-soft: #1d2e1a;
    --orange: #ffab8a; --orange-fill: #ff8f63; --orange-soft: #3a2018; --ruler: #151e31; --tick: #5d6b86;
    --focus: #9cbcff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1220; --surface: #131b2c; --surface-2: #1a2438; --ink: #e9eef8; --muted: #b4bfd3;
  --line: #2b3852; --blue: #9cbcff; --blue-soft: #1b2c4f; --green: #a6d585; --green-soft: #1d2e1a;
  --orange: #ffab8a; --orange-fill: #ff8f63; --orange-soft: #3a2018; --ruler: #151e31; --tick: #5d6b86;
  --focus: #9cbcff; color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.55;
}
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-3); font-weight: 700; }
h2 { font-size: var(--step-2); font-weight: 700; }
h3 { font-size: var(--step-1); font-weight: 700; }
p { margin: 0; max-width: 70ch; }
a { color: var(--blue); }
code, .code { font-family: var(--font-mono); font-size: 0.9em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: -9999px; top: 0; }
.skip:focus { left: 16px; top: 8px; z-index: 50; background: var(--surface); padding: 8px 12px; }
.muted { color: var(--muted); }
.eyebrow { font-size: var(--step--1); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- masthead ---------- */
.masthead { padding-block: 28px 18px; }
.masthead .wrap { display: flex; flex-direction: column; gap: 14px; }
.masthead-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start; }
.lede { font-size: var(--step-1); color: var(--muted); max-width: 62ch; }
.theme-btn {
  font: inherit; font-size: var(--step--1); padding: 6px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-display); font-size: var(--step-2); font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--step--1); color: var(--muted); }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- ruler (week navigator) ---------- */
.ruler-band { padding-block: 6px 0; }
.ruler {
  position: relative; border: 1px solid var(--line); border-radius: 6px; background-color: var(--ruler);
  /* inch ticks: tall every 20%, small every 2.5% - like Word's horizontal ruler */
  background-image:
    repeating-linear-gradient(to right, var(--tick) 0 1px, transparent 1px 20%),
    repeating-linear-gradient(to right, var(--tick) 0 1px, transparent 1px 2.5%);
  background-size: 100% 12px, 100% 6px; background-repeat: no-repeat; background-position: 0 0, 0 0;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
}
.ruler button {
  font: inherit; text-align: left; background: transparent; border: 0; color: var(--ink); cursor: pointer;
  padding: 18px 10px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.ruler button .n { font-family: var(--font-mono); font-size: var(--step--1); color: var(--muted); }
.ruler button .t { font-weight: 700; font-size: var(--step--1); overflow-wrap: anywhere; }
.ruler button[aria-current="true"] { background: var(--blue-soft); }
.ruler button[aria-current="true"] .n { color: var(--blue); font-weight: 700; }
/* the little tab-stop marker under the active week */
.ruler button[aria-current="true"]::after {
  content: ""; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent;
  border-bottom: 8px solid var(--blue); margin-top: 4px;
}
@media (max-width: 560px) { .ruler button .t { display: none; } .ruler button { padding-inline: 6px; } }

/* ---------- tabs ---------- */
.tabs-band { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tablist { display: flex; gap: 4px; overflow-x: auto; padding-block: 10px 0; scrollbar-width: thin; }
.tab {
  font: inherit; font-weight: 700; font-size: var(--step--1); white-space: nowrap; cursor: pointer;
  padding: 9px 14px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0;
  background: transparent; color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--blue); border-color: var(--line); margin-bottom: -1px; }
main { padding-block: 24px 56px; }
[role="tabpanel"] { outline: none; }

/* ---------- generic pieces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.grid-weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.week-card { display: flex; flex-direction: column; gap: 10px; }
.week-card .num { font-family: var(--font-mono); color: var(--muted); font-size: var(--step--1); }
.week-card .proj { font-size: var(--step--1); }
.btn {
  font: inherit; font-size: var(--step--1); font-weight: 700; cursor: pointer; align-self: flex-start;
  padding: 7px 12px; border-radius: 8px; border: 1px solid var(--blue); background: transparent; color: var(--blue);
}
.btn:hover { background: var(--blue-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: var(--step--1); line-height: 1.3;
  padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
}
button.chip { font: inherit; font-size: var(--step--1); cursor: pointer; }
button.chip:hover { border-color: var(--blue); color: var(--blue); }
/* Standards chips that link out to the official framework pages */
a.chip { text-decoration: none; color: var(--blue); }
a.chip:hover { border-color: var(--blue); text-decoration: underline; }
a.chip .ext { font-size: 0.85em; }
.chip.code { font-family: var(--font-mono); }
.pill { display: inline-block; font-size: var(--step--1); font-weight: 700; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.pill.web { background: var(--blue-soft); color: var(--blue); }
.pill.desktop { background: var(--orange-soft); color: var(--orange); }
.pill.both { background: var(--surface-2); color: var(--muted); }
.pill.full { background: var(--green-soft); color: var(--green); }
.pill.partial { background: var(--blue-soft); color: var(--blue); }
.pill.none { background: var(--surface-2); color: var(--muted); }
.pill.flag { background: var(--orange-soft); color: var(--orange); }
.pill.info { background: var(--blue-soft); color: var(--blue); }

/* I / R / A marks: shape AND letter carry meaning, not color alone */
.mark {
  display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%;
  font-weight: 700; font-size: 0.8rem; border: 2px solid var(--blue); color: var(--blue); background: var(--surface);
}
.mark.R { background: linear-gradient(90deg, var(--blue-soft) 50%, var(--surface) 50%); }
.mark.A { background: var(--green); border-color: var(--green); color: var(--surface); }
.marks { display: inline-flex; gap: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: var(--step--1); color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- tables ---------- */
/* position: relative keeps hidden screen-reader labels inside the scroll box (no page-wide overflow) */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
thead th { background: var(--surface-2); font-weight: 700; position: sticky; top: 0; }
tbody tr:last-child > * { border-bottom: 0; }
td.center, th.center { text-align: center; }
td.num { font-family: var(--font-mono); white-space: nowrap; }
tr.group td { background: var(--surface-2); font-weight: 700; }
.matrix td.center { min-width: 64px; }
.matrix th[scope="row"] { font-weight: 400; min-width: 240px; }

/* ---------- week detail ---------- */
.week-select { display: flex; flex-wrap: wrap; gap: 8px; }
.week-select button {
  font: inherit; font-weight: 700; font-size: var(--step--1); cursor: pointer; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.week-select button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--surface); }
.week-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 20px; align-items: start; }
@media (max-width: 900px) { .week-layout { grid-template-columns: minmax(0, 1fr); } }
.objectives { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.objectives li { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 8px; }
.objectives .oid { font-family: var(--font-mono); font-weight: 700; color: var(--blue); }
.aside-block { display: flex; flex-direction: column; gap: 6px; }
.aside-block + .aside-block { border-top: 1px solid var(--line); padding-top: 12px; }
dl.why { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; }
dl.why dt { font-weight: 700; }
dl.why dd { margin: 0; }
/* Callout box: the accent is a thin, fully rounded "pill" bar drawn with ::before,
   instead of a square left border. It is the same 4px width as the old border. */
.callout { position: relative; background: var(--blue-soft); padding: 10px 14px 10px 24px; border-radius: 8px; }
.callout::before {
  content: ""; position: absolute; left: 9px; top: 10px; bottom: 10px;
  width: 4px; border-radius: 999px;   /* 999px = ends fully rounded at any height */
  background: var(--blue);
}
.callout.warn { background: var(--orange-soft); }
.callout.warn::before { background: var(--orange-fill); }

/* ---------- coverage bars (MOS domains) ---------- */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr) 6.5em; gap: 12px; align-items: center; font-size: var(--step--1); }
.bar { height: 14px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; display: flex; }
.bar .checked { background: var(--green); }
.bar .drilled { background: repeating-linear-gradient(45deg, var(--blue) 0 3px, var(--blue-soft) 3px 6px); }
.bar-row .val { font-variant-numeric: tabular-nums; text-align: right; }
@media (max-width: 640px) { .bar-row { grid-template-columns: minmax(0, 1fr) 5.5em; } .bar-row .bar { grid-column: 1 / -1; } }
.swatch { display: inline-block; width: 14px; height: 10px; border-radius: 3px; border: 1px solid var(--line); }
.swatch.checked { background: var(--green); }
.swatch.drilled { background: repeating-linear-gradient(45deg, var(--blue) 0 3px, var(--blue-soft) 3px 6px); }

/* grading bar */
.grade-bar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.grade-bar div { display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; color: var(--surface); min-width: 0; }
.g0 { background: var(--muted); } .g1 { background: var(--blue); } .g2 { background: var(--green); } .g3 { background: var(--orange-fill); } .g4 { background: var(--ink); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: var(--step--1); font-weight: 700; }
.filters input, .filters select {
  font: inherit; font-weight: 400; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); min-width: 0;
}
.filters input { width: min(280px, 100%); }
.filters select { max-width: 100%; }
/* on phones, wide tables keep readable columns and scroll sideways inside their box */
@media (max-width: 640px) { .table-wrap table { min-width: 600px; } }
.result-count { font-size: var(--step--1); color: var(--muted); }

/* evidence cards */
.evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
@media (max-width: 400px) { .evidence-grid { grid-template-columns: minmax(0, 1fr); } }
dl.ev { margin: 0; display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 6px 10px; font-size: var(--step--1); }
dl.ev dt { font-weight: 700; color: var(--muted); }
dl.ev dd { margin: 0; }
.subnav { display: flex; flex-wrap: wrap; gap: 8px; }
.subnav a { font-size: var(--step--1); font-weight: 700; }

footer { border-top: 1px solid var(--line); padding-block: 18px 32px; font-size: var(--step--1); color: var(--muted); }

@media (prefers-reduced-motion: no-preference) { .tab, .btn, .chip { transition: background-color .15s, color .15s; } }
/* Printing the local file (Ctrl/Cmd+P) shows every panel */
@media print {
  .tabs-band, .ruler-band, .theme-btn, .filters, .week-select { display: none !important; }
  [role="tabpanel"][hidden] { display: block !important; }
  .card, .table-wrap { break-inside: avoid; }
}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="wrap">
    <div class="masthead-top">
      <div class="stack">
        <span class="eyebrow" id="meta-line"></span>
        <h1 id="page-title"></h1>
        <p class="lede" id="lede"></p>
      </div>
      <!-- Theme toggle: cycles system -> light -> dark. Remembered per browser when storage is allowed. -->
      <button type="button" class="theme-btn" id="theme-btn" aria-live="polite">Theme: system</button>
    </div>
    <div class="stats" id="stats" aria-label="Coverage summary"></div>
  </div>
</header>

<nav class="ruler-band" aria-label="Weeks">
  <div class="wrap"><div class="ruler" id="ruler"></div></div>
</nav>

<div class="tabs-band">
  <div class="wrap">
    <div class="tablist" role="tablist" aria-label="Course map views" id="tablist"></div>
  </div>
</div>

<main id="main" tabindex="-1">
  <div class="wrap" id="panels"></div>
</main>

<footer>
  <div class="wrap" id="footer"></div>
</footer>

 as .docx and .pdf.", ["CLO1"]], ["W1.3", "Format characters and paragraphs: font, size, color, effects, alignment, line and paragraph spacing, indentation, Format Painter and Clear Formatting.", ["CLO1", "CLO2"]], ["W1.4", "Use Find and Replace, symbols and special characters, cut/copy/paste options, Undo and Editor (spelling and grammar) to produce error-free text.", ["CLO2"]], ["W1.5", "Set up pages (margins, orientation, paper size), set document properties and language, and use Print Preview and print settings.", ["CLO1"]], ["W1.6", "Show formatting marks to diagnose and fix spacing and layout problems.", ["CLO2"]]], "drills": [["D1.01", "Open the starter file and save it to your course folder as Lastname_W1_Letter.docx.", [], ["N1", "N3", "N4"], "web"], ["D1.02", "Add Print Preview and Save As to the Quick Access Toolbar, then name three parts of the window in the drill quiz.", [], ["E1.1", "N2"], "desktop"], ["D1.03", "Show formatting marks; remove the extra blank paragraphs and double spaces in the letter.", ["1.1.4", "2.1.1"], [], "web"], ["D1.04", "Use Find to count every mention of the deadline, then replace every Acme Outdoor Supply with Lakeshore Paddle Company.", ["1.1.1", "2.1.1"], [], "web"], ["D1.05", "Insert a copyright symbol in the footer and type cafe with an accented e.", ["2.1.2"], [], "web"], ["D1.06", "Set body text to 11 pt Aptos; bold the subject line and apply a text effect to the letterhead; copy the letterhead format to the memo heading with Format Painter.", ["2.2.1", "2.2.2"], ["N6"], "web"], ["D1.07", "Set single line spacing with 8 pt after; give the memo body a 0.5 in first-line indent; left-align the letter; clear formatting from the pasted paragraph.", ["2.2.3", "2.2.5"], ["N7"], "web"], ["D1.08", "Move the closing paragraph above the signature block with cut and paste (Keep Text Only); undo an accidental deletion.", [], ["E2.1", "N9", "N10"], "web"], ["D1.09", "Set 1 in margins, Letter size and portrait orientation; run Editor and fix every flagged issue.", ["1.2.1"], ["N5", "N11"], "web"], ["D1.10", "Fill in the Title, Author and Tags properties and set the proofing language to English (United States).", ["1.3.2"], ["E1.3"], "desktop"], ["D1.11", "Export the letter to PDF; set print to 2 copies of page 1 only and capture the print preview.", ["1.3.1", "1.3.3"], ["N12", "N13"], "both-check"], ["D1.12", "Switch to Web Layout and Read Mode and describe in one sentence what changes (Word for the web has no Web Layout; compare Reading view instead).", [], [], "desktop"]], "skillcheck": {"id": "SC1", "covers": ["1.1.1", "1.1.4", "1.2.1", "1.3.2", "2.1.1", "2.1.2", "2.2.1", "2.2.2", "2.2.3", "2.2.5"], "desc": "Timed, MOS-style: 10 tasks in a fresh starter file, auto-checked by the Office Trainer, 2 attempts. MO-110 1.3.1 is assessed through the Project 1 PDF instead, because a check cannot see files outside the document."}, "project": {"id": "P1", "title": "Business Correspondence Set", "desc": "A block-format business letter (for example, a request to a financial aid office or an informational-interview request to a local employer) and a one-page memo. Submit .docx and .pdf.", "criteria": [["P1-a", "Block-letter structure is complete and correct (date, inside address, salutation, body, closing, signature block); memo heading is correct.", ["CLO1"], 25], ["P1-b", "Formatting is done with Word tools, not workarounds (no spaces for indents, no extra returns for spacing).", ["CLO1", "CLO2"], 25], ["P1-c", "Text is error-free (Editor run, Find and Replace used where needed).", ["CLO2"], 25], ["P1-d", "Page setup, properties and language are set; PDF opens and matches the .docx.", ["CLO1"], 25]]}, "ai": "Optional: ask an AI tool to draft the letter's body. You make every formatting decision, check every fact, and add a one-line note on what you kept, changed or cut. There is no wrong way to try this.", "platform": "Everything this week works in Word for the web and desktop Word. Quick Access Toolbar customizing and the proofing-language setting are easier in desktop Word. Print dialogs vary by browser.", "nace": ["Communication", "Professionalism", "Technology"], "digcomp": ["Content creation", "Information search, evaluation and management"], "wcag": ["2.4.2", "3.1.1"], "life": "A formal letter and memo you can send with confidence.", "hours": "About 9 hours: 2 h lessons and videos, 3 h drills, 1 h skill check, 3 h project"}, {"id": "W2", "n": 2, "title": "Structure and the College Paper", "tagline": "Let styles do the work: long documents, citations and a reusable paper template.", "clos": {"CLO1": "R", "CLO2": "RA", "CLO6": "R"}, "topics": ["T3", "T6"], "why": {"college": "A correct APA or MLA template saves time in every writing-heavy course you take.", "work": "Reports, manuals and proposals depend on styles, navigation and automatic tables of contents.", "life": "Long documents (a family history, a club handbook) stay manageable when the structure is real."}, "objectives": [["W2.1", "Apply and modify built-in heading and body styles and switch style sets, so structure comes from styles rather than manual formatting.", ["CLO2"]], ["W2.2", "Navigate long documents with the Navigation pane, Go To, bookmarks and internal hyperlinks.", ["CLO2", "CLO6"]], ["W2.3", "Create and control bulleted, numbered and multilevel lists (custom bullets, number formats, levels, restart and continue, start value).", ["CLO1", "CLO2"]], ["W2.4", "Insert headers, footers and page numbers (including a different first page) and control layout with page and section breaks.", ["CLO1", "CLO2"]], ["W2.5", "Insert and modify footnotes and endnotes, and generate and customize an automatic table of contents.", ["CLO2"]], ["W2.6", "Manage citation sources and generate a reference list in APA 7th or MLA 9th style, and save the setup as a reusable template.", ["CLO2"]]], "drills": [["D2.01", "Apply Heading 1 and Heading 2 to the report's section titles.", ["2.2.4"], [], "web"], ["D2.02", "Modify the Normal and Heading 1 styles (font, spacing, keep with next) and apply a different style set.", ["1.2.2"], ["E2.3", "E2.2"], "desktop"], ["D2.03", "Use the Navigation pane to move the Methods section above Results by dragging its heading; use Go To to jump to page 4.", ["1.1.3"], [], "web"], ["D2.04", "Add a bookmark at the Methods heading and a hyperlink to it from the introduction.", ["1.1.2"], [], "web"], ["D2.05", "Turn the plain list into a numbered list; demote two items to level 2; change the bullet character in the second list.", ["3.3.1", "3.3.2", "3.3.4"], ["N8"], "web"], ["D2.06", "Define a custom number format (Step 1, Step 2); restart numbering in the third list and set it to start at 5.", ["3.3.3", "3.3.5", "3.3.6"], [], "desktop"], ["D2.07", "Insert a header with your last name and page number, using a different first page.", ["1.2.3"], [], "web"], ["D2.08", "Insert a Next Page section break and make only the appendix section landscape.", ["2.3.2", "2.3.3"], [], "desktop"], ["D2.09", "Insert two footnotes and change the number format to i, ii, iii.", ["4.1.1", "4.1.2"], [], "desktop"], ["D2.10", "Insert an automatic table of contents, add a new heading, then update the table and limit it to two levels.", ["4.2.1", "4.2.2"], [], "web"], ["D2.11", "Add three sources in the citation manager, insert in-text citations, and generate the references list in APA 7th.", [], ["E3.5"], "desktop"]], "skillcheck": {"id": "SC2", "covers": ["1.1.2", "1.1.3", "1.2.2", "1.2.3", "2.2.4", "2.3.2", "2.3.3", "3.3.1", "3.3.2", "3.3.4", "3.3.5", "4.1.1", "4.1.2", "4.2.1", "4.2.2"], "desc": "Timed, MOS-style: 10 tasks on a 6-page starter report, auto-checked, 2 attempts."}, "project": {"id": "P2", "title": "Research Paper Template and Paper", "desc": "Build a reusable APA 7th or MLA 9th template (.dotx) with modified styles, header and page numbers, then use it for a 3 to 5 page paper with at least three verified sources. Learners may reuse a paper from another course, which ties this skill to their real coursework.", "criteria": [["P2-a", "Headings use real heading styles; the Navigation pane shows the outline.", ["CLO2"], 20], ["P2-b", "Style-guide layout is correct (margins, spacing, header, page numbers, title page or heading).", ["CLO1"], 20], ["P2-c", "Citations and references are generated by Word and every source is real and checked.", ["CLO2"], 25], ["P2-d", "Lists, breaks and notes are used correctly.", ["CLO2"], 15], ["P2-e", "The .dotx template opens a new, correctly formatted document.", ["CLO2"], 20]]}, "ai": "Optional: AI tools sometimes invent sources that look real. If an AI tool suggests a source, find it in the library database before it goes into the citation manager. That habit protects your grade.", "platform": "Styles, the Navigation pane, footnotes and tables of contents work in Word for the web. Section breaks, custom number formats and the citation manager need desktop Word, per Microsoft's feature comparison.", "nace": ["Communication", "Critical Thinking", "Technology"], "digcomp": ["Information search, evaluation and management", "Content creation"], "wcag": ["1.3.1", "2.4.4", "2.4.6"], "life": "A paper template reused every semester, plus long-document skills for reports at work.", "hours": "About 9 hours: 2 h lessons, 3 h drills, 1 h skill check, 3 h project"}, {"id": "W3", "n": 3, "title": "Visual Communication", "tagline": "Graphics, tables, charts and desktop publishing that stay accessible.", "clos": {"CLO3": "IA", "CLO4": "IA", "CLO5": "IA", "CLO2": "R", "CLO1": "R"}, "topics": ["T4", "T5", "T6"], "why": {"college": "Lab reports, posters and club flyers mix text, tables and images.", "work": "Schedules, price lists, one-pagers and newsletters are everyday workplace documents.", "life": "Event flyers, small-business menus and community newsletters - and making them readable for everyone."}, "objectives": [["W3.1", "Insert and format pictures, shapes, icons, screenshots, 3D models and SmartArt, including picture styles, artistic effects and background removal.", ["CLO3"]], ["W3.2", "Position graphics with text wrapping and alignment, add text to shapes and text boxes, and write meaningful alternative text.", ["CLO3"]], ["W3.3", "Create tables from scratch and from text; merge and split cells, resize, sort, set cell margins, split tables and repeat header rows.", ["CLO4"]], ["W3.4", "Insert and format a chart, and add captions to figures and tables.", ["CLO3"]], ["W3.5", "Apply desktop publishing features: multiple columns, column breaks, themes and custom theme colors, page color, borders, watermark and drop caps.", ["CLO5"]]], "drills": [["D3.01", "Insert the provided photo, apply a picture style and remove its background.", ["5.1.2", "5.2.2", "5.2.3"], ["N14"], "desktop"], ["D3.02", "Apply an artistic effect to the second photo.", ["5.2.1"], [], "desktop"], ["D3.03", "Insert an icon and a shape; type a label in the shape; change its fill and outline.", ["5.1.1", "5.1.7", "5.3.2", "5.2.4"], ["N14"], "web"], ["D3.04", "Insert a four-step SmartArt process, enter the steps, and change its colors and style.", ["5.1.4", "5.3.3", "5.2.5"], [], "desktop"], ["D3.05", "Insert a text box pull quote; set Square wrapping and position it top right.", ["5.1.6", "5.3.1", "5.4.1", "5.4.2"], [], "web"], ["D3.06", "Insert a screen clipping of the course page and a 3D model; rotate the model.", ["5.1.5", "5.1.3", "5.2.6"], [], "desktop"], ["D3.07", "Write alt text for every image and mark the divider line as decorative.", ["5.4.3"], [], "web"], ["D3.08", "Convert the tab-separated schedule to a table; convert the old price table back to text.", ["3.1.1", "3.1.2"], [], "desktop"], ["D3.09", "Create a 4 x 6 table; merge the title row; resize columns; sort by date; set cell margins; repeat the header row; split the table after row 10.", ["3.1.3", "3.2.1", "3.2.2", "3.2.3", "3.2.4", "3.2.5", "3.2.6"], ["N14"], "desktop"], ["D3.10", "Insert a column chart from the survey data and add the caption Figure 1.", [], ["E3.4"], "desktop"], ["D3.11", "Put the newsletter body in two columns with a column break; use a Continuous section break so the masthead stays one column.", ["2.3.1", "2.3.2", "2.3.3"], [], "desktop"], ["D3.12", "Create custom theme colors for the club; add a page border, a DRAFT watermark and a drop cap.", ["1.2.4"], ["E3.2"], "desktop"]], "skillcheck": {"id": "SC3", "covers": ["1.2.4", "2.3.1", "3.1.1", "3.1.3", "3.2.1", "3.2.3", "3.2.6", "5.1.2", "5.1.4", "5.1.6", "5.2.2", "5.3.2", "5.4.1", "5.4.2", "5.4.3"], "desc": "Timed, MOS-style: 10 tasks on a starter flyer, auto-checked, 2 attempts."}, "project": {"id": "P3", "title": "Newsletter or Event Flyer", "desc": "A two-page newsletter or event flyer for a real campus club, small business or community group: masthead, two-column body, at least three graphics with alt text, a SmartArt graphic, a schedule table with a header row, a captioned chart and a consistent theme. It must pass the Accessibility Checker with zero errors.", "criteria": [["P3-a", "Graphics are inserted, formatted and positioned on purpose, not by accident.", ["CLO3"], 20], ["P3-b", "The table has a real header row that repeats, is sorted and formatted, and does not use merged cells in ways that confuse reading order.", ["CLO4"], 20], ["P3-c", "Columns, sections, theme and page elements create a clear visual hierarchy.", ["CLO5"], 25], ["P3-d", "Accessibility: meaningful alt text, sufficient contrast, logical reading order, Accessibility Checker clean.", ["CLO3", "CLO5"], 20], ["P3-e", "The chart supports the message and has a caption.", ["CLO3"], 15]]}, "ai": "Optional: AI image tools and automatic alt text are quick but not always right. If you use an AI image, say so, check the tool's terms, and rewrite any automatic alt text so it says what matters in context.", "platform": "Pictures, shapes, icons, text boxes, simple tables, columns, page color, alt text and the Accessibility Checker work in Word for the web. SmartArt, charts, 3D models, watermarks and WordArt need desktop Word, per Microsoft's feature comparison.", "nace": ["Communication", "Equity & Inclusion", "Technology"], "digcomp": ["Content creation"], "wcag": ["1.1.1", "1.3.1", "1.3.2", "1.4.1", "1.4.3"], "life": "A flyer or newsletter for any event or group, built so everyone can read it.", "hours": "About 9 hours: 2 h lessons, 3.5 h drills, 1 h skill check, 2.5 h project"}, {"id": "W4", "n": 4, "title": "The Job Application Packet", "tagline": "Templates, mail merge and web output, built around getting hired.", "clos": {"CLO7": "IA", "CLO6": "A", "CLO1": "RA", "CLO2": "R", "CLO4": "R", "CLO5": "R"}, "topics": ["T5", "T6", "T7"], "why": {"college": "Internship, scholarship and transfer applications need a resume and tailored letters.", "work": "Mail merge powers customer letters, certificates, name badges and mailing labels in every office.", "life": "Job searches, holiday card labels and organization mailings - done once, reused for years."}, "objectives": [["W4.1", "Customize a built-in or online template, save your own reusable template (.dotx) and store reusable content as a Quick Part.", ["CLO2"]], ["W4.2", "Build a resume in two versions: a designed version and a plain, applicant tracking system (ATS) friendly version.", ["CLO1", "CLO4", "CLO5"]], ["W4.3", "Create a recipient data source and run a mail merge for personalized form letters, with preview and an If...Then...Else rule.", ["CLO7"]], ["W4.4", "Use mail merge to produce envelopes, mailing labels and a directory.", ["CLO7"]], ["W4.5", "Save a document as a web page, preview it in Web Layout and a browser, and compare web page, PDF and share link as ways to publish online.", ["CLO6"]]], "drills": [["D4.01", "Open a resume template; replace every placeholder content control; save as Lastname_Resume.dotx.", [], ["E1.1", "E4.1"], "desktop"], ["D4.02", "In the ATS version, align dates at the right margin with a right tab stop and dot leader.", [], [], "desktop"], ["D4.03", "Save your name and contact line as a Quick Part and insert it into the cover letter.", [], ["E3.1"], "desktop"], ["D4.04", "Create a recipient list of five employers (Company, Contact, Title, Address, City, State, ZIP, Position).", [], ["E4.3"], "desktop"], ["D4.05", "Insert an Address Block, a Greeting Line and the Position field in the letter body.", [], ["E4.3"], "desktop"], ["D4.06", "Add an If...Then...Else rule that changes one sentence for remote jobs; preview every record and fix any blank lines.", [], ["E4.3", "E4.1"], "desktop"], ["D4.07", "Finish the merge to a new document with one letter per recipient.", [], ["E4.3"], "desktop"], ["D4.08", "Create envelopes and a sheet of Avery 5160 labels from the same list.", [], ["E4.3"], "desktop"], ["D4.09", "Create a directory merge that lists every employer and contact on one page.", [], ["E4.3"], "desktop"], ["D4.10", "Add a hyperlink to your portfolio or LinkedIn with descriptive link text; export the resume to PDF.", ["1.3.1"], ["N14"], "web"], ["D4.11", "Save the resume as Web Page, Filtered (.htm); view it in Web Layout and in a browser; note two things that changed.", ["1.3.1"], [], "desktop"]], "skillcheck": {"id": "SC4", "covers": ["1.3.1"], "desc": "Timed merge check: given a data source and letter, produce merged letters, labels and a directory. Mostly MO-111 (Expert) skills."}, "project": {"id": "P4", "title": "Job Application Packet", "desc": "A designed resume and an ATS-friendly resume (.docx and .pdf), cover letters merged to at least three employers (real postings or a fictional persona), envelopes or labels, a directory of contacts, and a web page version of the resume with a short reflection comparing web page, PDF and share link.", "criteria": [["P4-a", "Resume content and layout are professional; a personal template is saved and reused.", ["CLO1", "CLO2", "CLO5"], 20], ["P4-b", "The ATS version uses simple structure (no text boxes or layout tables; key details not hidden in headers).", ["CLO1", "CLO4"], 15], ["P4-c", "Mail merge is correct: data source, fields, rule, preview, no merge errors.", ["CLO7"], 25], ["P4-d", "Envelopes or labels and a directory are produced from the same data source.", ["CLO7"], 20], ["P4-e", "Web page version is created and previewed, and the reflection compares output formats.", ["CLO6"], 20]]}, "ai": "Optional: AI can tailor a cover letter to a job post quickly. Your judgment decides what is true about you - never claim a skill you do not have. Keep other people's personal data out of AI prompts.", "privacy": "Learners may use a fictional persona instead of their own details. Recipient lists hold personal data: store them in the course folder only and delete them when the project is graded.", "platform": "Mail merge, envelopes, labels, Quick Parts and Save as Web Page need desktop Word. Word for the web can export PDF and create share links.", "nace": ["Career & Self-Development", "Professionalism", "Technology"], "digcomp": ["Content creation", "Safety, wellbeing and responsible use"], "wcag": ["2.4.4"], "life": "A complete job application packet, plus mail merge for any mailing.", "hours": "About 9 hours: 2 h lessons, 3 h drills, 1 h skill check, 3 h project"}, {"id": "W5", "n": 5, "title": "Working Together and Shipping Clean", "tagline": "Review, collaborate, then share safely. Capstone and certification practice.", "clos": {"CLO8": "IA", "CLO1": "RA", "CLO2": "RA", "CLO3": "A", "CLO4": "A", "CLO5": "A", "CLO6": "R", "CLO7": "R"}, "topics": ["T7"], "why": {"college": "Group projects and instructor feedback arrive as comments and tracked changes.", "work": "Contracts, policies and reports go through review cycles with several people editing at once.", "life": "Sharing a document safely - without hidden comments or personal data - protects you."}, "objectives": [["W5.1", "Add, reply to, resolve and delete comments, including @mentions in shared documents.", ["CLO8"]], ["W5.2", "Track changes, review them, accept or reject them, and lock tracking with a password.", ["CLO8"]], ["W5.3", "Compare two versions of a document and combine edits from multiple reviewers.", ["CLO8"]], ["W5.4", "Share documents with appropriate permissions, co-author in real time and restore an earlier version from version history.", ["CLO8"]], ["W5.5", "Inspect a document before sharing: remove hidden data and personal information, fix accessibility and compatibility issues, and restrict editing.", ["CLO1", "CLO8"]], ["W5.6", "Show exam readiness on a timed MO-110 style practice test and assemble a course portfolio.", ["CLO1", "CLO2", "CLO3", "CLO4", "CLO5", "CLO8"]]], "drills": [["D5.01", "Add three comments; reply to one, resolve one and delete one.", ["6.1.1", "6.1.2", "6.1.3", "6.1.4"], [], "web"], ["D5.02", "Turn on Track Changes, make four edits, then lock tracking with a password.", ["6.2.1", "6.2.4"], [], "desktop"], ["D5.03", "Review all tracked changes; accept the formatting changes and reject one deletion.", ["6.2.2", "6.2.3"], [], "web"], ["D5.04", "Compare the original and revised cover letter; combine two reviewers' copies into one.", [], ["E1.1"], "desktop"], ["D5.05", "Share a copy as view-only with an expiration date; co-edit with a partner; restore a previous version.", ["1.3.4"], ["E1.1"], "both-check"], ["D5.06", "Run Inspect Document and remove comments, personal information and hidden text; run Check Compatibility.", ["1.4.1", "1.4.3"], [], "desktop"], ["D5.07", "Run the Accessibility Checker and fix every error and warning.", ["1.4.2"], [], "web"], ["D5.08", "Restrict editing to comments only, protected with a password.", [], ["E1.2"], "desktop"]], "skillcheck": {"id": "SC5", "covers": ["1.3.4", "1.4.1", "1.4.2", "1.4.3", "6.1.1", "6.1.2", "6.1.3", "6.1.4", "6.2.1", "6.2.2", "6.2.3", "6.2.4"], "desc": "Timed, MOS-style: 8 tasks on a reviewed document, auto-checked, 2 attempts."}, "project": {"id": "P5", "title": "Peer Review Exchange and Clean-and-Ship", "desc": "Swap the cover letter or newsletter with a partner (or use the provided persona documents). Review with Track Changes and comments, respond to every comment, accept or reject each change, compare and combine two reviewers' copies, then run the clean-and-ship checklist: inspect, accessibility, compatibility, PDF export and a view-only share link. Finish with a short reflection memo.", "criteria": [["P5-a", "Feedback to the partner is specific and constructive, using comments and tracked edits.", ["CLO8"], 25], ["P5-b", "Every comment received gets a reply or resolution; every change is accepted or rejected on purpose.", ["CLO8"], 25], ["P5-c", "Compare and Combine are done correctly.", ["CLO8"], 20], ["P5-d", "Clean-and-ship checklist is complete: Document Inspector, Accessibility Checker, compatibility, permissions.", ["CLO8", "CLO1"], 30]]}, "capstone": {"id": "CAP", "title": "Capstone: Practice Exam and Portfolio", "desc": "A timed, 50-minute MO-110 style practice exam covering all six domains (Certiport practice tests if FLCC has access; otherwise the Office Trainer capstone set), plus a portfolio of the five projects with a short reflection on which skills you will use next and where.", "clos": ["CLO1", "CLO2", "CLO3", "CLO4", "CLO5", "CLO6", "CLO7", "CLO8"]}, "ai": "Optional: Copilot and similar tools can summarize comments or suggest edits. Weigh those suggestions the way you would a human reviewer's, and keep Track Changes on so the history stays honest.", "privacy": "Peer review shares real work. Learners choose which document to share and may use the persona documents instead. The Document Inspector step teaches what hidden data travels with a file.", "platform": "Comments, Track Changes review, sharing, version history and the Accessibility Checker work in Word for the web. Compare and Combine, Document Inspector and password-protected tracking and restrictions need desktop Word (the web shows restricted documents read-only).", "nace": ["Teamwork", "Communication", "Leadership", "Professionalism", "Technology"], "digcomp": ["Communication and collaboration", "Safety, wellbeing and responsible use"], "wcag": ["1.1.1", "1.3.1", "1.3.2", "1.4.3", "2.4.2", "3.1.1"], "life": "Safe sharing and feedback habits for any group document - plus a certification attempt if wanted.", "hours": "About 9 hours: 1.5 h lessons, 2 h drills, 1 h skill check, 2.5 h project, 2 h capstone"}], "grading": [["Practice drills (completion, unlimited tries)", 15], ["Weekly skill checks SC1-SC5 (4% each)", 20], ["Projects P1-P4 (10% each)", 40], ["Project P5 Peer Review Exchange", 10], ["Capstone practice exam and portfolio", 15]], "northstar": [["N1", "Open a new or existing document.", "W1", "D1.01"], ["N2", "Identify the parts of the Word window, including the Ribbon, Status Bar and Quick Access Toolbar.", "W1", "D1.02"], ["N3", "Save a document, being intentional about name and location.", "W1", "D1.01"], ["N4", "Identify file extensions that can be opened by Microsoft Word.", "W1", "D1.01"], ["N5", "Use Spelling and Grammar check.", "W1", "D1.09"], ["N6", "Format text: size, color and font type.", "W1", "D1.06"], ["N7", "Set text spacing and alignment.", "W1", "D1.07"], ["N8", "Apply bullets and automatic numbering.", "W2", "D2.05"], ["N9", "Undo the previous action.", "W1", "D1.08"], ["N10", "Cut, copy and paste.", "W1", "D1.08"], ["N11", "Modify page layout, including margins and orientation.", "W1", "D1.09"], ["N12", "Print.", "W1", "D1.11"], ["N13", "Close a document.", "W1", "D1.11"], ["N14", "Insert objects into a document, including images, shapes, hyperlinks, and tables.", "W3", "D3.01, D3.03, D3.09, D4.10"]], "nace": [["Career & Self-Development", ["W4", "W5"], "Resume, cover letters and a portfolio reflection on next steps."], ["Communication", ["W1", "W2", "W3", "W5"], "Letters, memos, papers, newsletters and written peer feedback."], ["Critical Thinking", ["W2", "W5"], "Checking sources (including AI-suggested ones) and deciding which review edits to accept."], ["Equity & Inclusion", ["W3", "W5"], "Accessible documents: alt text, contrast, reading order and the Accessibility Checker. NACE lists this competency as under review; some campuses now label it Access & Opportunity."], ["Leadership", ["W5"], "Giving constructive feedback and resolving a review cycle."], ["Professionalism", ["W1", "W4", "W5"], "Business conventions, error-free work and safe sharing habits."], ["Teamwork", ["W5"], "Co-authoring, comments, Track Changes and combining reviewers' work."], ["Technology", ["W1", "W2", "W3", "W4", "W5"], "Every week: choosing the right Word feature and using it responsibly."]], "digcomp": [["Information search, evaluation and management", ["W1", "W2"], "Saving and organizing files; finding and verifying sources for citations."], ["Communication and collaboration", ["W5"], "Sharing, co-authoring, comments and Track Changes."], ["Content creation", ["W1", "W2", "W3", "W4"], "Creating and formatting letters, papers, newsletters, resumes and web output."], ["Safety, wellbeing and responsible use", ["W4", "W5"], "Protecting personal data in merge lists and AI prompts; Document Inspector; permissions."], ["Problem identification and solving", ["W1", "W3", "W5"], "Using formatting marks, the Accessibility Checker and Compatibility Checker to find and fix problems."]], "wcag": [["1.1.1", "Non-text Content", "A", "Alt text on pictures, charts and SmartArt; decorative items marked decorative.", ["W3", "W5"]], ["1.3.1", "Info and Relationships", "A", "Real heading styles, real lists and table header rows instead of visual formatting only.", ["W2", "W3", "W5"]], ["1.3.2", "Meaningful Sequence", "A", "Reading order stays logical when graphics float or text runs in columns.", ["W3", "W5"]], ["1.4.1", "Use of Color", "A", "Color is never the only way information is shown.", ["W3"]], ["1.4.3", "Contrast (Minimum)", "AA", "Text contrast at least 4.5:1 (3:1 for large text) on flyers and newsletters.", ["W3", "W5"]], ["2.4.2", "Page Titled", "A", "The document Title property is set (it becomes the PDF title).", ["W1", "W5"]], ["2.4.4", "Link Purpose (In Context)", "A", "Hyperlinks use descriptive text, not raw URLs or 'click here'.", ["W2", "W4"]], ["2.4.6", "Headings and Labels", "AA", "Headings describe the content that follows.", ["W2"]], ["3.1.1", "Language of Page", "A", "Document proofing language is set correctly.", ["W1", "W5"]]], "platform": [["Mail merge", "No", "Yes", "W4"], ["Envelopes and labels", "No", "Yes", "W4"], ["Compare and combine revisions", "No", "Yes", "W5"], ["Citations and bibliography", "No", "Yes", "W2"], ["Section breaks", "No", "Yes", "W2, W3"], ["SmartArt, charts and 3D models", "No", "Yes", "W3"], ["Macros", "No", "Yes", "Not taught"], ["Watermark", "No (page color only)", "Yes", "W3"], ["WordArt", "No (shapes and text boxes only)", "Yes", "W3"], ["Restricted editing", "Read only", "Yes", "W5"], ["Track Changes", "Yes", "Yes", "W5"], ["Styles", "Yes", "Yes", "W2"], ["Table of contents", "Yes", "Yes", "W2"], ["Footnotes and endnotes", "Yes", "Yes", "W2"], ["Columns", "Yes", "Yes", "W3"], ["Templates", "Yes", "Yes", "W2, W4"], ["Export as PDF", "Yes", "Yes", "W1, W4, W5"], ["Accessibility Checker", "Yes", "Yes", "W3, W5"]], "conventions": [["APA 7th edition / MLA 9th edition", "Published style guide", "Current editions for student papers; confirm with the FLCC Library before each term.", ["W2"]], ["Block-format business letter", "Industry convention", "The most common US business letter layout: everything flush left, single spaced, a blank line between parts.", ["W1"]], ["ATS-friendly resume", "Industry convention", "Applicant tracking systems parse simple layouts most reliably; keep a plain version alongside the designed one.", ["W4"]], ["Avery 5160 labels", "Industry convention", "The most common US address label size, built into Word's label options.", ["W4"]], ["Bloom's revised taxonomy", "Assumption", "Course outcome verbs sit mostly at Apply; peer review reaches Evaluate.", ["All"]], ["Credit hour (about 45 hours per credit)", "Assumption", "The 9 hours per week figure assumes 1 credit over 5 weeks. Scale if the course carries more credit.", ["All"]], ["I / R / A curriculum mapping", "Common practice", "Introduced, Reinforced, Assessed - the standard way to show where an outcome is taught and measured.", ["All"]]], "decisions": [["Reword CLO 6", "flag", "\"Create and preview the document as a Web page\" reflects an older workflow. The plan meets it as written (Web Layout view plus Save as Web Page in Week 4), then spends most of the time on what people do now: PDF export and share links. Consider rewording to \"Publish documents for screen and web audiences (web page, PDF, share link).\""], ["Make CLO 2 measurable", "flag", "\"Demonstrate features offered by the application\" is hard to assess on its own. It is mapped to every week here. Consider rewording to \"Use Word's structure and productivity features (styles, navigation, references, templates) to produce documents efficiently.\""], ["Some course outcomes go beyond MO-110", "info", "Mail merge, templates, compare and combine, citations and restrict editing are MO-111 (Expert) skills. They stay because the course outcomes require them, and they are labeled as beyond-the-certification content."], ["Plan for desktop Word", "flag", "Weeks 2 to 5 include features that need desktop Word (mail merge, compare and combine, SmartArt, section breaks, citations). Chromebook users will need campus labs or a virtual desktop for those tasks. Each drill is tagged web or desktop so the Office Trainer can show the right path."], ["Accessibility is built in, not bolted on", "info", "The ADA Title II web rule (WCAG 2.1 AA) covers documents public colleges post. A DOJ interim final rule (April 20, 2026) moved compliance to April 26, 2027 for entities of 50,000 or more and April 26, 2028 for smaller ones. Confirm FLCC's date with the college's accessibility of ce deadline extension (2026) - Kwall", "https://www.kwallcompany.com/2026/06/04/ada-title-ii-website-compliance-deadline/"], ["ADA Title II 2026 update - Aberdeen", "https://aberdeen.io/blog/2026/04/07/ada-title-iis-2026-update-what-changed-and-what-didnt/"], ["Word features comparison: web vs desktop - Microsoft Support", "https://support.microsoft.com/en-us/Word/word-features-comparison-word-for-the-web-vs-desktop"]], "evidence": [{"id": "CLO1", "text": "Create, save, format and print documents", "bloom": "Apply", "I": ["W1"], "R": ["W2", "W3", "W4", "W5"], "A": ["W1", "W4", "W5"], "objectives": ["W1.2", "W1.3", "W1.5", "W2.3", "W2.4", "W4.2", "W5.5", "W5.6"], "criteria": ["P1-a", "P1-b", "P1-d", "P2-b", "P4-a", "P4-b", "P5-d"], "checks": ["SC1", "SC4", "SC5", "CAP"], "artifact": "Project 1 letter and memo (.docx and .pdf); Project 2 paper layout; Project 4 resumes; clean-and-ship checklist in Project 5."}, {"id": "CLO2", "text": "Demonstrate features offered by the application", "bloom": "Apply", "I": ["W1"], "R": ["W2", "W3", "W4", "W5"], "A": ["W1", "W2", "W5"], "objectives": ["W1.1", "W1.3", "W1.4", "W1.6", "W2.1", "W2.2", "W2.3", "W2.4", "W2.5", "W2.6", "W4.1", "W5.6"], "criteria": ["P1-b", "P1-c", "P2-a", "P2-c", "P2-d", "P2-e", "P4-a"], "checks": ["SC1", "SC2", "SC5", "CAP"], "artifact": "Skill checks SC1 to SC5 (feature use under time); Project 2 styles, citations and template; capstone practice exam."}, {"id": "CLO3", "text": "Insert and modify graphics", "bloom": "Apply", "I": ["W3"], "R": [], "A": ["W3", "W5"], "objectives": ["W3.1", "W3.2", "W3.4", "W5.6"], "criteria": ["P3-a", "P3-d", "P3-e"], "checks": ["SC3", "SC5", "CAP"], "artifact": "Project 3 graphics, chart and alt text; SC3; capstone domain 5."}, {"id": "CLO4", "text": "Create and format tables", "bloom": "Apply", "I": ["W3"], "R": ["W4"], "A": ["W3", "W5"], "objectives": ["W3.3", "W4.2", "W5.6"], "criteria": ["P3-b", "P4-b"], "checks": ["SC3", "SC5", "CAP"], "artifact": "Project 3 schedule ta

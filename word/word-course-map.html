<script>
/* =========================================================================
   Word Course Map - interactive view
   How this script works, in plain terms:
   1. Read the course data (JSON) that sits in the <script> tag above.
   2. Build each tab's content with small helper functions.
   3. Wire up keyboard-friendly tabs, the week ruler and the filters.
   Security note: every piece of text goes in with textContent (never
   innerHTML), so nothing in the data can inject code into the page.
   ========================================================================= */
(function () {
  "use strict";

  // ---- 1. Load the data ---------------------------------------------------
  const DATA = JSON.parse(document.getElementById("course-data").textContent);
  const WEEKS = DATA.weeks;

  // ---- 2. Tiny helpers -----------------------------------------------------

  /**
   * el("p", {class: "muted"}, "Hello") makes <p class="muted">Hello</p>.
   * attrs: plain attributes; "on" + event name (onclick) adds a listener.
   * children: strings (added as safe text) or elements, or arrays of those.
   */
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key.startsWith("on") && typeof value === "function") {
        node.addEventListener(key.slice(2), value);
      } else if (value === true) {
        node.setAttribute(key, "");
      } else {
        node.setAttribute(key, String(value));
      }
    }
    appendAll(node, children);
    return node;
  }
  function appendAll(node, children) {
    for (const child of children.flat(Infinity)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
  }

  // Look-ups we use a lot
  const weekById = Object.fromEntries(WEEKS.map(w => [w.id, w]));
  const cloById = Object.fromEntries(DATA.clos.map(c => [c.id, c]));
  const topicById = Object.fromEntries(DATA.topics.map(t => [t.id, t]));
  const LEVEL_NAMES = { I: "Introduced", R: "Reinforced", A: "Assessed" };
  const PLATFORM_LABEL = { "web": "Web + desktop", "desktop": "Desktop only", "both-check": "Self-check" };
  const PLATFORM_CLASS = { "web": "web", "desktop": "desktop", "both-check": "both" };
  const STATUS_LABEL = { full: "Covered", partial: "Partly covered", none: "Not covered" };
  const weekLabel = id => "Week " + id.slice(1);

  // The MOS crosswalk filter controls. Declared up here because the panels
  // are built (and these are filled in) before the code further down runs.
  let mosSearch, mosDomain, mosWeek, mosCount, mosBody;

  /** I/R/A marks for a level string such as "IA" */
  function marks(level) {
    if (!level) return el("span", { class: "visually-hidden" }, "not addressed");
    return el("span", { class: "marks" },
      level.split("").map(letter =>
        el("span", { class: "mark " + letter, title: LEVEL_NAMES[letter], "aria-label": LEVEL_NAMES[letter] }, letter)));
  }

  /** A table from header labels and row arrays. Cells can be text or elements. */
  function table(headers, rows, opts) {
    opts = opts || {};
    const thead = el("thead", {}, el("tr", {}, headers.map((h, i) =>
      el("th", { scope: "col", class: (opts.centerFrom !== undefined && i >= opts.centerFrom) ? "center" : null }, h))));
    const tbody = el("tbody", {}, rows.map(r => r));
    return el("div", { class: "table-wrap", role: "region", "aria-label": opts.label || "Table", tabindex: "0" },
      el("table", { class: opts.className || null }, opts.caption ? el("caption", { class: "visually-hidden" }, opts.caption) : null, thead, tbody));
  }
  function row(cells, opts) {
    opts = opts || {};
    return el("tr", { class: opts.className || null }, cells.map((c, i) => {
      if (i === 0 && opts.rowHeader) return el("th", { scope: "row" }, c);
      const cls = (opts.centerFrom !== undefined && i >= opts.centerFrom) ? "center" : (opts.numCols && opts.numCols.includes(i) ? "num" : null);
      return el("td", { class: cls }, c);
    }));
  }

  /** A clickable MO-110 code chip - jumps to the crosswalk filtered to that skill. */
  function mosChip(code) {
    return el("button", { type: "button", class: "chip code", title: "Show " + code + " in the MOS crosswalk",
      onclick: () => { showTab("mos"); setMosFilter(code); } }, code);
  }
  function textChip(text, cls) { return el("span", { class: "chip" + (cls ? " " + cls : "") }, text); }

  // Official pages for the standards chips. WCAG chips go to the W3C
  // "Understanding" page for that exact success criterion.
  const STANDARD_LINKS = {
    nace: "https://www.naceweb.org/career-readiness/competencies/career-readiness-defined",
    digcomp: "https://joint-research-centre.ec.europa.eu/digcomp/digcomp-framework_en",
    wcagBase: "https://www.w3.org/WAI/WCAG21/Understanding/",
    wcag: {
      "1.1.1": "non-text-content", "1.3.1": "info-and-relationships", "1.3.2": "meaningful-sequence",
      "1.4.1": "use-of-color", "1.4.3": "contrast-minimum", "2.4.2": "page-titled",
      "2.4.4": "link-purpose-in-context", "2.4.6": "headings-and-labels", "3.1.1": "language-of-page",
    },
  };

  /** A chip that is a real link, opening in a new tab (announced for screen readers). */
  function linkChip(text, href, cls) {
    if (!href) return textChip(text, cls);   // no known page: fall back to a plain chip
    return el("a", { class: "chip" + (cls ? " " + cls : ""), href, target: "_blank", rel: "noopener noreferrer" },
      text, el("span", { class: "ext", "aria-hidden": "true" }, "↗"),
      el("span", { class: "visually-hidden" }, " (opens in a new tab)"));
  }
  function section(title, ...content) {
    return el("section", { class: "stack" }, el("h2", {}, title), content);
  }

  // ---- 3. Masthead ---------------------------------------------------------
  const S = DATA.stats;
  document.getElementById("meta-line").textContent =
    `${DATA.course.college} · ${DATA.course.version} · ${DATA.course.date}`;
  document.getElementById("page-title").textContent = DATA.course.title;
  document.getElementById("lede").textContent =
    `Five themed weeks, each built around a real document learners keep. Mapped to ${DATA.course.cert}, with every official course outcome and topic carried through.`;
  appendAll(document.getElementById("stats"), [
    el("div", { class: "stat" }, el("b", {}, `${S.closAssessed}/${S.clos}`), el("span", {}, "course outcomes assessed")),
    el("div", { class: "stat" }, el("b", {}, `${S.topicsCovered}/${S.topics}`), el("span", {}, "outline topics covered")),
    el("div", { class: "stat" }, el("b", {}, `${S.subDrilled}/${S.sub}`), el("span", {}, "MO-110 sub-skills practiced")),
    el("div", { class: "stat" }, el("b", {}, `${S.drills}`), el("span", {}, `outcome-checked drills (${S.webDrills} work on the web)`)),
  ]);

  // ---- 4. Tabs -------------------------------------------------------------
  // Each tab has an id, a label and a function that builds its panel.
  const TABS = [
    { id: "overview", label: "Overview", build: buildOverview },
    { id: "map", label: "Course Map", build: buildMap },
    { id: "matrix", label: "Alignment Matrix", build: buildMatrix },
    { id: "mos", label: "MOS Crosswalk", build: buildMos },
    { id: "evidence", label: "Outcome Evidence", build: buildEvidence },
    { id: "standards", label: "Other Standards", build: buildStandards },
    { id: "sources", label: "Sources", build: buildSources },
  ];
  const tablist = document.getElementById("tablist");
  const panels = document.getElementById("panels");

  TABS.forEach(t => {
    const tab = el("button", { type: "button", role: "tab", class: "tab", id: "tab-" + t.id,
      "aria-controls": "panel-" + t.id, "aria-selected": "false", tabindex: "-1",
      onclick: () => showTab(t.id, true) }, t.label);
    tablist.append(tab);
    const panel = el("section", { role: "tabpanel", id: "panel-" + t.id, "aria-labelledby": "tab-" + t.id, tabindex: "0", hidden: true });
    panel.append(t.build());
    panels.append(panel);
  });

  // Keyboard support for the tab row (WAI-ARIA pattern): arrows, Home, End.
  tablist.addEventListener("keydown", e => {
    const tabs = [...tablist.querySelectorAll('[role="tab"]')];
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    let next = null;
    if (e.key === "ArrowRight") next = (i + 1) % tabs.length;
    if (e.key === "ArrowLeft") next = (i - 1 + tabs.length) % tabs.length;
    if (e.key === "Home") next = 0;
    if (e.key === "End") next = tabs.length - 1;
    if (next !== null) { e.preventDefault(); tabs[next].focus(); showTab(TABS[next].id, false); }
  });

  /** Show one tab panel. focusPanel moves focus into it (used for clicks). */
  function showTab(id, focusPanel) {
    TABS.forEach(t => {
      const on = t.id === id;
      const tab = document.getElementById("tab-" + t.id);
      tab.setAttribute("aria-selected", on ? "true" : "false");
      tab.tabIndex = on ? 0 : -1;
      document.getElementById("panel-" + t.id).hidden = !on;
    });
    safeSet("wcm-tab", id);
    if (id !== "map") setHash(id);
    if (focusPanel) document.getElementById("panel-" + id).focus({ preventScroll: true });
  }

  // ---- 5. Week ruler + week selection --------------------------------------
  const ruler = document.getElementById("ruler");
  WEEKS.forEach(w => {
    ruler.append(el("button", { type: "button", "data-week": w.id, "aria-current": "false",
      "aria-label": `Week ${w.n}: ${w.title}`, onclick: () => { selectWeek(w.id); showTab("map", true); } },
      el("span", { class: "n" }, `Week ${w.n}`), el("span", { class: "t" }, w.title)));
  });

  let currentWeek = "W1";
  function selectWeek(id) {
    currentWeek = id;
    document.querySelectorAll("#ruler button").forEach(b => b.setAttribute("aria-current", b.dataset.week === id ? "true" : "false"));
    document.querySelectorAll(".week-select button").forEach(b => b.setAttribute("aria-pressed", b.dataset.week === id ? "true" : "false"));
    const holder = document.getElementById("week-detail");
    holder.replaceChildren(buildWeekDetail(weekById[id]));
    setHash("week-" + id.slice(1));
  }

  // ======================================================================
  // PANEL BUILDERS
  // ======================================================================

  function buildOverview() {
    const cards = WEEKS.map(w => el("article", { class: "card week-card" },
      el("span", { class: "num" }, `Week ${w.n}`),
      el("h3", {}, w.title),
      el("p", { class: "muted" }, w.tagline),
      el("p", { class: "proj" }, el("b", {}, w.project.id + " "), w.project.title),
      el("div", { class: "chips", "aria-label": "Course outcomes this week" },
        Object.entries(w.clos).map(([c, lv]) => el("span", { class: "chip" }, c, marks(lv)))),
      el("button", { type: "button", class: "btn", onclick: () => { selectWeek(w.id); showTab("map", true); } }, `Open Week ${w.n}`)));

    const decisions = el("div", { class: "table-wrap", role: "region", "aria-label": "Decisions and flags", tabindex: "0" },
      el("table", {}, el("thead", {}, el("tr", {}, el("th", { scope: "col" }, "Type"), el("th", { scope: "col" }, "Decision"), el("th", { scope: "col" }, "Details"))),
        el("tbody", {}, DATA.decisions.map(([title, kind, text]) => el("tr", {},
          el("td", {}, el("span", { class: "pill " + kind }, kind === "flag" ? "Needs a decision" : "Note")),
          el("th", { scope: "row" }, title), el("td", {}, text))))));

    // Grading bar: widths match the percentages; labels repeat in the list below for screen readers.
    const g = DATA.grading;
    const gradeBar = el("div", { class: "grade-bar", "aria-hidden": "true" },
      g.map(([label, pct], i) => el("div", { class: "g" + i, style: `width:${pct}%`, title: `${label}: ${pct}%` }, pct + "%")));
    const gradeList = el("ul", { class: "legend", style: "list-style:none;padding:0;margin:0" },
      g.map(([label, pct], i) => el("li", {}, el("span", {}, el("span", { class: "swatch g" + i }), `${label} - ${pct}%`))));

    return el("div", { class: "stack-lg" },
      section("Course at a glance",
        el("div", { class: "legend" }, el("span", {}, marks("I"), "Introduced"), el("span", {}, marks("R"), "Reinforced"), el("span", {}, marks("A"), "Assessed")),
        el("div", { class: "grid-weeks" }, cards)),
      section("Decisions and flags",
        el("p", { class: "muted" }, "Items marked Needs a decision are open questions for the department. Notes explain choices already built into the plan."),
        decisions),
      section("Grading (suggested)", gradeBar, gradeList),
      section("Format", el("p", {}, DATA.course.format + ". Every week follows the same rhythm: short lessons, outcome-checked drills in the Office Trainer, a timed skill check, then a project that becomes something the learner keeps."))
    );
  }

  function buildMap() {
    const selector = el("div", { class: "week-select", role: "group", "aria-label": "Choose a week" },
      WEEKS.map(w => el("button", { type: "button", "data-week": w.id, "aria-pressed": "false", onclick: () => selectWeek(w.id) }, `Week ${w.n}`)));
    return el("div", { class: "stack-lg" }, selector, el("div", { id: "week-detail" }));
  }

  /** The full detail view for one week. */
  function buildWeekDetail(w) {
    const objectives = el("ol", { class: "objectives" }, w.objectives.map(([id, text, clos]) =>
      el("li", {}, el("span", { class: "oid" }, id), el("div", {}, text, " ", el("span", { class: "muted" }, "(" + clos.join(", ") + ")")))));

    const drillRows = w.drills.map(([id, task, mos, extra, where]) => row([
      id, task,
      mos.length ? el("div", { class: "chips" }, mos.map(mosChip)) : el("span", { class: "muted" }, "-"),
      extra.length ? el("div", { class: "chips" }, extra.map(x => textChip(x, "code"))) : el("span", { class: "muted" }, "-"),
      el("span", { class: "pill " + PLATFORM_CLASS[where] }, PLATFORM_LABEL[where]),
    ], { numCols: [0] }));

    const p = w.project;
    const rubricRows = p.criteria.map(([id, text, clos, pts]) => row([id, text, clos.join(", "), String(pts)], { numCols: [0, 3] }));
    rubricRows.push(row(["", el("b", {}, "Total"), "", el("b", {}, "100")], { numCols: [3] }));

    const main = el("div", { class: "stack-lg", style: "min-width:0" },
      el("div", { class: "stack" },
        el("span", { class: "eyebrow" }, `Week ${w.n} · ${w.hours}`),
        el("h2", {}, w.title),
        el("p", { class: "lede" }, w.tagline)),
      el("section", { class: "stack" }, el("h3", {}, "Module objectives"),
        el("p", { class: "muted" }, "By the end of the week, learners can:"), objectives),
      el("section", { class: "stack" }, el("h3", {}, "Practice drills (Office Trainer)"),
        el("p", { class: "muted" }, "Each drill states the outcome the trainer checks. Select a code to see it in the MOS crosswalk. E = MO-111 Expert, N = Northstar."),
        table(["ID", "Task (checked outcome)", "MO-110", "Other", "Platform"], drillRows, { label: `Week ${w.n} drills` })),
      el("section", { class: "stack" }, el("h3", {}, `Skill check ${w.skillcheck.id}`),
        el("p", {}, w.skillcheck.desc),
        el("div", { class: "chips", "aria-label": "MO-110 skills in this check" }, w.skillcheck.covers.map(mosChip))),
      el("section", { class: "stack" }, el("h3", {}, `Project ${p.id}: ${p.title}`), el("p", {}, p.desc),
        table(["Criterion", "Description", "CLOs", "Points"], rubricRows, { label: `${p.id} rubric` })),
      w.capstone ? el("section", { class: "stack" }, el("h3", {}, w.capstone.title), el("p", {}, w.capstone.desc),
        el("div", { class: "chips" }, w.capstone.clos.map(c => textChip(c)))) : null
    );

    const aside = el("aside", { class: "card stack", "aria-label": `Week ${w.n} context` },
      el("div", { class: "aside-block" }, el("h3", {}, "Why it matters"),
        el("dl", { class: "why" }, el("dt", {}, "College"), el("dd", {}, w.why.college),
          el("dt", {}, "Work"), el("dd", {}, w.why.work), el("dt", {}, "Life"), el("dd", {}, w.why.life))),
      el("div", { class: "aside-block" }, el("span", { class: "eyebrow" }, "Course outcomes"),
        el("ul", { style: "margin:0;padding:0;list-style:none", class: "stack" },
          Object.entries(w.clos).map(([c, lv]) => el("li", { style: "display:flex;gap:8px;align-items:flex-start" }, marks(lv),
            el("span", {}, el("b", {}, c + " "), cloById[c].text))))),
      el("div", { class: "aside-block" }, el("span", { class: "eyebrow" }, "Outline topics"),
        el("ul", { style: "margin:0;padding-left:1.1em" }, w.topics.map(t => el("li", {}, el("b", {}, t + " "), topicById[t].text)))),
      el("div", { class: "aside-block" }, el("span", { class: "eyebrow" }, "AI moment"), el("p", {}, w.ai)),
      w.privacy ? el("div", { class: "aside-block" }, el("span", { class: "eyebrow" }, "Privacy"), el("p", {}, w.privacy)) : null,
      el("div", { class: "aside-block" }, el("span", { class: "eyebrow" }, "Platform"), el("p", { class: "callout warn" }, w.platform)),
      el("div", { class: "aside-block" }, el("span", { class: "eyebrow" }, "Standards"),
        el("div", { class: "chips" }, w.nace.map(n => linkChip("NACE: " + n, STANDARD_LINKS.nace))),
        el("div", { class: "chips" }, w.digcomp.map(n => linkChip("DigComp: " + n, STANDARD_LINKS.digcomp))),
        el("div", { class: "chips" }, w.wcag.map(n => linkChip("WCAG " + n,
          STANDARD_LINKS.wcag[n] ? STANDARD_LINKS.wcagBase + STANDARD_LINKS.wcag[n] : null, "code")))),
      el("div", { class: "aside-block" }, el("span", { class: "eyebrow" }, "Learner takeaway"), el("p", {}, w.life))
    );
    return el("div", { class: "week-layout" }, main, aside);
  }

  function buildMatrix() {
    const cloRows = DATA.clos.map(c => row(
      [el("span", {}, el("b", {}, c.id + " "), c.text), ...WEEKS.map(w => marks(w.clos[c.id] || ""))],
      { rowHeader: true, centerFrom: 1 }));
    const topicRows = DATA.topics.map(t => row(
      [el("span", {}, el("b", {}, t.id + " "), t.text), ...WEEKS.map(w => t.weeks.includes(w.id)
        ? el("span", { "aria-label": "Covered", title: "Covered" }, "●") : el("span", { class: "visually-hidden" }, "not covered"))],
      { rowHeader: true, centerFrom: 1 }));
    const objRows = [];
    WEEKS.forEach(w => {
      objRows.push(row([`Week ${w.n}: ${w.title}`, ...DATA.clos.map(() => "")], { className: "group" }));
      w.objectives.forEach(([id, text, clos]) => objRows.push(row(
        [el("span", {}, el("b", {}, id + " "), text), ...DATA.clos.map(c => clos.includes(c.id)
          ? el("span", { "aria-label": "Aligned", title: "Aligned" }, "●") : el("span", { class: "visually-hidden" }, "not aligned"))],
        { rowHeader: true, centerFrom: 1 })));
    });
    const weekHeads = WEEKS.map(w => `Wk ${w.n}`);
    return el("div", { class: "stack-lg" },
      section("Course learning outcomes by week",
        el("div", { class: "legend" }, el("span", {}, marks("I"), "Introduced"), el("span", {}, marks("R"), "Reinforced"), el("span", {}, marks("A"), "Assessed")),
        table(["Course learning outcome (verbatim)", ...weekHeads], cloRows, { label: "CLO by week matrix", centerFrom: 1, className: "matrix" })),
      section("Topic outline by week",
        table(["Topic outline item (verbatim)", ...weekHeads], topicRows, { label: "Topic by week matrix", centerFrom: 1, className: "matrix" })),
      section("Module objectives to course outcomes",
        el("p", { class: "muted" }, "Every module objective supports at least one official outcome. A dot means aligned."),
        table(["Module objective", ...DATA.clos.map(c => c.id)], objRows, { label: "Objective to CLO matrix", centerFrom: 1, className: "matrix" }))
    );
  }

  // --- MOS crosswalk with filters ------------------------------------------
  function buildMos() {
    const skills = Object.values(DATA.skills);

    // Coverage bars, one per domain
    const bars = el("div", { class: "bars" }, DATA.mo110.map(d => {
      const list = skills.filter(s => s.domain === d.id);
      const checked = list.filter(s => s.checks.length).length;
      const total = list.length;
      return el("div", { class: "bar-row" },
        el("span", {}, el("b", {}, d.id + " "), d.name, el("span", { class: "muted" }, ` (${d.weight})`)),
        el("div", { class: "bar", role: "img", "aria-label": `${total} of ${total} practiced; ${checked} also in a weekly skill check` },
          el("div", { class: "checked", style: `width:${(checked / total) * 100}%` }),
          el("div", { class: "drilled", style: `width:${((total - checked) / total) * 100}%` })),
        el("span", { class: "val" }, `${checked}/${total} checked`));
    }));

    // Filters
    mosSearch = el("input", { type: "search", id: "mos-search", placeholder: "Code or words, e.g. 3.2 or alt text", oninput: renderMosRows });
    mosDomain = el("select", { id: "mos-domain", onchange: renderMosRows },
      el("option", { value: "" }, "All domains"), DATA.mo110.map(d => el("option", { value: d.id }, `${d.id}. ${d.name}`)));
    mosWeek = el("select", { id: "mos-week", onchange: renderMosRows },
      el("option", { value: "" }, "All weeks"), WEEKS.map(w => el("option", { value: w.id }, `Week ${w.n}`)));
    mosCount = el("p", { class: "result-count", "aria-live": "polite" });
    const clear = el("button", { type: "button", class: "btn", onclick: () => { mosSearch.value = ""; mosDomain.value = ""; mosWeek.value = ""; renderMosRows(); } }, "Clear filters");
    mosBody = el("tbody");
    const crosswalk = el("div", { class: "table-wrap", role: "region", "aria-label": "MO-110 crosswalk", tabindex: "0" },
      el("table", {}, el("thead", {}, el("tr", {}, ["Code", "Skill", "Week", "Drills", "Assessed in"].map(h => el("th", { scope: "col" }, h)))), mosBody));
    renderMosRows();

    // MO-111 table
    const m111 = DATA.mo111.map(m => row([
      "E" + m.id,
      el("span", {}, el("b", {}, m.name), el("br"), el("span", { class: "muted" }, m.skills)),
      el("span", { class: "pill " + m.status }, STATUS_LABEL[m.status]),
      m.weeks.length ? m.weeks.map(weekLabel).join(", ") : "-",
      m.how,
    ], { numCols: [0] }));

    return el("div", { class: "stack-lg" },
      section("MO-110 Word Associate (Microsoft 365 Apps)",
        el("p", {}, `All ${S.sub} sub-skills across ${S.objectives} objectives are practiced in at least one drill and appear on the capstone practice exam. ${S.subChecked} are also tested in a weekly skill check.`),
        el("div", { class: "legend" }, el("span", {}, el("span", { class: "swatch checked" }), "Practiced and in a weekly skill check"),
          el("span", {}, el("span", { class: "swatch drilled" }), "Practiced, assessed on the capstone")),
        bars,
        el("div", { class: "filters" },
          el("label", { for: "mos-search" }, "Search", mosSearch),
          el("label", { for: "mos-domain" }, "Domain", mosDomain),
          el("label", { for: "mos-week" }, "Week", mosWeek), clear),
        mosCount, crosswalk,
        el("p", { class: "muted" }, "Sub-skill wording follows Microsoft's MO-110 skills outline. Check the current study guide before publishing to learners.")),
      section("MO-111 Word Expert (stretch content)",
        el("p", {}, `The course does not prepare learners for MO-111, but the official outcomes pull in several Expert objectives: ${S.mo111Full} covered, ${S.mo111Partial} partly covered, ${S.mo111None} not covered.`),
        table(["Code", "Objective", "Status", "Weeks", "How"], m111, { label: "MO-111 crosswalk" }))
    );
  }

  /** Redraw the MO-110 rows using the current filter values. */
  function renderMosRows() {
    const q = mosSearch.value.trim().toLowerCase();
    const dom = mosDomain.value, wk = mosWeek.value;
    const rows = [];
    let shown = 0;
    DATA.mo110.forEach(d => {
      if (dom && d.id !== dom) return;
      d.objectives.forEach(o => {
        const matches = o.skills.map(([code]) => DATA.skills[code]).filter(s =>
          (!wk || s.weeks.includes(wk)) &&
          (!q || s.code.startsWith(q) || s.name.toLowerCase().includes(q) || o.name.toLowerCase().includes(q)));
        if (!matches.length) return;
        rows.push(row([o.id, `${o.name} (domain ${d.id}: ${d.name})`, "", "", ""], { className: "group" }));
        matches.forEach(s => {
          shown++;
          rows.push(row([
            s.code, s.name, s.weeks.map(weekLabel).join(", "),
            s.drills.join(", "),
            el("div", { class: "chips" }, s.checks.map(c => textChip(c, "code")), textChip("Capstone")),
          ], { numCols: [0] }));
        });
      });
    });
    if (!shown) rows.push(row(["", "No skills match these filters. Clear the filters to see all " + S.sub + ".", "", "", ""]));
    mosBody.replaceChildren(...rows);
    mosCount.textContent = `Showing ${shown} of ${S.sub} sub-skills`;
  }
  function setMosFilter(code) {
    mosSearch.value = code; mosDomain.value = ""; mosWeek.value = "";
    renderMosRows();
    mosSearch.focus();
  }

  function buildEvidence() {
    const cards = DATA.evidence.map(e => el("article", { class: "card stack" },
      el("span", { class: "eyebrow" }, e.id + " · Bloom: " + e.bloom),
      el("h3", {}, e.text),
      el("dl", { class: "ev" },
        el("dt", {}, "Introduced"), el("dd", {}, e.I.map(weekLabel).join(", ") || "-"),
        el("dt", {}, "Reinforced"), el("dd", {}, e.R.map(weekLabel).join(", ") || "-"),
        el("dt", {}, "Assessed"), el("dd", {}, e.A.map(weekLabel).join(", ")),
        el("dt", {}, "Objectives"), el("dd", {}, e.objectives.join(", ")),
        el("dt", {}, "Rubric criteria"), el("dd", {}, e.criteria.join(", ")),
        el("dt", {}, "Checks"), el("dd", {}, e.checks.join(", ")),
        el("dt", {}, "Evidence"), el("dd", {}, e.artifact))));
    const topicRows = DATA.topics.map(t => row([el("span", {}, el("b", {}, t.id + " "), t.text),
      t.weeks.map(weekLabel).join(", "), DATA.topicHow[t.id]], { rowHeader: true }));
    return el("div", { class: "stack-lg" },
      section("Evidence for each course learning outcome",
        el("p", { class: "muted" }, "Where each official outcome is taught, practiced and measured, and which learner artifact proves it."),
        el("div", { class: "evidence-grid" }, cards)),
      section("Topic outline evidence",
        table(["Topic (verbatim)", "Weeks", "How it is met"], topicRows, { label: "Topic evidence" })));
  }

  function buildStandards() {
    const nav = el("nav", { class: "subnav", "aria-label": "Standards on this tab" },
      [["std-northstar", "Northstar"], ["std-nace", "NACE"], ["std-digcomp", "DigComp 3.0"], ["std-wcag", "WCAG / ADA"], ["std-platform", "Web vs desktop"], ["std-conv", "Conventions and assumptions"]]
        .map(([id, label]) => el("a", { href: "#" + id, onclick: (e) => { e.preventDefault(); document.getElementById(id).scrollIntoView({ block: "start" }); document.getElementById(id).focus(); } }, label)));
    const sec = (id, title, intro, tbl) => el("section", { class: "stack", id, tabindex: "-1" }, el("h2", {}, title), intro ? el("p", { class: "muted" }, intro) : null, tbl);
    const wl = arr => arr.map(x => x === "All" ? "All" : weekLabel(x)).join(", ");
    return el("div", { class: "stack-lg" }, nav,
      sec("std-northstar", "Northstar Digital Literacy: Microsoft Word",
        "A free, widely used baseline. All 14 standards are met by Week 3, so Northstar works as a Day 1 diagnostic.",
        table(["Code", "Standard (verbatim)", "Week", "Drill"], DATA.northstar.map(n => row([n[0], n[1], weekLabel(n[2]), n[3]], { numCols: [0] })), { label: "Northstar" })),
      sec("std-nace", "NACE Career Readiness Competencies",
        "Employer-validated competencies from the National Association of Colleges and Employers.",
        table(["Competency", "Weeks", "Where it shows up"], DATA.nace.map(n => row([n[0], wl(n[1]), n[2]])), { label: "NACE" })),
      sec("std-digcomp", "DigComp 3.0 (European Digital Competence Framework)",
        "Released December 2025. Mapped at the level of its five competence areas.",
        table(["Competence area", "Weeks", "Where it shows up"], DATA.digcomp.map(n => row([n[0], wl(n[1]), n[2]])), { label: "DigComp" })),
      sec("std-wcag", "Accessibility: WCAG 2.1 AA (ADA Title II)",
        "Success criteria learners practice in Word. The DOJ moved Title II compliance to April 26, 2027 (entities of 50,000+) and April 26, 2028 (smaller); documents are covered.",
        table(["Criterion", "Name", "Level", "What learners do in Word", "Weeks"], DATA.wcag.map(n => row([n[0], n[1], n[2], n[3], wl(n[4])], { numCols: [0] })), { label: "WCAG" })),
      sec("std-platform", "Word for the web vs desktop Word",
        `From Microsoft's feature comparison table, which changes often. Drill split: ${S.webDrills} web, ${S.deskDrills} desktop only, ${S.bothDrills} self-check.`,
        table(["Feature", "Word for the web", "Desktop Word", "Used in"], DATA.platform.map(p => row([p[0],
          el("span", { class: "pill " + (p[1] === "Yes" ? "web" : "desktop") }, p[1]), p[2], p[3]])), { label: "Platform comparison" })),
      sec("std-conv", "Conventions and assumptions",
        "Labeled honestly: published guides, industry conventions and planning assumptions are not the same thing.",
        table(["Item", "Type", "Note", "Weeks"], DATA.conventions.map(c => row([c[0], el("span", { class: "pill " + (c[1] === "Assumption" ? "flag" : "info") }, c[1]), c[2], wl(c[3])])), { label: "Conventions" }))
    );
  }

  function buildSources() {
    return el("div", { class: "stack-lg" },
      section("Sources",
        el("ul", { class: "stack", style: "padding-left:1.1em;margin:0" }, DATA.sources.map(([t, u]) =>
          el("li", {}, el("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, t))))),
      section("About this page",
        el("p", {}, "This page and the Markdown course map (the master copy) are generated from the same data file, so they always agree. After changing the map, regenerate both together."),
        el("p", { class: "muted" }, "Built as a single file with plain JavaScript. No data leaves the page; the only thing stored is your last tab and theme choice, in this browser.")));
  }

  // ---- 6. Footer -----------------------------------------------------------
  appendAll(document.getElementById("footer"),
    [el("p", {}, `${DATA.course.title} · ${DATA.course.version} · ${DATA.course.author}`)]);

  // ---- 7. Theme toggle (system -> light -> dark) ---------------------------
  const themeBtn = document.getElementById("theme-btn");
  const THEMES = ["system", "light", "dark"];
  function applyTheme(t) {
    if (t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = "Theme: " + t;
    safeSet("wcm-theme", t);
  }
  themeBtn.addEventListener("click", () => {
    const now = document.documentElement.getAttribute("data-theme") || "system";
    applyTheme(THEMES[(THEMES.indexOf(now) + 1) % THEMES.length]);
  });

  // ---- 8. Storage and links (wrapped so they never break the page) ---------
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked - fine */ } }
  function setHash(h) { try { history.replaceState(null, "", "#" + h); } catch (e) { /* sandboxed - fine */ } }

  // ---- 9. Start-up: restore theme, then open the right tab/week -------------
  const savedTheme = safeGet("wcm-theme");
  if (savedTheme && THEMES.includes(savedTheme)) applyTheme(savedTheme);
  const hash = (location.hash || "").slice(1);   // read the link's #token before anything changes it
  selectWeek("W1");
  const weekMatch = /^week-([1-5])$/.exec(hash);
  if (weekMatch) { selectWeek("W" + weekMatch[1]); showTab("map"); }
  else if (TABS.some(t => t.id === hash)) showTab(hash);
  else showTab(TABS.some(t => t.id === safeGet("wcm-tab")) ? safeGet("wcm-tab") : "overview");
})();
</script>

</body>
</html>

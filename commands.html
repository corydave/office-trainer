<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Word's manifest format requires a "function file" for ribbon buttons that run
    code without opening a sidebar. Office Trainer's only button opens the sidebar,
    so this page is intentionally empty. It just loads office.js and does nothing.
  -->
  <title>Office Trainer commands</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <script>
    // Nothing to do yet - tell Office we're ready.
    Office.onReady(function () {});
  </script>
</body>
</html>

<title>PowerPoint Course Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Five-week Microsoft PowerPoint course map for FLCC with MOS MO-310 crosswalk, outcome evidence and standards alignment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Comfortaa:wght@500;700&display=swap">
<style>
/* =====================================================================
   DESIGN TOKENS
   Layout concept: a Word-style ruler across the top doubles as the week
   navigator; below it, tabbed panels (overview, map, matrix, crosswalk,
   evidence, standards, sources). Every color lives here as a token so
   light and dark themes both work. Small text meets 7:1 contrast (AAA).
   ===================================================================== */
:root {
  --bg: #f5f7fb;          /* page background - a cool, blue-leaning neutral */
  --surface: #ffffff;     /* cards and tables */
  --surface-2: #eef2f9;   /* table headers, quiet fills */
  --ink: #111a2e;         /* main text */
  --muted: #424a57;       /* secondary text (7:1 on every surface) */
  --line: #d3dae8;        /* borders and rules */
  --blue: #0046ad;        /* FLCC / FLX primary - links, active states */
  --blue-soft: #e3ecfa;
  --green: #305305;       /* "assessed" and "covered" */
  --green-soft: #e8f0df;
  --orange: #8a2905;      /* flags (darkened brand orange so small text clears 7:1) */
  --orange-fill: #a23108; /* brand orange for borders and marks */
  --orange-soft: #f8e6df;
  --ruler: #fbfcfe;
  --tick: #8d99b0;
  --focus: #0046ad;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Comfortaa", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  --step--1: 0.875rem; --step-0: 1rem; --step-1: 1.2rem; --step-2: 1.5rem; --step-3: 2.1rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1220; --surface: #131b2c; --surface-2: #1a2438; --ink: #e9eef8; --muted: #b4bfd3;
    --line: #2b3852; --blue: #9cbcff; --blue-soft: #1b2c4f; --green: #a6d585; --green-soft: #1d2e1a;
    --orange: #ffab8a; --orange-fill: #ff8f63; --orange-soft: #3a2018; --ruler: #151e31; --tick: #5d6b86;
    --focus: #9cbcff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1220; --surface: #131b2c; --surface-2: #1a2438; --ink: #e9eef8; --muted: #b4bfd3;
  --line: #2b3852; --blue: #9cbcff; --blue-soft: #1b2c4f; --green: #a6d585; --green-soft: #1d2e1a;
  --orange: #ffab8a; --orange-fill: #ff8f63; --orange-soft: #3a2018; --ruler: #151e31; --tick: #5d6b86;
  --focus: #9cbcff; color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.55;
}
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-3); font-weight: 700; }
h2 { font-size: var(--step-2); font-weight: 700; }
h3 { font-size: var(--step-1); font-weight: 700; }
p { margin: 0; max-width: 70ch; }
a { color: var(--blue); }
code, .code { font-family: var(--font-mono); font-size: 0.9em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: -9999px; top: 0; }
.skip:focus { left: 16px; top: 8px; z-index: 50; background: var(--surface); padding: 8px 12px; }
.muted { color: var(--muted); }
.eyebrow { font-size: var(--step--1); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- masthead ---------- */
.masthead { padding-block: 28px 18px; }
.masthead .wrap { display: flex; flex-direction: column; gap: 14px; }
.masthead-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start; }
.lede { font-size: var(--step-1); color: var(--muted); max-width: 62ch; }
.theme-btn {
  font: inherit; font-size: var(--step--1); padding: 6px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-display); font-size: var(--step-2); font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--step--1); color: var(--muted); }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- ruler (week navigator) ---------- */
.ruler-band { padding-block: 6px 0; }
.ruler {
  position: relative; border: 1px solid var(--line); border-radius: 6px; background-color: var(--ruler);
  /* inch ticks: tall every 20%, small every 2.5% - like Word's horizontal ruler */
  background-image:
    repeating-linear-gradient(to right, var(--tick) 0 1px, transparent 1px 20%),
    repeating-linear-gradient(to right, var(--tick) 0 1px, transparent 1px 2.5%);
  background-size: 100% 12px, 100% 6px; background-repeat: no-repeat; background-position: 0 0, 0 0;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
}
.ruler button {
  font: inherit; text-align: left; background: transparent; border: 0; color: var(--ink); cursor: pointer;
  padding: 18px 10px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.ruler button .n { font-family: var(--font-mono); font-size: var(--step--1); color: var(--muted); }
.ruler button .t { font-weight: 700; font-size: var(--step--1); overflow-wrap: anywhere; }
.ruler button[aria-current="true"] { background: var(--blue-soft); }
.ruler button[aria-current="true"] .n { color: var(--blue); font-weight: 700; }
/* the little tab-stop marker under the active week */
.ruler button[aria-current="true"]::after {
  content: ""; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent;
  border-bottom: 8px solid var(--blue); margin-top: 4px;
}
@media (max-width: 560px) { .ruler button .t { display: none; } .ruler button { padding-inline: 6px; } }

/* ---------- tabs ---------- */
.tabs-band { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tablist { display: flex; gap: 4px; overflow-x: auto; padding-block: 10px 0; scrollbar-width: thin; }
.tab {
  font: inherit; font-weight: 700; font-size: var(--step--1); white-space: nowrap; cursor: pointer;
  padding: 9px 14px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0;
  background: transparent; color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--blue); border-color: var(--line); margin-bottom: -1px; }
main { padding-block: 24px 56px; }
[role="tabpanel"] { outline: none; }

/* ---------- generic pieces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.grid-weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.week-card { display: flex; flex-direction: column; gap: 10px; }
.week-card .num { font-family: var(--font-mono); color: var(--muted); font-size: var(--step--1); }
.week-card .proj { font-size: var(--step--1); }
.btn {
  font: inherit; font-size: var(--step--1); font-weight: 700; cursor: pointer; align-self: flex-start;
  padding: 7px 12px; border-radius: 8px; border: 1px solid var(--blue); background: transparent; color: var(--blue);
}
.btn:hover { background: var(--blue-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: var(--step--1); line-height: 1.3;
  padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
}
button.chip { font: inherit; font-size: var(--step--1); cursor: pointer; }
button.chip:hover { border-color: var(--blue); color: var(--blue); }
/* Standards chips that link out to the official framework pages */
a.chip { text-decoration: none; color: var(--blue); }
a.chip:hover { border-color: var(--blue); text-decoration: underline; }
a.chip .ext { font-size: 0.85em; }
.chip.code { font-family: var(--font-mono); }
.pill { display: inline-block; font-size: var(--step--1); font-weight: 700; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.pill.web { background: var(--blue-soft); color: var(--blue); }
.pill.desktop { background: var(--orange-soft); color: var(--orange); }
.pill.both { background: var(--surface-2); color: var(--muted); }
.pill.full { background: var(--green-soft); color: var(--green); }
.pill.partial { background: var(--blue-soft); color: var(--blue); }
.pill.none { background: var(--surface-2); color: var(--muted); }
.pill.flag { background: var(--orange-soft); color: var(--orange); }
.pill.info { background: var(--blue-soft); color: var(--blue); }

/* I / R / A marks: shape AND letter carry meaning, not color alone */
.mark {
  display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%;
  font-weight: 700; font-size: 0.8rem; border: 2px solid var(--blue); color: var(--blue); background: var(--surface);
}
.mark.R { background: linear-gradient(90deg, var(--blue-soft) 50%, var(--surface) 50%); }
.mark.A { background: var(--green); border-color: var(--green); color: var(--surface); }
.marks { display: inline-flex; gap: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: var(--step--1); color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- tables ---------- */
/* position: relative keeps hidden screen-reader labels inside the scroll box (no page-wide overflow) */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
thead th { background: var(--surface-2); font-weight: 700; position: sticky; top: 0; }
tbody tr:last-child > * { border-bottom: 0; }
td.center, th.center { text-align: center; }
td.num { font-family: var(--font-mono); white-space: nowrap; }
tr.group td { background: var(--surface-2); font-weight: 700; }
.matrix td.center { min-width: 64px; }
.matrix th[scope="row"] { font-weight: 400; min-width: 240px; }

/* ---------- week detail ---------- */
.week-select { display: flex; flex-wrap: wrap; gap: 8px; }
.week-select button {
  font: inherit; font-weight: 700; font-size: var(--step--1); cursor: pointer; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.week-select button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--surface); }
.week-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 20px; align-items: start; }
@media (max-width: 900px) { .week-layout { grid-template-columns: minmax(0, 1fr); } }
.objectives { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.objectives li { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 8px; }
.objectives .oid { font-family: var(--font-mono); font-weight: 700; color: var(--blue); }
.aside-block { display: flex; flex-direction: column; gap: 6px; }
.aside-block + .aside-block { border-top: 1px solid var(--line); padding-top: 12px; }
dl.why { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; }
dl.why dt { font-weight: 700; }
dl.why dd { margin: 0; }
/* Callout box: the accent is a thin, fully rounded "pill" bar drawn with ::before,
   instead of a square left border. It is the same 4px width as the old border. */
.callout { position: relative; background: var(--blue-soft); padding: 10px 14px 10px 24px; border-radius: 8px; }
.callout::before {
  content: ""; position: absolute; left: 9px; top: 10px; bottom: 10px;
  width: 4px; border-radius: 999px;   /* 999px = ends fully rounded at any height */
  background: var(--blue);
}
.callout.warn { background: var(--orange-soft); }
.callout.warn::before { background: var(--orange-fill); }

/* ---------- coverage bars (MOS domains) ---------- */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr) 6.5em; gap: 12px; align-items: center; font-size: var(--step--1); }
.bar { height: 14px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; display: flex; }
.bar .checked { background: var(--green); }
.bar .drilled { background: repeating-linear-gradient(45deg, var(--blue) 0 3px, var(--blue-soft) 3px 6px); }
.bar-row .val { font-variant-numeric: tabular-nums; text-align: right; }
@media (max-width: 640px) { .bar-row { grid-template-columns: minmax(0, 1fr) 5.5em; } .bar-row .bar { grid-column: 1 / -1; } }
.swatch { display: inline-block; width: 14px; height: 10px; border-radius: 3px; border: 1px solid var(--line); }
.swatch.checked { background: var(--green); }
.swatch.drilled { background: repeating-linear-gradient(45deg, var(--blue) 0 3px, var(--blue-soft) 3px 6px); }

/* grading bar */
.grade-bar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.grade-bar div { display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; color: var(--surface); min-width: 0; }
.g0 { background: var(--muted); } .g1 { background: var(--blue); } .g2 { background: var(--green); } .g3 { background: var(--orange-fill); } .g4 { background: var(--ink); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: var(--step--1); font-weight: 700; }
.filters input, .filters select {
  font: inherit; font-weight: 400; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); min-width: 0;
}
.filters input { width: min(280px, 100%); }
.filters select { max-width: 100%; }
/* on phones, wide tables keep readable columns and scroll sideways inside their box */
@media (max-width: 640px) { .table-wrap table { min-width: 600px; } }
.result-count { font-size: var(--step--1); color: var(--muted); }

/* evidence cards */
.evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
@media (max-width: 400px) { .evidence-grid { grid-template-columns: minmax(0, 1fr); } }
dl.ev { margin: 0; display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 6px 10px; font-size: var(--step--1); }
dl.ev dt { font-weight: 700; color: var(--muted); }
dl.ev dd { margin: 0; }
.subnav { display: flex; flex-wrap: wrap; gap: 8px; }
.subnav a { font-size: var(--step--1); font-weight: 700; }

footer { border-top: 1px solid var(--line); padding-block: 18px 32px; font-size: var(--step--1); color: var(--muted); }

@media (prefers-reduced-motion: no-preference) { .tab, .btn, .chip { transition: background-color .15s, color .15s; } }
/* Printing the local file (Ctrl/Cmd+P) shows every panel */
@media print {
  .tabs-band, .ruler-band, .theme-btn, .filters, .week-select { display: none !important; }
  [role="tabpanel"][hidden] { display: block !important; }
  .card, .table-wrap { break-inside: avoid; }
}
</style>

<!-- All course data, generated from the same source as the Markdown course map. -->
<script type="application/json" id="course-data">__DATA_JSON__</script>

<script>
/* =========================================================================
   PowerPoint Course Map - interactive view
   How this script works, in plain terms:
   1. Read the course data (JSON) that sits in the <script> tag above.
   2. Build each tab's content with small helper functions.
   3. Wire up keyboard-friendly tabs, the week ruler and the filters.
   Security note: every piece of text goes in with textContent (never
   innerHTML), so nothing in the data can inject code into the page.
   ========================================================================= */
(function () {
  "use strict";

  // ---- 1. Load the data ---------------------------------------------------
  const DATA = JSON.parse(document.getElementById("course-data").textContent);
  const WEEKS = DATA.weeks;

  // ---- 2. Tiny helpers -----------------------------------------------------

  /**
   * el("p", {class: "muted"}, "Hello") makes <p class="muted">Hello</p>.
   * attrs: plain attributes; "on" + event name (onclick) adds a listener.
   * children: strings (added as safe text) or elements, or arrays of those.
   */
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key.startsWith("on") && typeof value === "function") {
        node.addEventListener(key.slice(2), value);
      } else if (value === true) {
        node.setAttribute(key, "");
      } else {
        node.setAttribute(key, String(value));
      }
    }
    appendAll(node, children);
    return node;
  }
  function appendAll(node, children) {
    for (const child of children.flat(Infinity)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
  }

  // Look-ups we use a lot
  const weekById = Object.fromEntries(WEEKS.map(w => [w.id, w]));
  const cloById = Object.fromEntries(DATA.clos.map(c => [c.id, c]));
  const topicById = Object.fromEntries(DATA.topics.map(t => [t.id, t]));
  const LEVEL_NAMES = { I: "Introduced", R: "Reinforced", A: "Assessed" };
  const PLATFORM_LABEL = { "web": "Web + desktop", "desktop": "Desktop only", "both-check": "Self-check" };
  const PLATFORM_CLASS = { "web": "web", "desktop": "desktop", "both-check": "both" };
  const STATUS_LABEL = { full: "Covered", partial: "Partly covered", none: "Not covered" };
  const weekLabel = id => "Week " + id.slice(1);

  // The MOS crosswalk filter controls. Declared up here because the panels
  // are built (and these are filled in) before the code further down runs.
  let mosSearch, mosDomain, mosWeek, mosCount, mosBody;

  /** I/R/A marks for a level string such as "IA" */
  function marks(level) {
    if (!level) return el("span", { class: "visually-hidden" }, "not addressed");
    return el("span", { class: "marks" },
      level.split("").map(letter =>
        el("span", { class: "mark " + letter, title: LEVEL_NAMES[letter], "aria-label": LEVEL_NAMES[letter] }, letter)));
  }

  /** A table from header labels and row arrays. Cells can be text or elements. */
  function table(headers, rows, opts) {
    opts = opts || {};
    const thead = el("thead", {}, el("tr", {}, headers.map((h, i) =>
      el("th", { scope: "col", class: (opts.centerFrom !== undefined && i >= opts.centerFrom) ? "center" : null }, h))));
    const tbody = el("tbody", {}, rows.map(r => r));
    return el("div", { class: "table-wrap", role: "region", "aria-label": opts.label || "Table", tabindex: "0" },
      el("table", { class: opts.className || null }, opts.caption ? el("caption", { class: "visually-hidden" }, opts.caption) : null, thead, tbody));
  }
  function row(cells, opts) {
    opts = opts || {};
    return el("tr", { class: opts.className || null }, cells.map((c, i) => {
      if (i === 0 && opts.rowHeader) return el("th", { scope: "row" }, c);
      const cls = (opts.centerFrom !== undefined && i >= opts.centerFrom) ? "center" : (opts.numCols && opts.numCols.includes(i) ? "num" : null);
      return el("td", { class: cls }, c);
    }));
  }

  /** A clickable MO-310 code chip - jumps to the crosswalk filtered to that skill. */
  function mosChip(code) {
    return el("button", { type: "button", class: "chip code", title: "Show " + code + " in the MOS crosswalk",
      onclick: () => { showTab("mos"); setMosFilter(code); } }, code);
  }
  function textChip(text, cls) { return el("span", { class: "chip" + (cls ? " " + cls : "") }, text); }

  // Official pages for the standards chips. WCAG chips go to the W3C
  // "Understanding" page for that exact success criterion.
  const STANDARD_LINKS = {
    nace: "https://www.naceweb.org/career-readiness/competencies/career-readiness-defined",
    digcomp: "https://joint-research-centre.ec.europa.eu/digcomp/digcomp-framework_en",
    wcagBase: "https://www.w3.org/WAI/WCAG21/Understanding/",
    wcag: {

    DATA.mo110.forEach(d => {

          (!wk || s.weeks.includes(wk)) &&
          (!q || s.code.startsWith(q) || s.name.toLowerCase().includes(q) || o.name.toLowerCase().includes(q)));
        if (!matches.length) return;
        rows.push(row([o.id, `${o.name} (domain ${d.id}: ${d.name})`, "", "", ""], { className: "group" }));

          shown++;
          rows.push(row([

        "Released December 2025. Mapped at the level of its five competence areas.",
        table(["Competence area", "Weeks", "Where it shows up"], DATA.digcomp.map(n => row([n[0], wl(n[1]), n[2]])), { label: "DigComp" })),
      sec("std-wcag", "Accessibility: WCAG 2.1 AA (ADA Title II)",
        "Success criteria learners practice in PowerPoint. The DOJ moved Title II compliance to April 26, 2027 (entities of 50,000+) and April 26, 2028 (smaller); documents are covered.",
        table(["Criterion", "Name", "Level", "What learners do in PowerPoint", "Weeks"], DATA.wcag.map(n => row([n[0], n[1], n[2], n[3], wl(n[4])], { numCols: [0] })), { label: "WCAG" })),
      sec("std-platform", "PowerPoint for the web vs desktop PowerPoint",
        `From Microsoft's feature comparison table, which changes often. Drill split: ${S.webDrills} web, ${S.deskDrills} desktop only, ${S.bothDrills} self-check.`,
        table(["Feature", "PowerPoint for the web", "Desktop PowerPoint", "Used in"], DATA.platform.map(p => row([p[0],
          el("span", { class: "pill " + (p[1] === "Yes" ? "web" : "desktop") }, p[1]), p[2], p[3]])), { label: "Platform comparison" })),
      sec("std-conv", "Conventions and assumptions",
        "Labeled honestly: published guides, industry conventions and planning assumptions are not the same thing.",
        table(["Item", "Type", "Note", "Weeks"], DATA.conventions.map(c => row([c[0], el("span", { class: "pill " + (c[1] === "Assumption" ? "flag" : "info") }, c[1]), c[2], wl(c[3])])), { label: "Conventions" }))
    );
  }

  function buildSources() {
    return el("div", { class: "stack-lg" },
      section("Sources",
        el("ul", { class: "stack", style: "padding-left:1.1em;margin:0" }, DATA.sources.map(([t, u]) =>
          el("li", {}, el("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, t))))),
      section("About this page",
        el("p", {}, "This page and the Markdown course map (the master copy) are generated from the same data file, so they always agree. After changing the map, regenerate both together."),
        el("p", { class: "muted" }, "Built as a single file with plain JavaScript. No data leaves the page; the only thing stored is your last tab and theme choice, in this browser.")));
  }

  // ---- 6. Footer -----------------------------------------------------------
  appendAll(document.getElementById("footer"),
    [el("p", {}, `${DATA.course.title} · ${DATA.course.version} · ${DATA.course.author}`)]);

  // ---- 7. Theme toggle (system -> light -> dark) ---------------------------
  const themeBtn = document.getElementById("theme-btn");
  const THEMES = ["system", "light", "dark"];
  function applyTheme(t) {
    if (t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = "Theme: " + t;
    safeSet("wcm-theme", t);
  }
  themeBtn.addEventListener("click", () => {
    const now = document.documentElement.getAttribute("data-theme") || "system";
    applyTheme(THEMES[(THEMES.indexOf(now) + 1) % THEMES.length]);
  });

  // ---- 8. Storage and links (wrapped so they never break the page) ---------
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked - fine */ } }
  function setHash(h) { try { history.replaceState(null, "", "#" + h); } catch (e) { /* sandboxed - fine */ } }

  // ---- 9. Start-up: restore theme, then open the right tab/week -------------
  const savedTheme = safeGet("wcm-theme");
  if (savedTheme && THEMES.includes(savedTheme)) applyTheme(savedTheme);
  const hash = (location.hash || "").slice(1);   // read the link's #token before anything changes it
  selectWeek("W1");
  const weekMatch = /^week-([1-5])$/.exec(hash);
  if (weekMatch) { selectWeek("W" + weekMatch[1]); showTab("map"); }
  else if (TABS.some(t => t.id === hash)) showTab(hash);
  else showTab(TABS.some(t => t.id === safeGet("wcm-tab")) ? safeGet("wcm-tab") : "overview");
})();
</script>

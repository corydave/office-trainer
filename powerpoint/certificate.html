<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PowerPoint Course Certificate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Fonts are hosted with the course (assets/fonts, SIL Open Font License), so opening
     this page sends nothing to a font service. -->
<style>
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-style: normal; font-display: swap; src: url("../assets/fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-style: normal; font-display: swap; src: url("../assets/fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-style: italic; font-display: swap; src: url("../assets/fonts/atkinson-hyperlegible-latin-400-italic.woff2") format("woff2"); }
@font-face { font-family: "Comfortaa"; font-weight: 500 600; font-style: normal; font-display: swap; src: url("../assets/fonts/comfortaa-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Comfortaa"; font-weight: 700; font-style: normal; font-display: swap; src: url("../assets/fonts/comfortaa-latin-700-normal.woff2") format("woff2"); }
</style>
<style>
/* =====================================================================
   CERTIFICATE - front (a traditional certificate) and back (the record:
   every badge earned and the outcomes it covers). Each side is one
   landscape Letter page, so printing two-sided gives a real certificate.
   Sizes inside a sheet use cqi units, so the sheet scales on screen and
   prints at full size.
   ===================================================================== */
:root {
  --bg: #eef1f6; --surface: #ffffff; --ink: #111a2e; --muted: #424a57; --line: #d3dae8; --focus: #0046ad;
  --paper: #fffdf8; --paper-ink: #14213d; --paper-muted: #3f4757; --rule: #0046ad; --gold: #8a6a1c;
  --font-body: "Atkinson Hyperlegible", Arial, Arimo, sans-serif;
  --font-display: "Comfortaa", "Atkinson Hyperlegible", Arial, sans-serif;
  --font-serif: Georgia, Gelasio, "Times New Roman", Tinos, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0c1220; --surface: #131b2c; --ink: #e9eef8; --muted: #b4bfd3; --line: #2b3852; --focus: #9cbcff; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0c1220; --surface: #131b2c; --ink: #e9eef8; --muted: #b4bfd3; --line: #2b3852; --focus: #9cbcff; color-scheme: dark; }
/* The paper itself stays light in both themes: it is a printed object. */
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.45; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- controls (never printed) ---------- */
.controls { padding-block: 20px 12px; display: flex; flex-direction: column; gap: 12px; }
.controls h1 { font-family: var(--font-display); font-size: 1.5rem; margin: 0; }
.controls p { margin: 0; color: var(--muted); max-width: 70ch; }
.row { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 700; color: var(--muted); }
label.f input, label.f select { font: inherit; font-weight: 400; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.btn { font: inherit; font-size: 0.9rem; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--focus); }
.hint { font-size: 0.85rem; color: var(--muted); }
/* A real record (from the trainer) hides the sample controls; a sample hides the print button. */
body.real .sample-only, body:not(.real) .real-only { display: none !important; }

/* ---------- the sheets ---------- */
.sheets { display: flex; flex-direction: column; gap: 24px; padding-block: 8px 48px; }
.side-label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 6px; }
.sheet { container-type: inline-size; width: 100%; aspect-ratio: 11 / 8.5; background: var(--paper); color: var(--paper-ink); box-shadow: 0 2px 14px rgb(0 0 0 / .14); position: relative; overflow: hidden; }
.frame { position: absolute; inset: 2.6cqi; border: 0.45cqi solid var(--rule); }
.frame::after { content: ""; position: absolute; inset: 0.7cqi; border: 0.15cqi solid var(--rule); }

/* front */
.front .content { position: absolute; inset: 6cqi 8cqi; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1.2cqi; }
.front .issuer { font-family: var(--font-display); font-size: 1.9cqi; letter-spacing: .14em; text-transform: uppercase; color: var(--paper-muted); }
.front .kind { font-family: var(--font-serif); font-size: 5.4cqi; line-height: 1.1; margin-top: 1cqi; }
.front .sm { font-family: var(--font-serif); font-size: 2cqi; color: var(--paper-muted); font-style: italic; }
.front .name { font-family: var(--font-serif); font-size: 4.6cqi; border-bottom: 0.15cqi solid var(--paper-ink); padding: 0 4cqi 0.5cqi; min-width: 50%; }
.front .what { font-family: var(--font-display); font-size: 2.7cqi; font-weight: 700; max-width: 80%; }
.front .course { font-size: 1.9cqi; color: var(--paper-muted); }
.front .bottom { margin-top: auto; width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 3cqi; font-size: 1.5cqi; }
.front .sig { border-top: 0.12cqi solid var(--paper-ink); padding-top: 0.6cqi; color: var(--paper-muted); }
.front .seal svg { width: 11cqi; height: 11cqi; display: block; }
.front .stamp { position: absolute; bottom: 15cqi; right: 8cqi; transform: rotate(8deg); border: 0.3cqi solid var(--gold); color: var(--gold); font-weight: 700; font-size: 1.35cqi; padding: 0.5cqi 1.2cqi; letter-spacing: .08em; text-transform: uppercase; border-radius: 0.6cqi; }

/* back */
.back .content { position: absolute; inset: 5.2cqi 6cqi; display: flex; flex-direction: column; gap: 1.4cqi; font-size: 1.45cqi; }
.back h2 { font-family: var(--font-display); font-size: 2.5cqi; margin: 0; }
.back h3 { font-family: var(--font-display); font-size: 1.7cqi; margin: 0.6cqi 0 0; }
.back .meta { color: var(--paper-muted); }
.badges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1cqi 1.6cqi; }
.badge { display: grid; grid-template-columns: 5.4cqi minmax(0, 1fr); gap: 0.8cqi; align-items: center; }
.badge svg { width: 5.4cqi; height: 5.4cqi; display: block; }
.badge b { display: block; font-size: 1.45cqi; line-height: 1.2; }
.badge span { display: block; font-size: 1.15cqi; color: var(--paper-muted); }
.badge span.mono { font-size: 1cqi; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4cqi; min-height: 0; }
.cols ul { margin: 0.4cqi 0 0; padding-left: 1.2em; }
.cols li { margin-bottom: 0.2cqi; }
/* The course certificate packs more onto the back */
.weeklist { display: grid; gap: 0.7cqi; }
.weekline { display: grid; grid-template-columns: 3.6cqi minmax(0, 1fr); gap: 1cqi; align-items: center; }
.weekline svg { width: 3.6cqi; height: 3.6cqi; display: block; }
.weekline p { margin: 0; font-size: 1.2cqi; line-height: 1.35; }
.cols.compact { font-size: 1.2cqi; }
.cols.compact li { margin-bottom: 0; }
.skill-ids { margin: 0.4cqi 0 0; line-height: 1.4; }
.fine { margin-top: auto; font-size: 1.15cqi; color: var(--paper-muted); border-top: 0.1cqi solid var(--line); padding-top: 0.8cqi; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; }

@media (max-width: 640px) { .badges { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media print {
  @page { size: letter landscape; margin: 0; }
  body { background: #fff; }
  .controls, .side-label { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .sheets { gap: 0; padding: 0; }
  .sheet { width: 11in; height: 8.5in; aspect-ratio: auto; box-shadow: none; break-after: page; }
}
</style>
</head>
<body>
<div class="wrap">
  <section class="controls" aria-labelledby="ctl-title">
    <h1 id="ctl-title">Certificate preview</h1>
    <p id="intro">This is what a learner receives at the end of a lesson. The trainer fills in the real record; without one, this page shows a sample built from the lesson files. To keep one, print two-sided in landscape, or choose Save as PDF in your browser's print dialog.</p>
    <div class="row">
      <button class="btn real-only" type="button" id="print">Print or save as PDF</button>
      <label class="f sample-only" for="lesson">Lesson<select id="lesson"></select></label>
      <label class="f" for="learner">Name on the certificate<input id="learner" type="text" value="Jordan Rivera" autocomplete="off" maxlength="60"></label>
      <label class="f sample-only" for="mode">Taken<select id="mode"><option value="practice">On my own (practice)</option><option value="section">In a class section</option></select></label>
      <button class="btn sample-only" type="button" id="renew">New certificate number</button>
      <label class="btn" for="load">Open a record (.json)<input id="load" type="file" accept="application/json,.json" class="vh"></label>
    </div>
    <p class="hint" id="status" role="status" aria-live="polite"></p>
  </section>
  <div class="sheets">
    <div><p class="side-label">Front</p><article class="sheet front" id="front" aria-label="Certificate, front"></article></div>
    <div><p class="side-label">Back</p><article class="sheet back" id="back" aria-label="Certificate, back: record of learning"></article></div>
  </div>
</div>

<script>
/* ===========================================================================
   trainer-md.js - the Trainer Markdown parser, validator and renderer
   ---------------------------------------------------------------------------
   One file, no dependencies. The editor, the Word add-in and the command-line
   validator all use this same code, so a lesson means the same thing everywhere.

   What it does, in order:
     1. parse(text)     -> turns a lesson file into a plain JavaScript object
     2. validate(doc)   -> lists errors and warnings (with line numbers)
     3. render(doc)     -> turns the object into safe HTML for a preview

   Security rules this file enforces:
     - Every piece of text is HTML-escaped before anything else happens.
       Only tags this file writes itself ever reach the page.
     - Raw HTML in a lesson file is reported as an error and shown as text.
     - Links must be https:// (or a relative .md file); videos must come from
       an approved host and render in a sandboxed frame.
     - A lesson can only affect grading by NAMING a check in CHECKS below.
       It can never supply code.
   =========================================================================== */
(function (root) {
  "use strict";

  const VERSION = "0.5.0";

  // -------------------------------------------------------------------------
  // Fonts: each choice expands to a fallback chain (see course.config.md).
  // Look-alike fonts (Arimo, Tinos, Carlito) cover Chromebooks and Linux.
  // -------------------------------------------------------------------------
  const FONT_STACKS = {
    "Comfortaa": '"Comfortaa", "Atkinson Hyperlegible", Arial, sans-serif',
    "Atkinson Hyperlegible": '"Atkinson Hyperlegible", Arial, Arimo, sans-serif',
    "Arial": 'Arial, Arimo, "Liberation Sans", Helvetica, sans-serif',
    "Helvetica": 'Helvetica, "Helvetica Neue", Arial, Arimo, sans-serif',
    "Verdana": 'Verdana, "DejaVu Sans", Arial, sans-serif',
    "Calibri": 'Calibri, Carlito, Arial, sans-serif',
    "Aptos": 'Aptos, Calibri, Carlito, Arial, sans-serif',
    "Times New Roman": '"Times New Roman", Tinos, "Liberation Serif", Times, serif',
    "Georgia": 'Georgia, Gelasio, "Times New Roman", Tinos, serif',
    "OpenDyslexic": 'OpenDyslexic, "Atkinson Hyperlegible", Arial, sans-serif',
    "System default": 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif',
  };
  const DEFAULT_FONTS = { heading: "Comfortaa", body: "Atkinson Hyperlegible" };
  function fontStack(name, fallbackName) {
    return FONT_STACKS[name] || FONT_STACKS[fallbackName] || FONT_STACKS["System default"];
  }

  // Hosts videos may load from unless course.config.md says otherwise.
  const DEFAULT_VIDEO_HOSTS = ["www.youtube-nocookie.com", "www.youtube.com", "player.vimeo.com"];

  // -------------------------------------------------------------------------
  // The checker library catalog. Each entry lists the parameters a check
  // accepts and their type. The real check code lives in the add-in; this
  // list is what the validator uses to reject typos and unknown checks.
  // -------------------------------------------------------------------------
  const SELECTORS = ["in", "para", "paras", "text", "style"];
  const CHECKS = {
    "file.name":            { params: { pattern: "string!" } },
    "text.present":         { params: { value: "string!", min: "int", max: "int", case: "enum:sensitive|insensitive" }, selector: true },
    "text.absent":          { params: { value: "string!", case: "enum:sensitive|insensitive" }, selector: true },
    "text.noDoubleSpaces":  { params: {}, selector: true },
    "para.noEmpty":         { params: { max: "int", after: "string", before: "string" } },
    "para.order":           { params: { first: "string!", then: "string!" } },
    "font.is":              { params: { name: "string", size: "number", bold: "bool", italic: "bool", underline: "bool", color: "color" }, selector: true, needsOneOf: ["name", "size", "bold", "italic", "underline", "color"] },
    "effect.present":       { params: { kind: "enum:shadow|glow|reflection|outline|any" }, selector: true },
    "format.same":          { params: { a: "string!", b: "string!", props: "string" } },
    "format.clean":         { params: {}, selector: true },
    "para.is":              { params: { align: "enum:left|center|right|justify", lineSpacing: "lineSpacing", spaceBefore: "length", spaceAfter: "length", firstLineIndent: "length", leftIndent: "length", keepNext: "bool", dropCap: "bool" }, selector: true, needsOneOf: ["align", "lineSpacing", "spaceBefore", "spaceAfter", "firstLineIndent", "leftIndent", "keepNext", "dropCap"] },
    "page.is":              { params: { margins: "length", top: "length", bottom: "length", left: "length", right: "length", size: "enum:letter|a4|legal", orientation: "enum:portrait|landscape" }, needsOneOf: ["margins", "top", "bottom", "left", "right", "size", "orientation"] },
    "props.is":             { params: { title: "string", author: "string", keywords: "string" }, needsOneOf: ["title", "author", "keywords"] },
    "lang.is":              { params: { value: "lang!" } },
    "self.attest":          { params: { label: "string!" }, notInSkillCheck: true },
    // ----- Week 2: styles, navigation, lists, headers, sections, references -----
    "style.is":             { params: { name: "string!" }, selector: true },
    "style.def":            { params: { name: "string!", font: "string", size: "number", bold: "bool", italic: "bool", color: "color", spaceBefore: "length", spaceAfter: "length", keepNext: "bool", align: "enum:left|center|right|justify", lineSpacing: "lineSpacing" }, needsOneOf: ["font", "size", "bold", "italic", "color", "spaceBefore", "spaceAfter", "keepNext", "align", "lineSpacing"] },
    "bookmark.is":          { params: { name: "string!", at: "string" } },
    "link.present":         { params: { label: "string", anchor: "string", url: "string", descriptive: "bool", min: "int" } },
    "field.present":        { params: { code: "string!", min: "int", max: "int" }, selector: true },
    "section.is":           { params: { index: "int", orientation: "enum:portrait|landscape", columns: "int", breakType: "enum:nextPage|continuous|evenPage|oddPage", firstPageDifferent: "bool", border: "bool" }, selector: true, needsOneOf: ["orientation", "columns", "breakType", "firstPageDifferent", "border"] },
    "break.count":          { params: { kind: "enum:page|column|section!", min: "int", max: "int" } },
    "list.is":              { params: { kind: "enum:bullet|number", level: "int", format: "enum:decimal|lowerLetter|upperLetter|lowerRoman|upperRoman|bullet", symbol: "string", pattern: "string", number: "int" }, selector: true, needsOneOf: ["kind", "level", "format", "symbol", "pattern", "number"] },
    "notes.is":             { params: { kind: "enum:footnote|endnote!", min: "int", max: "int", format: "enum:decimal|lowerRoman|upperRoman|lowerLetter|upperLetter|chicago" } },
    "toc.is":               { params: { levels: "int", includes: "string" } },
    "citation.is":          { params: { citations: "int", sources: "int", bibliography: "bool", citeStyle: "enum:APA|MLA|Chicago|IEEE" }, needsOneOf: ["citations", "sources", "bibliography", "citeStyle"] },
    // ----- Week 3: graphics, tables, page design -----
    "object.count":         { params: { kind: "enum:any|picture|icon|shape|textbox|smartart|chart|model3d!", min: "int", max: "int" } },
    "object.is":            { params: { kind: "enum:any|picture|icon|shape|textbox|smartart|chart|model3d!", index: "int", name: "string", any: "bool", contains: "string", alt: "bool", decorative: "bool", wrap: "enum:inline|square|tight|through|topAndBottom|behind|inFront", halign: "enum:left|center|right", valign: "enum:top|middle|bottom", pictureStyle: "bool", artistic: "bool", bgRemoved: "bool", fill: "string", outline: "string", says: "string", layout: "string", items: "int", colors: "bool", smartStyle: "bool", chartType: "enum:column|bar|line|pie" } },
    "table.count":          { params: { contains: "string", min: "int", max: "int" } },
    "table.is":             { params: { index: "int", contains: "string", lacks: "string", any: "bool", rows: "int", minRows: "int", cols: "int", headerRepeat: "bool", merged: "bool", sortedBy: "int", order: "enum:asc|desc", cellMargin: "length", cellSpacing: "length", col: "int", width: "length" }, needsOneOf: ["rows", "minRows", "cols", "headerRepeat", "merged", "sortedBy", "cellMargin", "cellSpacing", "width"] },
    "theme.is":             { params: { colors: "string", accent1: "color", accent2: "color", accent3: "color", accent4: "color", accent5: "color", accent6: "color" }, needsOneOf: ["colors", "accent1", "accent2", "accent3", "accent4", "accent5", "accent6"] },
    "page.background":      { params: { watermark: "string", color: "string" }, needsOneOf: ["watermark", "color"] },
    // ----- Week 4: templates, tabs, mail merge -----
    "tabs.is":              { params: { position: "length", align: "enum:left|right|center|decimal", leader: "enum:dot|hyphen|underscore|none" }, selector: true, needsOneOf: ["position", "align", "leader"] },
    "controls.filled":      { params: {} },
    "merge.is":             { params: { type: "enum:letters|labels|envelopes|directory|email", source: "bool" }, needsOneOf: ["type", "source"] },
    // ----- Week 5: collaboration and shipping -----
    "comment.count":        { params: { min: "int", max: "int" } },
    "comment.is":           { params: { says: "string", anchor: "string", author: "string", state: "enum:present|absent|replied|resolved|open" }, needsOneOf: ["says", "anchor", "author"] },
    "revision.count":       { params: { kind: "enum:any|insert|delete|format|move", author: "string", min: "int", max: "int" } },
    "doc.is":               { params: { tracking: "bool", protection: "enum:none|readOnly|comments|trackedChanges|forms", password: "bool", compatMode: "int", personalInfo: "enum:kept|removed" }, needsOneOf: ["tracking", "protection", "password", "compatMode", "personalInfo"] },
    "text.hidden":          { params: { max: "int" } },
    "access.is":            { params: { rules: "string" } },
  };

  // ----- Excel (excel/tools/excel-checker.js) -----
  // Excel checks point at cells with cell=B2 or range=B2:B9 (optionally
  // "June!B2"), plus sheet=June. Those two are the Excel selectors.
  const EXCEL_SELECTORS = ["cell", "range"];
  const XS = "string";   // short names to keep the table below readable
  const EXCEL_CHECKS = {
    "file.name":        { params: { pattern: "string!" } },
    "text.present":     { params: { value: "string!", sheet: XS, min: "int", max: "int", case: "enum:sensitive|insensitive" }, selector: true },
    "text.absent":      { params: { value: "string!", sheet: XS, case: "enum:sensitive|insensitive" }, selector: true },
    "props.is":         { params: { title: XS, author: XS, keywords: XS }, needsOneOf: ["title", "author", "keywords"] },
    "self.attest":      { params: { label: "string!" }, notInSkillCheck: true },
    "sheet.is":         { params: { name: "string!", exists: "bool", index: "int", after: XS, tabColor: XS, hidden: "bool", kind: "enum:worksheet|chart" } },
    "sheet.count":      { params: { min: "int", max: "int", visible: "bool" } },
    "cell.is":          { params: { sheet: XS, value: XS, contains: XS, number: "number", tolerance: "number", date: XS,
                          type: "enum:number|text|date|blank|formula|logical|error", blank: "bool",
                          numFmt: "enum:general|number|currency|accounting|percent|date|time|datetime|fraction|scientific|text", decimals: "int", strict: "bool",
                          bold: "bool", italic: "bool", underline: "bool", fontSize: "number", font: XS, fontColor: XS, fill: XS,
                          align: "enum:left|center|right|general|justify|centerContinuous|fill|distributed", valign: "enum:top|center|bottom|justify|distributed",
                          wrap: "bool", indent: XS, rotation: XS, border: "enum:any|none|left|right|top|bottom", style: XS, locked: "bool", clean: "bool", sameAs: XS, merged: "bool" },
                          selector: true, needsSelector: true },
    "formula.is":       { params: { sheet: XS, uses: XS, contains: XS, lacks: XS, result: XS, filled: "bool", spill: "bool", hasFormula: "bool", refs: "bool", structured: "bool", external: XS, min: "number", max: "number" }, selector: true, needsSelector: true },
    "col.is":           { params: { sheet: XS, col: "string!", width: "number", minWidth: "number", maxWidth: "number", hidden: "bool" }, needsOneOf: ["width", "minWidth", "maxWidth", "hidden"] },
    "row.is":           { params: { sheet: XS, row: "string!", height: "number", minHeight: "number", hidden: "bool" }, needsOneOf: ["height", "minHeight", "hidden"] },
    "view.is":          { params: { sheet: XS, frozen: XS, view: "enum:normal|pageLayout|pageBreakPreview", showFormulas: "bool", split: "bool", gridlines: "bool" }, needsOneOf: ["frozen", "view", "showFormulas", "split", "gridlines"] },
    "window.count":     { params: { min: "int!" } },
    "page.is":          { params: { sheet: XS, orientation: "enum:portrait|landscape", size: "enum:letter|legal|a4", fitWide: "int", fitTall: "int", scale: "int",
                          margins: "length", top: "length", bottom: "length", left: "length", right: "length", centerH: "bool", gridlines: "bool", printArea: XS, printTitles: XS },
                          needsOneOf: ["orientation", "size", "fitWide", "fitTall", "scale", "margins", "top", "bottom", "left", "right", "centerH", "gridlines", "printArea", "printTitles"] },
    "header.is":        { params: { sheet: XS, part: "enum:header|footer!", says: XS, field: "enum:page|pages|sheet|file|date|time|path", position: "enum:left|center|right" } },
    "name.is":          { params: { name: "string!", refersTo: XS, scope: XS, exists: "bool" } },

    "master.is":      { params: { kind: "enum:slide|notes|handout", background: "enum:any|picture|gradient|solid", titleFont: PS, picture: "bool", says: PS, phSays: PS, lacks: "enum:hdr|ftr|dt|sldNum" } },
    "layout.is":      { params: { name: "string!", exists: "bool", custom: "bool", placeholder: PS, lacks: "enum:ftr|dt|sldNum|title|body|pic", used: "bool" } },

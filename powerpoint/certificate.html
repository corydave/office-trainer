","5.2.1":"Animate text and graphic elements","5.2.2":"Animate 3D models","5.2.3":"Configure animation effects and timing","5.2.4":"Configure animation paths","5.2.5":"Reorder animations on a slide"},"labels":{"auto":{"section":"Auto-checked","practice":"Auto-checked"},"screenshot":{"section":"Screenshot for your instructor","practice":"Screenshot: compare with the example"},"instructor":{"section":"Graded by your instructor","practice":"Self-check with the rubric"},"practice":{"section":"Practice only","practice":"Practice only"}},"builtFrom":"content/outline.md and the lesson files"}</script>
<script>
/* =========================================================================
   Certificate logic:
   1. Build (or load) a RECORD: who, which lesson, which badges, which
      outcomes, and unique numbers for the certificate and each badge.
   2. Draw the front and back from that record.
   The record format is in spec/badges-and-certificates.md; the trainer
   will produce the same shape when a learner finishes a lesson.
   ========================================================================= */
(function () {
  "use strict";
  const TM = window.TrainerMD;
  const DATA = JSON.parse(document.getElementById("course-data").textContent);
  const $ = (id) => document.getElementById(id);
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) n.setAttribute(k, String(v));
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return n;
  }
  /** Badge art from TrainerMD (it escapes every value it draws). */
  function art(o) { const s = el("span"); s.innerHTML = TM.badgeSVG(o); return s.firstChild; }

  // Lessons that exist and award a certificate
  const lessons = [];
  DATA.weeks.forEach((w) => w.stations.forEach((s) => { if (s.certificate && (s.activities.length || s.kind === "course")) lessons.push(Object.assign({}, s, { weekN: w.n, weekTitle: w.title })); }));
  $("lesson").replaceChildren(...lessons.map((l, i) => el("option", { value: String(i) }, `Week ${l.weekN}: ${l.title}`)));
  $("lesson").value = String(Math.min(1, lessons.length - 1));
  const outcomeText = Object.fromEntries(DATA.outcomes.map((o) => [o.id, o.text]));
  // "W1-L2" becomes "W1L2" in the certificate number; the course certificate uses "WORD"
  const code = (l) => l.kind === "course" || !l.docId ? "WORD" : l.docId.replace(/[^A-Za-z0-9]/g, "");

  /** A sample record for one lesson, shaped like the ones the trainer will issue. */
  function sampleRecord(l, name, mode) {
    const now = new Date();
    // The course certificate collects every badge in the course: lessons, skill checks and projects
    const acts = l.kind === "course" ? DATA.weeks.flatMap((w) => w.stations.flatMap((x) => x.activities)) : l.activities;
    return {
      format: "office-trainer-certificate/1",
      id: TM.makeId("OT-" + code(l), now),
      issuedAt: now.toISOString().slice(0, 10),
      issuer: DATA.course.issuer,
      mode,
      learner: { name },
      section: mode === "section" ? { name: "Sample section", instructor: "Instructor name" } : null,
      achievement: { kind: l.kind === "course" ? "course" : "lesson", id: l.sid, title: l.title, week: l.kind === "course" ? null : l.weekN },
      badges: acts.map((a) => ({ id: TM.makeId("OTB-" + a.id.replace(/\W/g, ""), now), activity: a.id, name: a.badge.name, kind: a.badge.kind, week: a.badge.week, assessedBy: a.assess, earnedAt: now.toISOString().slice(0, 10) })),
      outcomes: l.clos,
      mos: l.mos,
    };
  }

  let record = null;
  function rebuild() { record = sampleRecord(lessons[Number($("lesson").value)], $("learner").value.trim() || "Learner name", $("mode").value); draw(); }

  function draw() {
    const r = record, practice = r.mode !== "section";
    const date = new Date(r.issuedAt + "T12:00:00").toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    // A course certificate earned in a section that left stops out is titled "Course Complete: <section>": say so instead of "complete".
    const inSection = r.achievement.kind === "course" && /^Course Complete: (.+)$/.exec(r.achievement.title || "");
    const what = r.achievement.kind === "course"
      ? (inSection ? DATA.app.fullName + ": the course as set for " + inSection[1] : DATA.app.fullName + ": the complete five-week course")
      : `Week ${r.achievement.week} · ${r.achievement.title}`;

    // ---- front ----
    $("front").replaceChildren(
      el("div", { class: "frame", "aria-hidden": "true" }),
      practice ? el("div", { class: "stamp" }, "Practice record") : null,
      el("div", { class: "content" },
        el("div", { class: "issuer" }, r.issuer),
        el("div", { class: "kind" }, practice ? "Certificate of Practice" : "Certificate of Completion"),
        el("div", { class: "sm" }, "This certifies that"),
        el("div", { class: "name" }, r.learner.name),
        el("div", { class: "sm" }, practice ? "practiced and completed" : "has successfully completed"),
        el("div", { class: "what" }, what),
        el("div", { class: "course" }, `${DATA.app.fullName} course · ${r.badges.length} badge${r.badges.length === 1 ? "" : "s"} earned` + (DATA.app.exam ? ` · mapped to Microsoft Office Specialist ${DATA.app.exam}` : "")),
        el("div", { class: "bottom" },
          el("div", { class: "sig" }, practice ? `Issued ${date}` : `${r.section.instructor}, Instructor`),
          el("div", { class: "seal" }, art({ week: r.achievement.week, kind: r.achievement.kind === "course" ? "course" : "lesson", label: "Seal", size: 100 })),
          el("div", { class: "sig" }, el("span", {}, "Certificate no. "), el("span", { class: "mono" }, r.id)))));

    // ---- back ----
    const compact = r.badges.length > 24; // the course certificate
    $("back").replaceChildren(
      el("div", { class: "frame", "aria-hidden": "true" }),
      el("div", { class: "content" },
        el("h2", {}, "Record of learning"),
        el("div", { class: "meta" }, `${r.learner.name} · ${what} · issued ${date} · `, el("span", { class: "mono" }, r.id)),
        el("h3", {}, `Badges earned (${r.badges.length})`),
        // A lesson has a few badges: draw each one. The whole course has too
        // many for one page, so list them by week instead (all of them fit).
        compact ? compactBadges(r) : el("div", { class: "badges" }, r.badges.map((b) => el("div", { class: "badge" },
          art({ week: b.week, kind: b.kind, code: b.activity, label: b.name + " badge", size: 60 }),
          el("div", {}, el("b", {}, b.name), el("span", { class: "mono" }, b.id), el("span", {}, b.assessedBy.map((k) => DATA.labels[k][r.mode === "section" ? "section" : "practice"]).join(", ")))))),
        el("div", { class: "cols" + (compact ? " compact" : "") },
          el("div", {}, el("h3", {}, "Course outcomes"), el("ul", {}, r.outcomes.map((c) => el("li", {}, `${c}: ${outcomeText[c] || ""}`)))),
          el("div", {}, el("h3", {}, "Microsoft Office Specialist (" + (DATA.app.exam || "MOS") + ") skills"),
            compact
              ? el("p", { class: "skill-ids" }, `All ${r.mos.length} skills practiced: ${r.mos.join(", ")}.`)
              : [el("ul", {}, r.mos.slice(0, 14).map((c) => el("li", {}, `${c} ${DATA.mosNames[c] || ""}`))),
                 r.mos.length > 14 ? el("div", { class: "meta" }, `…and ${r.mos.length - 14} more skills.`) : null])),
        el("div", { class: "fine" }, practice
          ? `Practice record. This certificate was created on the learner's own device and is not recorded or verified by ${r.issuer.split(",")[0]}. Each number is unique; its last character is a check digit that catches typing mistakes.`
          : `Issued for ${r.section.name}. Numbers are unique; the last character of each is a check digit.`)));
    $("status").textContent = `Certificate ${r.id}: ${TM.idLooksValid(r.id) ? "number format checks out" : "number format looks wrong"}.`;
  }

  /**
   * The course certificate's badge list: one line per week, with the
   * week's seal and every badge name. Badge numbers stay in the .json record.
   */
  function compactBadges(r) {
    const weeks = [...new Set(r.badges.map((b) => b.week))].sort((x, y) => x - y);
    return el("div", { class: "weeklist" }, weeks.map((w) => {
      const list = r.badges.filter((b) => b.week === w);
      return el("div", { class: "weekline" },
        art({ week: w, kind: "lesson", label: "Week " + w, size: 40 }),
        el("p", {}, el("b", {}, `Week ${w} (${list.length}): `), list.map((b) => b.name).join(" · ")));
    }));
  }

  /**
   * Show a real record: one the trainer opened this page with, or one the
   * learner saved as a .json file. Only the fields we draw are kept, as plain
   * strings, so nothing unexpected reaches the page.
   */
  function useRecord(r) {
    if (r.format !== "office-trainer-certificate/1" || !r.learner || !Array.isArray(r.badges)) throw new Error("not a certificate record");
    // keep only the fields we draw, as plain strings, so nothing unexpected reaches the page
    record = { format: r.format, id: String(r.id), issuedAt: String(r.issuedAt).slice(0, 10), issuer: String(r.issuer || DATA.course.issuer), mode: r.mode === "section" ? "section" : "practice",
      learner: { name: String(r.learner.name || "").slice(0, 60) }, section: r.section ? { name: String(r.section.name || ""), instructor: String(r.section.instructor || "") } : null,
      achievement: { kind: r.achievement && r.achievement.kind === "course" ? "course" : "lesson", id: String(r.achievement && r.achievement.id || ""), title: String(r.achievement && r.achievement.title || ""), week: Number(r.achievement && r.achievement.week) || null },
      badges: r.badges.slice(0, 200).map((b) => ({ id: String(b.id), activity: String(b.activity), name: String(b.name), kind: String(b.kind), week: Number(b.week) || null, assessedBy: (Array.isArray(b.assessedBy) ? b.assessedBy : []).filter((k) => DATA.labels[k]), earnedAt: String(b.earnedAt || "") })),
      outcomes: (r.outcomes || []).map(String), mos: (r.mos || []).map(String) };
    if (record.mode === "section" && !record.section) record.section = { name: "Class section", instructor: "Instructor" };
    document.body.classList.add("real");
    $("ctl-title").textContent = "Your certificate";
    $("intro").textContent = "Print it two-sided in landscape, or choose Save as PDF in the print dialog to keep a copy. This page doesn't send your certificate anywhere.";
    $("learner").value = record.learner.name;
    draw();
  }

  // Open a record someone saved (the trainer's "Save my record")
  $("load").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { useRecord(JSON.parse(await f.text())); }
    catch (err) { $("status").textContent = "That file isn't a certificate record. Choose a .json file saved from the trainer."; }
    e.target.value = "";
  });
  $("print").addEventListener("click", () => window.print());
  ["lesson", "mode"].forEach((id) => $(id).addEventListener("change", rebuild));
  $("learner").addEventListener("input", () => { record.learner.name = $("learner").value.trim() || "Learner name"; draw(); });
  $("renew").addEventListener("click", rebuild);
  rebuild();

  // The trainer opens this page as certificate.html#record=<the record, base64url-encoded>.
  // The part after # never leaves the browser (it isn't sent to the web server).
  const m = /^#record=([A-Za-z0-9_-]+)$/.exec(location.hash);
  if (m) {
    try {
      const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
      const bytes = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
      useRecord(JSON.parse(new TextDecoder().decode(bytes)));
    } catch (err) { $("status").textContent = "This certificate link is damaged. Open the trainer and choose View certificate again."; }
    // Take the record out of the address bar, so it isn't saved in browser history.
    try { history.replaceState(null, "", location.pathname + location.search); } catch (err) { /* not important */ }
  }
})();
</script>

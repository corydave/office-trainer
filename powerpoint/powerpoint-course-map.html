<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PowerPoint Course Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Five-week Microsoft PowerPoint course map for FLCC with MOS MO-310 crosswalk, outcome evidence and standards alignment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Comfortaa:wght@500;700&display=swap">
<style>
/* =====================================================================
   DESIGN TOKENS
   Layout concept: a Word-style ruler across the top doubles as the week
   navigator; below it, tabbed panels (overview, map, matrix, crosswalk,
   evidence, standards, sources). Every color lives here as a token so
   light and dark themes both work. Small text meets 7:1 contrast (AAA).
   ===================================================================== */
:root {
  --bg: #f5f7fb;          /* page background - a cool, blue-leaning neutral */
  --surface: #ffffff;     /* cards and tables */
  --surface-2: #eef2f9;   /* table headers, quiet fills */
  --ink: #111a2e;         /* main text */
  --muted: #424a57;       /* secondary text (7:1 on every surface) */
  --line: #d3dae8;        /* borders and rules */
  --blue: #0046ad;        /* FLCC / FLX primary - links, active states */
  --blue-soft: #e3ecfa;
  --green: #305305;       /* "assessed" and "covered" */
  --green-soft: #e8f0df;
  --orange: #8a2905;      /* flags (darkened brand orange so small text clears 7:1) */
  --orange-fill: #a23108; /* brand orange for borders and marks */
  --orange-soft: #f8e6df;
  --ruler: #fbfcfe;
  --tick: #8d99b0;
  --focus: #0046ad;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Comfortaa", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  --step--1: 0.875rem; --step-0: 1rem; --step-1: 1.2rem; --step-2: 1.5rem; --step-3: 2.1rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1220; --surface: #131b2c; --surface-2: #1a2438; --ink: #e9eef8; --muted: #b4bfd3;
    --line: #2b3852; --blue: #9cbcff; --blue-soft: #1b2c4f; --green: #a6d585; --green-soft: #1d2e1a;
    --orange: #ffab8a; --orange-fill: #ff8f63; --orange-soft: #3a2018; --ruler: #151e31; --tick: #5d6b86;
    --focus: #9cbcff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1220; --surface: #131b2c; --surface-2: #1a2438; --ink: #e9eef8; --muted: #b4bfd3;
  --line: #2b3852; --blue: #9cbcff; --blue-soft: #1b2c4f; --green: #a6d585; --green-soft: #1d2e1a;
  --orange: #ffab8a; --orange-fill: #ff8f63; --orange-soft: #3a2018; --ruler: #151e31; --tick: #5d6b86;
  --focus: #9cbcff; color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.55;
}
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-3); font-weight: 700; }
h2 { font-size: var(--step-2); font-weight: 700; }
h3 { font-size: var(--step-1); font-weight: 700; }
p { margin: 0; max-width: 70ch; }
a { color: var(--blue); }
code, .code { font-family: var(--font-mono); font-size: 0.9em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: -9999px; top: 0; }
.skip:focus { left: 16px; top: 8px; z-index: 50; background: var(--surface); padding: 8px 12px; }
.muted { color: var(--muted); }
.eyebrow { font-size: var(--step--1); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- masthead ---------- */
.masthead { padding-block: 28px 18px; }
.masthead .wrap { display: flex; flex-direction: column; gap: 14px; }
.masthead-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start; }
.lede { font-size: var(--step-1); color: var(--muted); max-width: 62ch; }
.theme-btn {
  font: inherit; font-size: var(--step--1); padding: 6px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-display); font-size: var(--step-2); font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--step--1); color: var(--muted); }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- ruler (week navigator) ---------- */
.ruler-band { padding-block: 6px 0; }
.ruler {
  position: relative; border: 1px solid var(--line); border-radius: 6px; background-color: var(--ruler);
  /* inch ticks: tall every 20%, small every 2.5% - like Word's horizontal ruler */
  background-image:
    repeating-linear-gradient(to right, var(--tick) 0 1px, transparent 1px 20%),
    repeating-linear-gradient(to right, var(--tick) 0 1px, transparent 1px 2.5%);
  background-size: 100% 12px, 100% 6px; background-repeat: no-repeat; background-position: 0 0, 0 0;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
}
.ruler button {
  font: inherit; text-align: left; background: transparent; border: 0; color: var(--ink); cursor: pointer;
  padding: 18px 10px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.ruler button .n { font-family: var(--font-mono); font-size: var(--step--1); color: var(--muted); }
.ruler button .t { font-weight: 700; font-size: var(--step--1); overflow-wrap: anywhere; }
.ruler button[aria-current="true"] { background: var(--blue-soft); }
.ruler button[aria-current="true"] .n { color: var(--blue); font-weight: 700; }
/* the little tab-stop marker under the active week */
.ruler button[aria-current="true"]::after {
  content: ""; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent;
  border-bottom: 8px solid var(--blue); margin-top: 4px;
}
@media (max-width: 560px) { .ruler button .t { display: none; } .ruler button { padding-inline: 6px; } }

/* ---------- tabs ---------- */
.tabs-band { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tablist { display: flex; gap: 4px; overflow-x: auto; padding-block: 10px 0; scrollbar-width: thin; }
.tab {
  font: inherit; font-weight: 700; font-size: var(--step--1); white-space: nowrap; cursor: pointer;
  padding: 9px 14px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0;
  background: transparent; color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--blue); border-color: var(--line); margin-bottom: -1px; }
main { padding-block: 24px 56px; }
[role="tabpanel"] { outline: none; }

/* ---------- generic pieces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.grid-weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.week-card { display: flex; flex-direction: column; gap: 10px; }
.week-card .num { font-family: var(--font-mono); color: var(--muted); font-size: var(--step--1); }
.week-card .proj { font-size: var(--step--1); }
.btn {
  font: inherit; font-size: var(--step--1); font-weight: 700; cursor: pointer; align-self: flex-start;
  padding: 7px 12px; border-radius: 8px; border: 1px solid var(--blue); background: transparent; color: var(--blue);
}
.btn:hover { background: var(--blue-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: var(--step--1); line-height: 1.3;
  padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
}
button.chip { font: inherit; font-size: var(--step--1); cursor: pointer; }
button.chip:hover { border-color: var(--blue); color: var(--blue); }
/* Standards chips that link out to the official framework pages */
a.chip { text-decoration: none; color: var(--blue); }
a.chip:hover { border-color: var(--blue); text-decoration: underline; }
a.chip .ext { font-size: 0.85em; }
.chip.code { font-family: var(--font-mono); }
.pill { display: inline-block; font-size: var(--step--1); font-weight: 700; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.pill.web { background: var(--blue-soft); color: var(--blue); }
.pill.desktop { background: var(--orange-soft); color: var(--orange); }
.pill.both { background: var(--surface-2); color: var(--muted); }
.pill.full { background: var(--green-soft); color: var(--green); }
.pill.partial { background: var(--blue-soft); color: var(--blue); }
.pill.none { background: var(--surface-2); color: var(--muted); }
.pill.flag { background: var(--orange-soft); color: var(--orange); }
.pill.info { background: var(--blue-soft); color: var(--blue); }

/* I / R / A marks: shape AND letter carry meaning, not color alone */
.mark {
  display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%;
  font-weight: 700; font-size: 0.8rem; border: 2px solid var(--blue); color: var(--blue); background: var(--surface);
}
.mark.R { background: linear-gradient(90deg, var(--blue-soft) 50%, var(--surface) 50%); }
.mark.A { background: var(--green); border-color: var(--green); color: var(--surface); }
.marks { display: inline-flex; gap: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: var(--step--1); color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- tables ---------- */
/* position: relative keeps hidden screen-reader labels inside the scroll box (no page-wide overflow) */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
thead th { background: var(--surface-2); font-weight: 700; position: sticky; top: 0; }
tbody tr:last-child > * { border-bottom: 0; }
td.center, th.center { text-align: center; }
td.num { font-family: var(--font-mono); white-space: nowrap; }
tr.group td { background: var(--surface-2); font-weight: 700; }
.matrix td.center { min-width: 64px; }
.matrix th[scope="row"] { font-weight: 400; min-width: 240px; }

/* ---------- week detail ---------- */
.week-select { display: flex; flex-wrap: wrap; gap: 8px; }
.week-select button {
  font: inherit; font-weight: 700; font-size: var(--step--1); cursor: pointer; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.week-select button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--surface); }
.week-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 20px; align-items: start; }
@media (max-width: 900px) { .week-layout { grid-template-columns: minmax(0, 1fr); } }
.objectives { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.objectives li { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 8px; }
.objectives .oid { font-family: var(--font-mono); font-weight: 700; color: var(--blue); }
.aside-block { display: flex; flex-direction: column; gap: 6px; }
.aside-block + .aside-block { border-top: 1px solid var(--line); padding-top: 12px; }
dl.why { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; }
dl.why dt { font-weight: 700; }
dl.why dd { margin: 0; }
/* Callout box: the accent is a thin, fully rounded "pill" bar drawn with ::before,
   instead of a square left border. It is the same 4px width as the old border. */
.callout { position: relative; background: var(--blue-soft); padding: 10px 14px 10px 24px; border-radius: 8px; }
.callout::before {
  content: ""; position: absolute; left: 9px; top: 10px; bottom: 10px;
  width: 4px; border-radius: 999px;   /* 999px = ends fully rounded at any height */
  background: var(--blue);
}
.callout.warn { background: var(--orange-soft); }
.callout.warn::before { background: var(--orange-fill); }

/* ---------- coverage bars (MOS domains) ---------- */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr) 6.5em; gap: 12px; align-items: center; font-size: var(--step--1); }
.bar { height: 14px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; display: flex; }
.bar .checked { background: var(--green); }
.bar .drilled { background: repeating-linear-gradient(45deg, var(--blue) 0 3px, var(--blue-soft) 3px 6px); }
.bar-row .val { font-variant-numeric: tabular-nums; text-align: right; }
@media (max-width: 640px) { .bar-row { grid-template-columns: minmax(0, 1fr) 5.5em; } .bar-row .bar { grid-column: 1 / -1; } }
.swatch { display: inline-block; width: 14px; height: 10px; border-radius: 3px; border: 1px solid var(--line); }
.swatch.checked { background: var(--green); }
.swatch.drilled { background: repeating-linear-gradient(45deg, var(--blue) 0 3px, var(--blue-soft) 3px 6px); }

/* grading bar */
.grade-bar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.grade-bar div { display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; color: var(--surface); min-width: 0; }
.g0 { background: var(--muted); } .g1 { background: var(--blue); } .g2 { background: var(--green); } .g3 { background: var(--orange-fill); } .g4 { background: var(--ink); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: var(--step--1); font-weight: 700; }
.filters input, .filters select {
  font: inherit; font-weight: 400; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); min-width: 0;
}
.filters input { width: min(280px, 100%); }
.filters select { max-width: 100%; }
/* on phones, wide tables keep readable columns and scroll sideways inside their box */
@media (max-width: 640px) { .table-wrap table { min-width: 600px; } }
.result-count { font-size: var(--step--1); color: var(--muted); }

/* evidence cards */
.evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
@media (max-width: 400px) { .evidence-grid { grid-template-columns: minmax(0, 1fr); } }
dl.ev { margin: 0; display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 6px 10px; font-size: var(--step--1); }
dl.ev dt { font-weight: 700; color: var(--muted); }
dl.ev dd { margin: 0; }
.subnav { display: flex; flex-wrap: wrap; gap: 8px; }
.subnav a { font-size: var(--step--1); font-weight: 700; }

footer { border-top: 1px solid var(--line); padding-block: 18px 32px; font-size: var(--step--1); color: var(--muted); }

@media (prefers-reduced-motion: no-preference) { .tab, .btn, .chip { transition: background-color .15s, color .15s; } }
/* Printing the local file (Ctrl/Cmd+P) shows every panel */
@media print {
  .tabs-band, .ruler-band, .theme-btn, .filters, .week-select { display: none !important; }
  [role="tabpanel"][hidden] { display: block !important; }
  .card, .table-wrap { break-inside: avoid; }
}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="wrap">
    <div class="masthead-top">
      <div class="stack">
        <span class="eyebrow" id="meta-line"></span>
        <h1 id="page-title"></h1>
        <p class="lede" id="lede"></p>
      </div>
      <!-- Theme toggle: cycles system -> light -> dark. Remembered per browser when storage is allowed. -->
      <button type="button" class="theme-btn" id="theme-btn" aria-live="polite">Theme: system</button>
    </div>
    <div class="stats" id="stats" aria-label="Coverage summary"></div>
  </div>
</header>

<nav class="ruler-band" aria-label="Weeks">
  <div class="wrap"><div class="ruler" id="ruler"></div></div>
</nav>

<div class="tabs-band">
  <div class="wrap">
    <div class="tablist" role="tablist" aria-label="Course map views" id="tablist"></div>
  </div>
</div>

<main id="main" tabindex="-1">
  <div class="wrap" id="panels"></div>
</main>

<footer>
  <div class="wrap" id="footer"></div>
</footer>

ide, change one slide's layout, and duplicate a slide.", ["2.1.3", "2.1.5"], ["N3"], "web"], ["D1.05", "Reuse two slides from another presentation, then build slides from a Word outline.", ["2.1.1", "2.1.2"], [], "desktop"], ["D1.06", "Group the slides into named sections, rename one, move a section, reorder two slides and hide the old schedule slide.", ["2.2.1", "2.3.1", "2.3.2", "2.3.3"], ["N10"], "web"], ["D1.07", "Format the title text, apply a WordArt style, and set the gear list in two columns.", ["3.1.1", "3.1.2"], ["N4"], "desktop"], ["D1.08", "Turn plain lines into a bulleted list with two levels and the steps into a numbered list.", ["3.1.3"], [], "web"], ["D1.09", "Change the slide size from 4:3 to Widescreen (16:9).", ["1.2.1"], [], "web"], ["D1.10", "Add slide numbers and a footer to every slide except the title slide.", ["2.2.3"], [], "web"], ["D1.11", "Write speaker notes, set the Title property, then print notes pages and a 3-per-page handout and export a PDF.", ["1.2.3", "1.3.1", "1.3.2", "1.3.3", "1.5.6"], ["N15", "N16", "N17"], "both-check"]], "skillcheck": {"id": "SC1", "covers": ["1.2.1", "1.2.3", "2.1.3", "2.1.5", "2.2.1", "2.2.3", "2.3.1", "2.3.2", "2.3.3", "3.1.1", "3.1.2", "3.1.3"], "desc": "Timed, MOS-style: 13 tasks on a club orientation deck, auto-checked by the Office Trainer, 2 attempts."}, "project": {"id": "P1", "title": "Explainer Presentation", "desc": "An 8 to 10 slide presentation that teaches something you know well (a skill, a place, a process), built from a Word outline or your own: sections, a clear title on every slide, lists, slide numbers, speaker notes, and a PDF handout.", "criteria": [["P1-a", "The presentation is organized: sections in a logical order, one idea per slide, a clear title on every slide.", ["CLO3"], 25], ["P1-b", "Text is formatted with PowerPoint's tools on purpose: layouts and placeholders, lists and levels, readable sizes (no text boxes faking layouts).", ["CLO1", "CLO2"], 25], ["P1-c", "Speaker notes carry the detail, so the slides stay short.", ["CLO3"], 20], ["P1-d", "Ready to share: slide numbers and footer, Title property, and a PDF handout that matches the slides.", ["CLO1"], 30]]}, "ai": "Optional: ask an AI tool to turn your topic into an outline, then cut it down to what you can explain yourself. Check every fact it adds.", "privacy": "Use your own topic or a made-up one. Don't put classmates' names, photos or personal details on slides.", "platform": "Most of this week works in PowerPoint for the web. Outline and Notes Page views, the Quick Access Toolbar, Reuse Slides, Slides from Outline, WordArt styles and text columns need desktop PowerPoint.", "nace": ["Communication", "Technology", "Professionalism"], "digcomp": ["Content creation", "Communication and collaboration"], "wcag": ["2.4.2", "2.4.6", "1.3.1"], "life": "A reusable, clearly organized presentation and the habit of putting details in the notes.", "hours": "About 9 hours: 2 h lessons and videos, 3 h drills, 1 h skill check, 3 h project"}, {"id": "W2", "n": 2, "title": "Design That Works", "tagline": "Themes, backgrounds, the slide master and templates: set the look once and reuse it.", "clos": {"CLO1": "R", "CLO2": "RA", "CLO3": "RA"}, "topics": ["T2", "T3", "T6"], "why": {"college": "A consistent look makes a group project feel like one presentation, not five.", "work": "Companies hand out a branded template; knowing the slide master is how you use it without breaking it.", "life": "A good template turns every future slideshow (a toast, a fundraiser) into a fill-in-the-blanks job."}, "objectives": [["W2.1", "Apply and vary a theme, and change the background of one slide.", ["CLO1", "CLO2"]], ["W2.2", "Edit the slide master: its theme, background and content, and create and modify layouts.", ["CLO2"]], ["W2.3", "Modify the handout master and the notes master.", ["CLO2"]], ["W2.4", "Save and use a presentation template (.potx).", ["CLO2", "CLO3"]], ["W2.5", "Clean up a cluttered deck with design principles: contrast, consistent fonts, less text per slide.", ["CLO3"]]], "drills": [["D2.01", "Apply a theme, pick one of its variants, and change the theme fonts.", [], ["N5"], "web"], ["D2.02", "Give the title slide a picture background and one other slide a solid fill, without changing the rest.", ["2.2.2"], [], "web"], ["D2.03", "In the slide master, change the background, add the logo to every slide and set the title font.", ["1.1.1", "1.1.2"], [], "desktop"], ["D2.04", "Create a Quote layout with a picture placeholder, rename it, and change an existing layout's title position.", ["1.1.3", "1.1.4"], [], "desktop"], ["D2.05", "Set the handout master to 3 slides per page with a header, and add the date and footer to the notes master.", ["1.1.5", "1.1.6"], [], "desktop"], ["D2.06", "Save the branded deck as a template, Lastname_Lakeshore.potx, and start a new presentation from it.", [], [], "desktop"], ["D2.07", "Fix a cluttered deck: replace a novelty font everywhere, fix low-contrast text, and split a wall-of-text slide in two.", [], ["N13"], "web"]], "skillcheck": {"id": "SC2", "covers": ["1.1.1", "1.1.2", "1.1.3", "1.1.4", "1.1.5", "1.1.6", "2.2.2"], "desc": "Timed, MOS-style: 10 tasks on a company kickoff deck (themes, backgrounds, master, layouts, handout and notes masters), auto-checked, 2 attempts. Most tasks need desktop PowerPoint."}, "project": {"id": "P2", "title": "Brand Template and Deck", "desc": "A template (.potx) for a real or made-up organization: a slide master with a logo and theme, at least two custom layouts, handout and notes masters set up, and a 6-slide presentation built from it that follows the design checklist.", "criteria": [["P2-a", "The slide master does the work: theme, fonts, background and logo set once, not slide by slide.", ["CLO2"], 30], ["P2-b", "Custom layouts are named, useful and used in the deck.", ["CLO2"], 20], ["P2-c", "The deck follows the design checklist: contrast, consistent fonts, short text, one idea per slide.", ["CLO3"], 30], ["P2-d", "Handout and notes masters are set up, and the template opens as a new presentation.", ["CLO1"], 20]]}, "ai": "Optional: ask an AI tool for a color palette and font pair for your organization, then check the contrast yourself before you use it.", "privacy": "Use a made-up organization or one you have permission to represent. Don't copy a real company's logo for a fake brand.", "platform": "Themes, variants and backgrounds work in PowerPoint for the web. The slide master, layouts, handout and notes masters and saving templates need desktop PowerPoint.", "nace": ["Communication", "Professionalism", "Technology"], "digcomp": ["Content creation"], "wcag": ["1.4.3", "1.3.1"], "life": "A template you can reuse, and an eye for slides that are easy to read.", "hours": "About 9 hours: 2 h lessons, 2.5 h drills, 1 h skill check, 3.5 h project"}, {"id": "W3", "n": 3, "title": "Visual Slides", "tagline": "Pictures, shapes, tables, charts and SmartArt that explain at a glance, with alt text.", "clos": {"CLO4": "IA", "CLO5": "IA", "CLO2": "R", "CLO3": "R"}, "topics": ["T5", "T6"], "why": {"college": "A chart or a diagram often explains a result faster than a paragraph on a slide.", "work": "Status updates, budgets and process changes are shown as tables, charts and diagrams.", "life": "Photos and simple diagrams make event and family slideshows worth watching."}, "objectives": [["W3.1", "Insert, resize, crop and style pictures and screenshots, and give every graphic alt text.", ["CLO4"]], ["W3.2", "Insert and format shapes, text boxes and ink, and order, align and group slide content.", ["CLO4", "CLO2"]], ["W3.3", "Create and format tables: rows, columns and table styles.", ["CLO5"]], ["W3.4", "Create and modify charts, and build SmartArt from scratch or from a list.", ["CLO2", "CLO3"]]], "drills": [["D3.01", "Insert the kayak photo, resize it without stretching, and crop it to a square.", ["3.3.1"], ["N7"], "web"], ["D3.02", "Apply a picture style and an effect, give the photos alt text, and insert a screen clipping.", ["3.3.2", "3.3.3", "3.4.7"], [], "desktop"], ["D3.03", "Insert a callout shape and a text box, add text, size them exactly, and apply a shape style.", ["3.4.1", "3.4.3", "3.4.4", "3.4.5", "3.4.6"], ["N8"], "web"], ["D3.04", "Bring the logo to the front, align three icons and distribute them, group them, turn on guides, and draw an ink circle.", ["3.4.2", "3.5.1", "3.5.2", "3.5.3", "3.5.4"], [], "web"], ["D3.05", "Insert a 4-column price table, add a row, delete a column and apply a table style.", ["4.1.1", "4.1.2", "4.1.3"], [], "web"], ["D3.06", "Insert a clustered column chart of season rentals, change its type, and add a title and data labels.", ["4.2.1", "4.2.2"], ["N7"], "desktop"], ["D3.07", "Convert the safety list to a SmartArt process, add a step, change its layout and colors, and convert another SmartArt back to text.", ["4.3.1", "4.3.2", "4.3.3"], [], "desktop"]], "skillcheck": {"id": "SC3", "covers": ["3.3.1", "3.3.2", "3.4.1", "3.4.3", "3.4.4", "3.4.5", "3.4.6", "3.4.7", "3.5.1", "3.5.2", "3.5.3", "4.1.1", "4.1.2", "4.1.3", "4.2.1", "4.2.2", "4.3.1", "4.3.3"], "desc": "Timed, MOS-style: 14 tasks on a season report deck (pictures, shapes, a table, a chart and SmartArt, with alt text), auto-checked, 2 attempts."}, "project": {"id": "P3", "title": "Data Story", "desc": "A 6 to 8 slide presentation that tells one finding with data (from a class, a club, a job with permission, or public data): a table, a chart that makes the point, a SmartArt process or cycle, pictures, and alt text on every graphic.", "criteria": [["P3-a", "The table and chart fit the data and support one clear finding.", ["CLO5", "CLO3"], 30], ["P3-b", "Pictures, shapes and SmartArt explain, rather than decorate, and are aligned and grouped neatly.", ["CLO4"], 25], ["P3-c", "Every graphic has useful alt text or is marked decorative.", ["CLO4"], 20], ["P3-d", "The data and sources are honest and cited on the slide or in the notes.", ["CLO3", "CLO2"], 25]]}, "ai": "Optional: ask an AI tool to suggest which chart type fits your data, then explain in your notes why you agreed or chose another.", "privacy": "Use public or made-up data. Don't show anyone's grades, health or contact details, and use photos you took or have the right to use.", "platform": "Pictures, shapes, ink, tables and alignment work in PowerPoint for the web. Screen clippings, editing chart data and some SmartArt changes need desktop PowerPoint.", "nace": ["Communication", "Critical Thinking", "Technology"], "digcomp": ["Content creation", "Information search, evaluation and management"], "wcag": ["1.1.1", "1.4.1", "1.3.1"], "life": "Charts and diagrams that make one point, and alt text as a habit.", "hours": "About 9 hours: 2.5 h lessons, 3 h drills, 1 h skill check, 2.5 h project"}, {"id": "W4", "n": 4, "title": "Motion, Media and Links", "tagline": "Transitions, animations, video and navigation that help the story instead of distracting from it.", "clos": {"CLO6": "IA", "CLO4": "RA", "CLO2": "R", "CLO3": "R"}, "topics": ["T4", "T5", "T7"], "why": {"college": "Revealing one point at a time keeps an audience with you; a short video clip can replace a paragraph.", "work": "Training decks, kiosk loops and product demos use motion, media and links to let people explore.", "life": "A photo slideshow with music and smooth transitions is the classic party presentation."}, "objectives": [["W4.1", "Apply basic and 3D transitions and set their effect options, duration and advance timing.", ["CLO6"]], ["W4.2", "Animate text and graphics with entrance, emphasis, exit and motion-path effects, and set their timing and order.", ["CLO6"]], ["W4.3", "Insert and trim video and audio, set playback options, insert a screen recording, and insert and animate 3D models.", ["CLO4", "CLO6"]], ["W4.4", "Add hyperlinks, action buttons and Summary, Section and Slide Zoom links.", ["CLO2", "CLO3"]]], "drills": [["D4.01", "Apply Fade to every at reveal one idea at a time, a video or audio clip, and links back to the menu.", "criteria": [["P4-a", "Animations and transitions serve the story: they reveal ideas in order, with sensible timing, and never distract.", ["CLO6"], 30], ["P4-b", "Navigation works: the Zoom menu, links and action buttons all go where they should.", ["CLO3", "CLO2"], 25], ["P4-c", "Media is trimmed, set to play the right way, and captioned or described.", ["CLO4"], 25], ["P4-d", "The tour runs on its own or by clicking without dead ends, and has a clear start and end.", ["CLO3"], 20]]}, "ai": "Optional: ask an AI tool to write a 30-second script for your video clip, then record it in your own words.", "privacy": "Record only your own screen and voice. Close email and messages before a screen recording, and get permission before you include anyone else's voice or face.", "platform": "Transitions, most animations and hyperlinks work in PowerPoint for the web. Trimming media, playback options, screen recordings, 3D model animation, motion paths and Zoom need desktop PowerPoint.", "nace": ["Communication", "Technology", "Critical Thinking"], "digcomp": ["Content creation", "Safety, wellbeing and responsible use"], "wcag": ["2.2.2", "2.3.1", "1.2.2", "2.4.4"], "life": "Motion and media used with restraint, and navigation people can follow.", "hours": "About 9 hours: 2.5 h lessons, 3 h drills, 1 h skill check, 2.5 h project"}, {"id": "W5", "n": 5, "title": "Present and Collaborate", "tagline": "Review with others, compare and combine their changes, then rehearse, deliver and share safely. Capstone and certification practice.", "clos": {"CLO7": "IA", "CLO3": "A", "CLO1": "RA", "CLO2": "RA", "CLO4": "A", "CLO5": "A", "CLO6": "A"}, "topics": ["T8", "T9"], "why": {"college": "Group presentations are written together and rehearsed together; feedback arrives as comments.", "work": "A deck goes through reviewers before a client sees it, and someone has to merge their changes and run the show.", "life": "Presenting with confidence, notes in hand, is a skill that carries far beyond slides."}, "objectives": [["W5.1", "Add, reply to, resolve and delete comments, and co-author a shared presentation.", ["CLO7"]], ["W5.2", "Compare a reviewer's copy with yours, accept and reject the differences, and combine the result.", ["CLO7"]], ["W5.3", "Create custom shows, set slide show options, rehearse timings, set recording options and present with Presenter View.", ["CLO3", "CLO1"]], ["W5.4", "Inspect, fix accessibility, restrict editing, protect with a password, preserve fonts and export to other formats.", ["CLO1", "CLO7"]], ["W5.5", "Show exam readiness on a timed MO-310 style practice test and assemble a course portfolio.", ["CLO1", "CLO2", "CLO3", "CLO4", "CLO5", "CLO6", "CLO7"]]], "drills": [["D5.01", "Add a comment, reply to and resolve a reviewer's comment, and delete an old one.", ["1.5.4"], [], "web"], ["D5.02", "Co-edit a shared copy with a partner, then restore an earlier version from version history.", [], [], "both-check"], ["D5.03", "Compare the deck with a reviewer's copy, accept the title and price changes, reject the color change, and end the review.", [], [], "desktop"], ["D5.04", "Create a custom show of the short tour, and set the show to loop until Esc and browse at a kiosk.", ["1.4.1", "1.4.2"], [], "desktop"], ["D5.05", "Rehearse timings for the tour, check the recording options, and practice with Presenter View.", ["1.4.3", "1.4.4", "1.4.5"], ["N14"], "desktop"], ["D5.06", "Inspect the deck, fix every accessibility issue, embed the fonts, mark it as final and add a password.", ["1.5.1", "1.5.2", "1.5.3", "1.5.5"], [], "desktop"], ["D5.07", "Export the deck as a PDF and a video, and create handouts in Word.", ["1.5.6"], [], "both-check"]], "skillcheck": {"id": "SC5", "covers": ["1.4.1", "1.4.2", "1.4.3", "1.5.3", "1.5.4", "1.5.5"], "desc": "Timed, MOS-style: 11 tasks on a team presentation (comments, a custom show, show options, timings, inspection and accessibility), auto-checked, 2 attempts."}, "project": {"id": "P5", "title": "Team Presentation", "desc": "With one or two classmates, build a 10 to 12 slide presentation together in OneDrive: comment threads, a reviewer's copy compared and combined, rehearsed timings and speaker notes, a custom short version, and a clean final copy (inspected, accessible, fonts embedded) exported as a PDF and a video. Deliver it live or recorded.", "criteria": [["P5-a", "The team collaborated for real: comment threads with replies, edits from each member, and a compared and combined reviewer's copy.", ["CLO7"], 25], ["P5-b", "The presentation is professional: clear story, consistent design, notes for every slide, a custom short version.", ["CLO3"], 25], ["P5-c", "The delivery is rehearsed: timings, Presenter View or a recording, within the time limit.", ["CLO3", "CLO1"], 25], ["P5-d", "The final copy ships clean: inspected, accessible, fonts embedded, exported as PDF and video.", ["CLO1", "CLO7"], 25]]}, "capstone": {"id": "CAP", "title": "Capstone: Practice Exam and Portfolio", "desc": "A timed, 50-minute MO-310 style practice exam covering all five domains (Certiport practice tests if FLCC has access; otherwise the Office Trainer capstone set), plus a portfolio of the five projects with a short reflection on which skills you will use next and where.", "clos": ["CLO1", "CLO2", "CLO3", "CLO4", "CLO5", "CLO6", "CLO7"]}, "ai": "Optional: Copilot in PowerPoint can draft speaker notes or summarize a deck. Treat it like a reviewer's comment: check it, then decide.", "privacy": "Shared decks carry hidden data: names in comments, notes and file properties. Inspect before you share outside the team, and share view-only unless people need to edit.", "platform": "Comments, co-authoring, version history and the accessibility checker work in PowerPoint for the web. Compare, custom shows, show options, rehearsed timings, recording, Inspect Document, passwords, embedding fonts and video export need desktop PowerPoint.", "nace": ["Teamwork", "Communication", "Professionalism", "Career & Self-Development"], "digcomp": ["Communication and collaboration", "Safety, wellbeing and responsible use"], "wcag": ["1.1.1", "1.3.2", "2.4.2", "2.4.6"], "life": "Confident delivery and safe sharing habits - plus a certification attempt if wanted.", "hours": "About 9 hours: 1.5 h lessons, 2 h drills, 1 h skill check, 2.5 h project, 2 h capstone"}], "grading": [["Practice drills (completion, unlimited tries)", 15], ["Weekly skill checks SC1-SC5 (4% each)", 20], ["Projects P1-P4 (10% each)", 40], ["Project P5 Team Presentation", 10], ["Capstone practice exam and portfolio", 15]], "northstar": [["N1", "Open a new or existing PowerPoint presentation.", "W1", "D1.01"], ["N2", "Identify parts of the PowerPoint screen (slide navigation pane, slide pane, notes, the ribbon, quick access toolbar, and scroll bars).", "W1", "D1.02"], ["N3", "Insert new slides, duplicate, or reuse slides.", "W1", "D1.04"], ["N4", "Manage text (insert, delete, copy, cut and paste, drag and drop, format, and use spellcheck).", "W1", "D1.07"], ["N5", "Apply or change a theme.", "W2", "D2.01"], ["N6", "Use zoom control.", "W1", "D1.02"], ["N7", "Insert items into a presentation, resize, and adjust them (video, chart, pictures, clip art, screenshots).", "W3", "D3.01, D3.06, D4.06"], ["N8", "Add a textbox, adjust it, resize it, or delete it.", "W3", "D3.03"], ["N9", "Change the view (normal view, slide sorter, reading view, slideshow view).", "W1", "D1.02"], ["N10", "Insert, delete, and move slides using slide navigation pane.", "W1", "D1.06"], ["N11", "Use the quick access toolbar.", "W1", "D1.03"], ["N12", "Apply and customize slide transitions (select, preview, add sound, automatic advance).", "W4", "D4.01, D4.02"], ["N13", "Understand the basics of PowerPoint etiquette (limited text, text that stands out on background, clear titles).", "W2", "D2.07"], ["N14", "Play a slideshow, advance through the W5"], ["Inspect Document, passwords, embed fonts, Mark as Final", "No", "Yes", "W5"], ["Export as PDF", "Yes", "Yes", "W1, W5"], ["Export as video, handouts in Word", "No", "Yes", "W5"], ["Accessibility checker", "Yes", "Yes", "W5"]], "conventions": [["Presentation design conventions", "Industry convention", "One idea per slide, a real title on every slide, readable sizes (about 24 pt and up for body text), high contrast, details in the notes.", ["W1", "W2"]], ["Restraint with motion", "Industry convention", "Transitions and animations serve the story; at most one or two kinds per deck; nothing that flashes.", ["W4"]], ["Bloom's revised taxonomy", "Assumption", "Outcome verbs sit mostly at Apply; building a professional slide show (CLO 3) reaches Create, and peer review reaches Evaluate.", ["All"]], ["Credit hour (about 45 hours per credit)", "Assumption", "CSC 136 is 1 credit; 9 hours a week for 5 weeks.", ["All"]], ["I / R / A curriculum mapping", "Common practice", "Introduced, Reinforced, Assessed - the standard way to show where an outcome is taught and measured.", ["All"]]], "decisions": [["CLO 7 can be taught as written", "info", "Unlike Excel, PowerPoint still has a working Review > Compare that merges a reviewer's copy into yours (desktop PowerPoint for Windows and Mac). Week 5 teaches it alongside co-authoring and comments, which is how most teams work today."], ["Make CLO 2 measurable", "flag", "\"Demonstrate features offered by the application\" is hard to assess on its own. It is mapped to every week here. Consider rewording to \"Use PowerPoint's design, media and delivery features to build and present slide shows.\""], ["CLO 3 is the heart of the course", "info", "\"Create a professional presentation slide show\" is assessed in every project's rubric (organization, design, delivery), not just with auto-checks, because professional is a judgment."], ["Exam number", "flag", "Microsoft's current PowerPoint Associate exam for Microsoft 365 Apps is MO-310 (MO-300 was the Office 2019 version). There is no PowerPoint Expert exam. Check which exam FLCC's Certiport setup offers."], ["Plan for desktop PowerPoint", "flag", "Week 2 (slide master) and Weeks 4 and 5 include features that need desktop PowerPoint (layouts, media trimming, Zoom, Compare, custom shows, rehearsed timings, Inspect Document, video export). Chromebook users will need campus labs or a virtual desktop for those tasks. Each drill is tagged web or desktop."], ["Motion with restraint", "info", "Animation (CLO 6) is taught with accessibility in mind: no flashing, sensible timing, and a way to pause self-running shows (WCAG 2.2.2, 2.3.1)."], ["Accessibility is built in, not bolted on", "info", "A unique title on every slide, real layouts and placeholders, alt text, reading order, contrast and captions are taught as normal practice, and the accessibility checker is part of the final check (ADA Title II, WCAG 2.1 AA)."], ["Privacy by design", "info", "Made-up or permitted topics, photos and data; no classmates' details on slides; screen recordings of your own screen only; Inspect Document before sharing."], ["Northstar as a diagnostic", "info", "All 17 Northstar PowerPoint standards are covered, 11 of them in Week 1. If FLCC has a Northstar site license, use it as a Day 1 pre-assessment and a Week 1 post-check."]], "sources": [["CSC 136 PowerPoint - course description (FLCC catalog)", "https://flcc.smartcatalogiq.com/en/current/catalog/course-descriptions/csc-computer-science/100/csc-136"], ["CSC 136 PowerPoint - course outline with outcomes (FLCC)", "https://cyber.flcc.edu/pdf/syllabi/CSC136.pdf"], ["MOS PowerPoint Associate (Microsoft 365 Apps), exam MO-310 - Microsoft Learn", "https://learn.microsoft.com/en-us/credentials/certifications/mos-powerpoint-associate-m365-apps/"], ["PowerPoint (Microsoft 365 Apps) Exam MO-310 objective domains (CCI Learning copy)", "https://products.ccilearning.com/wp-content/uploads/2023/12/MOS-365-PPT-2022-OD.pdf"], ["Northstar <script>
/* =========================================================================
   PowerPoint Course Map - interactive view
   How this script works, in plain terms:
   1. Read the course data (JSON) that sits in the <script> tag above.
   2. Build each tab's content with small helper functions.
   3. Wire up keyboard-friendly tabs, the week ruler and the filters.
   Security note: every piece of text goes in with textContent (never
   innerHTML), so nothing in the data can inject code into the page.
   ========================================================================= */
(function () {
  "use strict";

  // ---- 1. Load the data ---------------------------------------------------
  const DATA = JSON.parse(document.getElementById("course-data").textContent);
  const WEEKS = DATA.weeks;

  // ---- 2. Tiny helpers -----------------------------------------------------

  /**
   * el("p", {class: "muted"}, "Hello") makes <p class="muted">Hello</p>.
   * attrs: plain attributes; "on" + event name (onclick) adds a listener.
   * children: strings (added as safe text) or elements, or arrays of those.
   */
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key.startsWith("on") && typeof value === "function") {
        node.addEventListener(key.slice(2), value);
      } else if (value === true) {
        node.setAttribute(key, "");
      } else {
        node.setAttribute(key, String(value));
      }
    }
    appendAll(node, children);
    return node;
  }
  function appendAll(node, children) {
    for (const child of children.flat(Infinity)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
  }

  // Look-ups we use a lot
  const weekById = Object.fromEntries(WEEKS.map(w => [w.id, w]));
  const cloById = Object.fromEntries(DATA.clos.map(c => [c.id, c]));
  const topicById = Object.fromEntries(DATA.topics.map(t => [t.id, t]));
  const LEVEL_NAMES = { I: "Introduced", R: "Reinforced", A: "Assessed" };
  const PLATFORM_LABEL = { "web": "Web + desktop", "desktop": "Desktop only", "both-check": "Self-check" };
  const PLATFORM_CLASS = { "web": "web", "desktop": "desktop", "both-check": "both" };
  const STATUS_LABEL = { full: "Covered", partial: "Partly covered", none: "Not covered" };
  const weekLabel = id => "Week " + id.slice(1);

  // The MOS crosswalk filter controls. Declared up here because the panels
  // are built (and these are filled in) before the code further down runs.
  let mosSearch, mosDomain, mosWeek, mosCount, mosBody;

  /** I/R/A marks for a level string such as "IA" */
  function marks(level) {
    if (!level) return el("span", { class: "visually-hidden" }, "not addressed");
    return el("span", { class: "marks" },

      t.weeks.map(weekLabel).join(", "), DATA.topicHow[t.id]], { rowHeader: true }));
    return el("div", { class: "stack-lg" },
      section("Evidence for each course learning outcome",
        el("p", { class: "muted" }, "Where each official outcome is taught, practiced and measured, and which learner artifact proves it."),
        el("div", { class: "evidence-grid" }, cards)),
      section("Topic outline evidence",
        table(["Topic (verbatim)", "Weeks", "How it is met"], topicRows, { label: "Topic evidence" })));
  }

  function buildStandards() {
    const nav = el("nav", { class: "subnav", "aria-label": "Standards on this tab" },
      [["std-northstar", "Northstar"], ["std-nace", "NACE"], ["std-digcomp", "DigComp 3.0"], ["std-wcag", "WCAG / ADA"], ["std-platform", "Web vs desktop"], ["std-conv", "Conventions and assumptions"]]
        .map(([id, label]) => el("a", { href: "#" + id, onclick: (e) => { e.preventDefault(); document.getElementById(id).scrollIntoView({ block: "start" }); document.getElementById(id).focus(); } }, label)));
    const sec = (id, title, intro, tbl) => el("section", { class: "stack", id, tabindex: "-1" }, el("h2", {}, title), intro ? el("p", { class: "muted" }, intro) : null, tbl);
    const wl = arr => arr.map(x => x === "All" ? "All" : weekLabel(x)).join(", ");
    return el("div", { class: "stack-lg" }, nav,
      sec("std-northstar", "Northstar Digital Literacy: Microsoft PowerPoint",
        "A free, widely used baseline. All 17 standards are covered, most of them in Week 1, so Northstar works as a Day 1 diagnostic.",
        table(["Code", "Standard (verbatim)", "Week", "Drill"], DATA.northstar.map(n => row([n[0], n[1], weekLabel(n[2]), n[3]], { numCols: [0] })), { label: "Northstar" })),
      sec("std-nace", "NACE Career Readiness Competencies",
        "Employer-validated competencies from the National Association of Colleges and Employers.",
        table(["Competency", "Weeks", "Where it shows up"], DATA.nace.map(n => row([n[0], wl(n[1]), n[2]])), { label: "NACE" })),
      sec("std-digcomp", "DigComp 3.0 (European Digital Competence Framework)",
        "Released December 2025. Mapped at the level of its five competence areas.",
        table(["Competence area", "Weeks", "Where it shows up"], DATA.digcomp.map(n => row([n[0], wl(n[1]), n[2]])), { label: "DigComp" })),
      sec("std-wcag", "Accessibility: WCAG 2.1 AA (ADA Title II)",
        "Success criteria learners practice in PowerPoint. The DOJ moved Title II compliance to April 26, 2027 (entities of 50,000+) and April 26, 2028 (smaller); documents are covered.",
        table(["Criterion", "Name", "Level", "What learners do in PowerPoint", "Weeks"], DATA.wcag.map(n => row([n[0], n[1], n[2], n[3], wl(n[4])], { numCols: [0] })), { label: "WCAG" })),
      sec("std-platform", "PowerPoint for the web vs desktop PowerPoint",
        `From Microsoft's feature comparison table, which changes often. Drill split: ${S.webDrills} web, ${S.deskDrills} desktop only, ${S.bothDrills} self-check.`,
        table(["Feature", "PowerPoint for the web", "Desktop PowerPoint", "Used in"], DATA.platform.map(p => row([p[0],
          el("span", { class: "pill " + (p[1] === "Yes" ? "web" : "desktop") }, p[1]), p[2], p[3]])), { label: "Platform comparison" })),
      sec("std-conv", "Conventions and assumptions",
        "Labeled honestly: published guides, industry conventions and planning assumptions are not the same thing.",
        table(["Item", "Type", "Note", "Weeks"], DATA.conventions.map(c => row([c[0], el("span", { class: "pill " + (c[1] === "Assumption" ? "flag" : "info") }, c[1]), c[2], wl(c[3])])), { label: "Conventions" }))
    );
  }

  function buildSources() {
    return el("div", { class: "stack-lg" },
      section("Sources",
        el("ul", { class: "stack", style: "padding-left:1.1em;margin:0" }, DATA.sources.map(([t, u]) =>
          el("li", {}, el("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, t))))),
      section("About this page",
        el("p", {}, "This page and the Markdown course map (the master copy) are generated from the same data file, so they always agree. After changing the map, regenerate both together."),
        el("p", { class: "muted" }, "Built as a single file with plain JavaScript. No data leaves the page; the only thing stored is your last tab and theme choice, in this browser.")));
  }

  // ---- 6. Footer -----------------------------------------------------------
  appendAll(document.getElementById("footer"),
    [el("p", {}, `${DATA.course.title} · ${DATA.course.version} · ${DATA.course.author}`)]);

  // ---- 7. Theme toggle (system -> light -> dark) ---------------------------
  const themeBtn = document.getElementById("theme-btn");
  const THEMES = ["system", "light", "dark"];
  function applyTheme(t) {
    if (t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = "Theme: " + t;
    safeSet("wcm-theme", t);
  }
  themeBtn.addEventListener("click", () => {
    const now = document.documentElement.getAttribute("data-theme") || "system";
    applyTheme(THEMES[(THEMES.indexOf(now) + 1) % THEMES.length]);
  });

  // ---- 8. Storage and links (wrapped so they never break the page) ---------
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked - fine */ } }
  function setHash(h) { try { history.replaceState(null, "", "#" + h); } catch (e) { /* sandboxed - fine */ } }

  // ---- 9. Start-up: restore theme, then open the right tab/week -------------
  const savedTheme = safeGet("wcm-theme");
  if (savedTheme && THEMES.includes(savedTheme)) applyTheme(savedTheme);
  const hash = (location.hash || "").slice(1);   // read the link's #token before anything changes it
  selectWeek("W1");
  const weekMatch = /^week-([1-5])$/.exec(hash);
  if (weekMatch) { selectWeek("W" + weekMatch[1]); showTab("map"); }
  else if (TABS.some(t => t.id === hash)) showTab(hash);
  else showTab(TABS.some(t => t.id === safeGet("wcm-tab")) ? safeGet("wcm-tab") : "overview");
})();
</script>

</body>
</html>
